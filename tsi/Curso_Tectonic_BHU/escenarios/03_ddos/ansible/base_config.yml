---
# Banco del Sol - DDoS SYN Flood Scenario
# Base Configuration Playbook
# Configura la infraestructura antes del ataque

- name: "Configurar infraestructura base del Banco del Sol"
  hosts: all
  become: yes
  vars:
    banco_del_sol:
      domain: "bancodelsol.example.com.uy"
      admin_email: "admin@bancodelsol.example.com.uy"
      timezone: "America/Montevideo"
    
  tasks:
    - name: Configurar hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
    
    - name: Configurar /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host }} {{ item }}"
      loop: "{{ groups['all'] }}"
    
    - name: Configurar timezone
      community.general.timezone:
        name: "{{ banco_del_sol.timezone }}"

- name: "Configurar servidor web - Apache/Nginx"
  hosts: webserver
  become: yes
  vars:
    apache_config:
      server_name: "www.bancodelsol.example.com.uy"
      document_root: "/var/www/bancodelsol"
      log_dir: "/var/log/apache2"
      max_keepalive_requests: 100
      keepalive_timeout: 5
      timeout: 60
      max_request_workers: 150
      max_connections_per_child: 1000
      syn_cookie_protection: true
      server_tokens: "Prod"
    
  tasks:
    - name: Actualizar paquetes del sistema
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      tags: packages
    
    - name: Instalar Apache y dependencias
      ansible.builtin.apt:
        name:
          - apache2
          - libapache2-mod-php8.1
          - php8.1
          - php8.1-mysql
          - php8.1-curl
          - php8.1-json
          - php8.1-mbstring
          - php8.1-xml
          - php8.1-zip
          - mysql-client
          - tcpdump
          - iftop
          - nethogs
          - conntrack
          - fail2ban
          - iptables-persistent
          - net-tools
          - sysstat
          - htop
          - curl
          - wget
          - nmap
          - vnstat
          - ipset
        state: present
      tags: packages
    
    - name: Crear directorio del sitio web
      ansible.builtin.file:
        path: "{{ apache_config.document_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
    
    - name: Crear pagina principal del Banco del Sol
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html lang="es">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Banco del Sol - Portal Principal</title>
