      action: "allow"
      direction: "in"
    - name: "deny_all_inbound"
      action: "deny"
      direction: "in"

  workstation:
    - name: "allow_ssh"
      port: 22
      protocol: "tcp"
      source: "10.10.2.0/24"
      action: "allow"
      direction: "in"
    - name: "allow_ssh_mgmt"
      port: 22
      protocol: "tcp"
      source: "10.10.0.0/24"
      action: "allow"
      direction: "in"
    - name: "deny_all_inbound"
      action: "deny"
      direction: "in"

  fileserver:
    - name: "allow_smb"
      port: 445
      protocol: "tcp"
