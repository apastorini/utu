# =============================================================================
# PLAY 6: Configurar fileserver (minimo)
# =============================================================================
- name: "Configurar fileserver - Servicio minimo"
  hosts: fileserver
  become: true

  tasks:
    - name: "Instalar Samba"
      apt:
        name:
          - samba
          - samba-common-bin
        state: present

    - name: "Crear directorio compartido"
      file:
        path: /srv/samba/compartido
        state: directory
        owner: nobody
        group: nogroup
        mode: '0777'

    - name: "Configurar recurso compartido basico"
      copy:
        dest: /etc/samba/smb.conf
        content: |
          [global]
            workgroup = BANCODELSOL
            server string = FileServer - Banco del Sol
            security = user
            map to guest = Bad Password
            log file = /var/log/samba/log.%m
            max log size = 1000

          [compartido]
            path = /srv/samba/compartido
            browseable = yes
            writable = yes
            guest ok = yes
            force user = nobody
        mode: '0644'
      notify: restart samba

    - name: "Asegurar que Samba esta activo"
      systemd:
        name: smbd
        state: started
        enabled: yes

  handlers:
    - name: restart samba
      systemd:
        name: smbd
        state: restarted

# =============================================================================
# PLAY 7: Configurar database (minimo)
# =============================================================================
- name: "Configurar database - Servicio minimo"
  hosts: database
  become: true

  tasks:
    - name: "Instalar MySQL Server"
      apt:
        name:
          - mysql-server
          - mysql-client
        state: present

    - name: "Asegurar que MySQL esta activo"
      systemd:
        name: mysql
        state: started
        enabled: yes

# =============================================================================
# PLAY 8: Configurar domaincontroller (minimo)
# =============================================================================
- name: "Configurar domaincontroller - DNS basico"
  hosts: domaincontroller
  become: true

  tasks:
    - name: "Instalar BIND9 DNS"
      apt:
        name:
          - bind9
          - bind9utils
        state: present

    - name: "Configurar zona DNS forward"
      copy:
        dest: /etc/bind/named.conf.local
        content: |
          zone "bancodelsol.local" {
              type master;
              file "/etc/bind/db.bancodelsol.local";
              allow-query { any; };
          };

          zone "10.10.10.in-addr.arpa" {
              type master;
              file "/etc/bind/db.10.10.10";
              allow-query { any; };
          };

          zone "2.10.10.in-addr.arpa" {
              type master;
              file "/etc/bind/db.10.10.2";
              allow-query { any; };
          };
        mode: '0644'
      notify: restart bind9

    - name: "Crear zona forward bancodelsol.local"
      copy:
        dest: /etc/bind/db.bancodelsol.local
        content: |
          $TTL    604800
          @       IN      SOA     domaincontroller.bancodelsol.local. admin.bancodelsol.local. (
                                  2026071301      ; Serial
                                  604800          ; Refresh
                                  86400           ; Retry
                                  2419200         ; Expire
                                  604800 )        ; Negative Cache TTL

          @       IN      NS      domaincontroller.bancodelsol.local.

          ; Servidores
          domaincontroller    IN      A       10.10.2.5
          webserver           IN      A       10.10.1.10
          mailserver          IN      A       10.10.1.20
          workstation         IN      A       10.10.2.100
          fileserver          IN      A       10.10.2.10
          database            IN      A       10.10.2.20

          ; Alias
          www                 IN      CNAME   webserver.bancodelsol.local.
          mail                IN      CNAME   mailserver.bancodelsol.local.
          ftp                 IN      CNAME   fileserver.bancodelsol.local.

          ; MX record
          @                   IN      MX      10 mailserver.bancodelsol.local.
        mode: '0644'
      notify: restart bind9

    - name: "Asegurar que BIND9 esta activo"
      systemd:
        name: named
        state: started
        enabled: yes

  handlers:
    - name: restart bind9
      systemd:
        name: named
        state: restarted
