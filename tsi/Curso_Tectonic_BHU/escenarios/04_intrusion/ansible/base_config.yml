          # Ultima actualizacion: 2024-06-15
          # Responsable: j.rodriguez

    - name: Crear documentacion tecnica
      ansible.windows.win_copy:
        dest: "C:\\Compartidos\\IT\\documentacion_tecnica.txt"
        content: |
          Documentacion Tecnica - Banco del Sol
          ======================================

          Arquitectura de Red:
          - DMZ: 10.10.1.0/24
          - Internal: 10.10.2.0/24
          - Management: 10.10.0.0/24

          Servidores:
          - webserver (10.10.1.10) - Apache/PHP
