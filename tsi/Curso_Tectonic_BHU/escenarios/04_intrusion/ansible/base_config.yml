# ==============================================================================
# Verificacion Final
# ==============================================================================
- name: Verificar configuracion base
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Verificar servicios running
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
      loop:
        - apache2
        - chrony
        - rsyslog
      when: ansible_os_family == "Debian"
      ignore_errors: yes

    - name: Verificar conectividad de red
      ansible.builtin.ping:

    - name: Verificar que los logs estan activos
      ansible.builtin.command: ls -la /var/log/
      register: log_check
      changed_when: false

    - name: Mostrar resumen de configuracion
      ansible.builtin.debug:
        msg: |
          ============================================
          Configuracion Base Completada
          ============================================
          Servidor: {{ inventory_hostname }}
          IP: {{ ansible_default_ipv4.address }}
          Red: {{ ansible_default_ipv4.network }}
          ============================================
