---
# ==============================================================================
# Escenario 04 - Intrusion y Movimiento Lateral
# Configuracion Base - Banco del Sol
# ==============================================================================
# Este playbook configura la infraestructura base del escenario de intrusion.
# Establece los servidores, aplicaciones, bases de datos y servicios necesarios
# para que el escenario de ataque funcione correctamente.
#
# NOTA: Este playbook se ejecuta DESPUES de clonar las VMs pero ANTES del
# escenario de ataque (after_clone.yml).
# ==============================================================================

- name: Configuracion Base - Banco del Sol
  hosts: all
  become: yes
  gather_facts: yes
  vars:
    banco_del_sol:
      domain: "banco-dsol.local"
      app_name: "Banco del Sol Online"
      db_name: "banco_del_sol"
      db_user: "bds_webapp"
      db_password: "W3bApp_D3l_Sol_2024!"
      db_root_password: "Tectonic_DB_2024!"
      web_root: "/var/www/html/banco_del_sol"

  tasks:
    # ==========================================================================
    # Configuracion General
    # ==========================================================================
    - name: Configurar hostname
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}.banco-dsol.local"

    - name: Configurar /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_default_ipv4.address }} {{ item }}.banco-dsol.local {{ item }}"
        state: present
        regexp: ".*{{ item }}.*"
      loop: "{{ groups['all'] }}"

    - name: Instalar paquetes base
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3
          - python3-pip
          - net-tools
          - tcpdump
          - htop
          - iotop
          - unzip
          - vim
          - git
          - chrony
          - rsyslog
        state: present
        update_cache: yes

    - name: Configurar NTP (chrony)
      ansible.builtin.lineinfile:
        path: /etc/chrony/chrony.conf
        line: "server 10.10.0.10 iburst"
        state: present
      notify: restart chrony

    - name: Habilitar servicios de red
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - chrony
        - rsyslog

  handlers:
    - name: restart chrony
      ansible.builtin.systemd:
        name: chrony
        state: restarted

# ==============================================================================
# Configuracion del Webserver
# ==============================================================================
