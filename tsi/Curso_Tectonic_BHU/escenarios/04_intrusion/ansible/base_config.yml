        - "{{ banco_del_sol.app_directory }}"
        - "{{ banco_del_sol.app_directory }}/public"
        - "{{ banco_del_sol.app_directory }}/config"
        - "{{ banco_del_sol.app_directory }}/src"
        - "{{ banco_del_sol.app_directory }}/logs"
        - "{{ banco_del_sol.upload_directory }}"
        - "{{ banco_del_sol.app_directory }}/templates"

    - name: Crear configuracion de base de datos (VULNERABLE - hardcodeada)
