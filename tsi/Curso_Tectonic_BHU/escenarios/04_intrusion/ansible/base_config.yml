          - Semanal: Configuraciones de servidores
          - Mensual: Full backup

    - name: Crear script de auditoria SMB
      ansible.windows.win_copy:
        dest: "C:\\Compartidos\\IT\\auditoria_smb.ps1"
        content: |
          # Script de auditoria de conexiones SMB
          # Ejecutar periodicamente para detectar accesos no autorizados

          $logs = Get-WinEvent -LogName "Security" -FilterXPath "*[System[EventID=4624]]" -MaxEvents 100
          $smbConnections = $logs | Where-Object {
              $_.Properties[8].Value -eq 3 -and
              $_.Properties[5].Value -eq "S-1-0-0"
          }

          $report = @{
              Timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              TotalConnections = $smbConnections.Count
              SuspiciousConnections = ($smbConnections | Where-Object {
                  $_.Properties[18].Value -notmatch "^(10\.10\.2\.|10\.10\.0\.)"
              }).Count
          }

          Write-Output "Reporte de Auditoria SMB:"
          Write-Output "Total de conexiones: $($report.TotalConnections)"
          Write-Output "Conexiones sospechosas: $($report.SuspiciousConnections)"

    - name: Crear script de monitoreo de eventos de seguridad
      ansible.windows.win_copy:
        dest: "C:\\Scripts\\monitor_security_events.ps1"
        content: |
          # Script de monitoreo de eventos de seguridad
          $eventLog = "Security"
          $criticalEvents = @(4624, 4625, 4648, 4672, 4720, 4726, 4728, 4732)

          while ($true) {
              $events = Get-WinEvent -LogName $eventLog -FilterXPath "*[System[(" + ($criticalEvents | ForEach-Object { "EventID=$_" }) -join " or " + ")]]" -MaxEvents 50 -ErrorAction SilentlyContinue

              foreach ($event in $events) {
                  $logEntry = @{
                      Timestamp = $event.TimeCreated
                      EventID = $event.Id
                      Message = $event.Message.Substring(0, [Math]::Min(200, $event.Message.Length))
                      Source = $event.MachineName
                  }

                  # Enviar a SIEM via syslog
                  $syslogMessage = "<14>1 $(Get-Date -Format 'yyyy-MM-ddTHH:mm:ss') fileserver security $($logEntry.EventID) - $($logEntry.Message)"
                  try {
                      $udpClient = New-Object System.Net.Sockets.UdpClient
                      $udpClient.Connect("10.10.2.10", 514)
                      $bytes = [System.Text.Encoding]::ASCII.GetBytes($syslogMessage)
                      $udpClient.Send($bytes, $bytes.Length)
                      $udpClient.Close()
                  } catch {
                      # Silently continue
                  }
              }

              Start-Sleep -Seconds 30
          }

    - name: Crear directorio de scripts
      ansible.windows.win_file:
        path: "C:\\Scripts"
        state: directory

    - name: Copiar script de monitoreo
      ansible.windows.win_copy:
        dest: "C:\\Scripts\\start_monitoring.ps1"
        content: |
          # Iniciar monitoreo de seguridad
          Start-Process powershell -ArgumentList "-File C:\Scripts\monitor_security_events.ps1" -WindowStyle Hidden

    - name: Configurar tarea programada de auditoria
      ansible.windows.win_scheduled_task:
        name: "Auditoria Seguridad Banco del Sol"
        state: present
        actions:
          - path: "powershell.exe"
            arguments: "-File C:\\Scripts\\monitor_security_events.ps1"
        triggers:
          - boot:
              enabled: true
        settings:
          enabled: true
          execution_time_limit: "PT0S"

    - name: Crear carpetas de usuario
      ansible.windows.win_file:
        path: "C:\\Users\\{{ item }}"
        state: directory
      loop:
        - "j.rodriguez"
        - "m.garcia"
        - "c.lopez"
        - "a.martinez"

    - name: Crear archivos de ejemplo en Documentos
      ansible.windows.win_copy:
        dest: "C:\\Compartidos\\Documentos\\politica_seguridad.txt"
        content: |
          Politica de Seguridad - Banco del Sol
          ======================================

          1. Contrasenas
          - Minimo 12 caracteres
          - Debe incluir mayusculas, minusculas, numeros y simbolos
          - Cambiar cada 90 dias
          - No reutilizar las ultimas 5 contrasenas

          2. Acceso a sistemas
          - Usar unico usuario personal
          - No compartir credenciales
          - Bloquear sesiones al ausentarse
          - Reportar accesos no autorizados

          3. Red
          - No conectar dispositivos personales
          - Usar VPN para acceso remoto
          - Reportar sitios web sospechosos

          4. Datos
          - Clasificar informacion segun sensibilidad
          - No enviar datos sensibles por correo sin cifrar
          - Usar cifrado para datos en reposo y transito

    - name: Configurar permisos NTFS de comparticiones
      ansible.windows.win_shell: |
        $shares = @(
          @{Name="Documentos"; Path="C:\Compartidos\Documentos"},
          @{Name="Clientes"; Path="C:\Compartidos\Clientes"},
          @{Name="IT"; Path="C:\Compartidos\IT"}
        )

        foreach ($share in $shares) {
            $acl = Get-Acl -Path $share.Path
            $acl.SetAccessRuleProtection($true, $false)

            # Administrators - Full Control
            $adminRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
                "BUILTIN\Administrators", "FullControl", "ContainerInherit,ObjectInherit", "None", "Allow"
            )
            $acl.AddAccessRule($adminRule)

            Write-Output "Permisos configurados para $($share.Name)"
        }
      args:
        executable: pwsh

    - name: Habilitar comparticiones SMB
      ansible.windows.win_feature:
        name: FS-SMB
        state: present

    - name: Configurar regla de firewall para SMB
      ansible.windows.win_firewall_rule:
        name: "Allow SMB"
        localport: 445
        protocol: tcp
        action: allow
        state: present
        enabled: yes
        direction: in

    - name: Configurar regla de firewall para RDP
      ansible.windows.win_firewall_rule:
        name: "Allow RDP"
        localport: 3389
        protocol: tcp
        action: allow
        state: present
        enabled: yes
        direction: in

    - name: Instalar Sysmon
      block:
        - name: Descargar Sysmon
          ansible.windows.win_get_url:
            url: "https://download.sysinternals.com/files/Sysmon.zip"
            dest: "C:\\Sysmon\\Sysmon.zip"

        - name: Descomprimir Sysmon
          ansible.windows.win_unzip:
            src: "C:\\Sysmon\\Sysmon.zip"
            dest: "C:\\Sysmon"

        - name: Crear configuracion Sysmon
          ansible.windows.win_copy:
            dest: "C:\\Sysmon\\sysmonconfig.xml"
            content: |
              <Sysmon schemaversion="4.90">
                <HashAlgorithms>md5,sha256</HashAlgorithms>
                <CheckRevocation/>
                <EventFiltering>
                  <ProcessCreate onmatch="include">
                    <Image condition="is">C:\Windows\System32\cmd.exe</Image>
                    <Image condition="is">C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe</Image>
                    <Image condition="contains">python</Image>
                    <Image condition="contains">curl</Image>
                  </ProcessCreate>
                  <FileCreate onmatch="include">
                    <TargetFilename condition="contains">.php</TargetFilename>
                    <TargetFilename condition="contains">.aspx</TargetFilename>
                    <TargetFilename condition="contains">.jsp</TargetFilename>
                  </FileCreate>
                  <NetworkConnect onmatch="include">
                    <DestinationPort condition="is">445</DestinationPort>
                    <DestinationPort condition="is">3389</DestinationPort>
                    <DestinationPort condition="is">5985</DestinationPort>
                  </NetworkConnect>
                </EventFiltering>
              </Sysmon>

        - name: Instalar Sysmon
          ansible.windows.win_command: "C:\\Sysmon\\Sysmon64.exe -i C:\\Sysmon\\sysmonconfig.xml"
          register: sysmon_install
          ignore_errors: yes

  ignore_errors: yes

