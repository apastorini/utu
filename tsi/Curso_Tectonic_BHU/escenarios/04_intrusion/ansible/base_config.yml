        - { rule: "allow", port: "22", proto: "tcp", from_ip: "10.10.0.0/24", direction: "in" }
        - { rule: "deny", port: "3306", proto: "tcp", from_ip: "any", direction: "in" }

  handlers:
    - name: restart mysql
      ansible.builtin.systemd:
        name: mysql
        state: restarted

