        dest: "{{ banco_del_sol.app_directory }}/config/database.php"
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <?php
          /**
           * Configuracion de Base de Datos - Banco del Sol Online
           * ================================================
           * NOTA: En produccion, estas credenciales deben estar en variables
           * de entorno o en un vault seguro. Esto es para testing.
           */

          class Database {
              private $host = '{{ banco_del_sol.db_host }}';
              private $port = {{ banco_del_sol.db_port }};
              private $db_name = '{{ banco_del_sol.db_name }}';
              private $username = '{{ banco_del_sol.db_user }}';
              private $password = '{{ banco_del_sol.db_password }}';
              private $conn;

              public function getConnection() {
                  $this->conn = null;
                  try {
                      $dsn = "mysql:host=" . $this->host . ";port=" . $this->port . ";dbname=" . $this->db_name;
                      $this->conn = new PDO($dsn, $this->username, $this->password);
                      $this->conn->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
                  } catch(PDOException $e) {
                      // En produccion, no deberiamos mostrar el error completo
                      error_log("Connection error: " . $e->getMessage());
                      echo "Error de conexion: " . $e->getMessage();
                  }
                  return $this->conn;
              }

              public function query($sql) {
                  $conn = $this->getConnection();
                  $stmt = $conn->prepare($sql);
                  $stmt->execute();
                  return $stmt;
              }

              public function queryDirect($sql) {
                  // METODO VULNERABLE - Ejecuta queries directamente sin sanitizar
                  // ESTE METODO ES INTENCIONALMENTE VULNERABLE
                  $conn = $this->getConnection();
                  $result = $conn->query($sql);
                  return $result;
              }
          }
          ?>

