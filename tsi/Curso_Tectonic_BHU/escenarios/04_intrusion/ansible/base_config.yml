    - name: Instalar Apache y PHP
      ansible.builtin.apt:
        name:
          - apache2
          - php8.1
          - php8.1-cli
          - php8.1-mysql
          - php8.1-json
          - php8.1-curl
          - php8.1-mbstring
          - php8.1-xml
