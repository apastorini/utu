  hosts: webserver
  become: yes
  gather_facts: yes
  vars:
    banco_del_sol:
      db_name: "banco_del_sol"
      db_user: "bds_webapp"
      db_password: "W3bApp_D3l_Sol_2024!"
      db_host: "10.10.2.30"
      db_port: 3306
      app_directory: "/var/www/html/banco_del_sol"
      upload_directory: "/var/www/html/banco_del_sol/uploads"
      log_directory: "/var/www/html/banco_del_sol/logs"

