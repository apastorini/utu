        email: "{{ item.email }}"
        state: present
        groups: "{{ item.groups | default([]) }}"
        domain_username: "Administrator"
        domain_password: "{{ admin_password }}"
        domain_server: "localhost"
      loop: "{{ banco_del_sol.users }}"
      ignore_errors: yes

    - name: Crear grupos de seguridad
      community.windows.win_domain_group:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        scope: "{{ item.scope | default('global') }}"
        state: present
        domain_username: "Administrator"
        domain_password: "{{ admin_password }}"
        domain_server: "localhost"
      loop:
        - { name: "Equipo TI", description: "Personal de Tecnologia de la Informacion", scope: "global" }
        - { name: "Gerentes", description: "Gerentes de Banco del Sol", scope: "global" }
        - { name: "Contabilidad", description: "Departamento de Contabilidad", scope: "global" }
        - { name: "Auditoria", description: "Departamento de Auditoria Interna", scope: "domain" }
      ignore_errors: yes

    - name: Agregar usuarios a grupos
      community.windows.win_domain_group_membership:
        name: "{{ item.group }}"
        members: "{{ item.members }}"
        state: present
        domain_username: "Administrator"
        domain_password: "{{ admin_password }}"
        domain_server: "localhost"
      loop:
        - { group: "Equipo TI", members: ["j.rodriguez", "m.garcia"] }
        - { group: "Gerentes", members: ["c.lopez"] }
        - { group: "Domain Admins", members: ["j.rodriguez", "m.garcia"] }
      ignore_errors: yes

    - name: Configurar auditoria de politicas de grupo
      ansible.windows.win_shell: |
        # Habilitar auditoria de logon
        auditpol /set /subcategory:"Logon" /success:enable /failure:enable
        auditpol /set /subcategory:"Logoff" /success:enable /failure:enable
        auditpol /set /subcategory:"Special Logon" /success:enable /failure:enable
        auditpol /set /subcategory:"Account Lockout" /success:enable /failure:enable
        auditpol /set /subcategory:"Kerberos Service Ticket Operations" /success:enable /failure:enable
        auditpol /set /subcategory:"Credential Validation" /success:enable /failure:enable
        auditpol /set /subcategory:"Security Group Management" /success:enable /failure:enable
        auditpol /set /subcategory:"User Account Management" /success:enable /failure:enable
        auditpol /set /subcategory:"Directory Service Access" /success:enable /failure:enable
        auditpol /set /subcategory:"Directory Service Changes" /success:enable /failure:enable
      ignore_errors: yes

    - name: Configurar auditoria de eventos de seguridad
      ansible.windows.win_shell: |
        # Aumentar tamano del log de seguridad
        wevtutil sl Security /ms:1073741824
        # Aumentar tamano del log de directorio de servicios
        wevtutil sl "Directory Service" /ms:1073741824
        # Configurar retencion de logs
        wevtutil sl Security /rt:true /ab:true
      ignore_errors: yes

    - name: Crear tarea programada de auditoria
      ansible.windows.win_scheduled_task:
        name: "Auditoria Seguridad AD"
        state: present
        actions:
          - path: "powershell.exe"
            arguments: "-Command 'Get-WinEvent -LogName Security -MaxEvents 100 | Export-Csv C:\\Logs\\security_audit.csv'"
        triggers:
          - calendar:
              enabled: true
              schedule: daily
              start_boundary: "2024-01-01T02:00:00"
        settings:
          enabled: true
      ignore_errors: yes

    - name: Crear directorio de logs
      ansible.windows.win_file:
        path: "C:\\Logs"
        state: directory

    - name: Configurar Sysmon en DC
      ansible.windows.win_shell: |
        if (Test-Path "C:\\Sysmon\\Sysmon64.exe") {
            & "C:\\Sysmon\\Sysmon64.exe" -i C:\\Sysmon\\sysmonconfig.xml
        }
      ignore_errors: yes

    - name: Configurar reglas de firewall
      ansible.windows.win_firewall_rule:
        name: "{{ item.name }}"
        localport: "{{ item.port }}"
        protocol: tcp
        action: allow
        state: present
        enabled: yes
        direction: in
      loop:
        - { name: "Allow LDAP", port: 389 }
        - { name: "Allow LDAPS", port: 636 }
        - { name: "Allow Kerberos", port: 88 }
        - { name: "Allow DNS", port: 53 }
        - { name: "Allow SMB", port: 445 }
        - { name: "Allow WinRM", port: 5985 }
        - { name: "Allow RDP", port: 3389 }

    - name: Configurar GPO basica
      ansible.windows.win_shell: |
        # Crear GPO de auditoria
        $gpoName = "Banco del Sol - Auditoria de Seguridad"
        $gpo = New-GPO -Name $gpoName -Comment "Politica de auditoria para Banco del Sol"
        New-GPLink -Guid $gpo.Id -Target "DC=banco-dsol,DC=local"

        # Configurar politica de contrasenas
        $gpoPassword = New-GPO -Name "Banco del Sol - Politica de Contrasenas" -Comment "Politica de contrasenas"
        Set-GPRegistryValue -Name "Banco del Sol - Politica de Contrasenas" -Key "HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters" -ValueName "MinimumPasswordLength" -Value 12 -Type DWord
        Set-GPRegistryValue -Name "Banco del Sol - Politica de Contrasenas" -Key "HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters" -ValueName "MaximumPasswordAge" -Value 90 -Type DWord
        Set-GPRegistryValue -Name "Banco del Sol - Politica de Contrasenas" -Key "HKLM\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters" -ValueName "PasswordHistorySize" -Value 5 -Type DWord
      ignore_errors: yes

# ==============================================================================
# Configuracion del Mail Server
# ==============================================================================
- name: Configurar Mail Server - Banco del Sol
  hosts: mailserver
  become: yes
  gather_facts: yes

  tasks:
    - name: Instalar Postfix y Dovecot
      ansible.builtin.apt:
        name:
          - postfix
          - dovecot-core
          - dovecot-imapd
          - dovecot-pop3d
          - mailutils
          - sasl2-bin
        state: present
        update_cache: yes

    - name: Configurar Postfix
      ansible.builtin.copy:
        dest: /etc/postfix/main.cf
        content: |
          # Configuracion Postfix - Banco del Sol
          smtpd_banner = $myhostname ESMTP
          biff = no
          append_dot_mydomain = no
          readme_directory = no
          compat_level = 2

          # Network
          inet_interfaces = all
          inet_protocols = all

          # Hostname
          myhostname = mail.banco-dsol.local
          mydomain = banco-dsol.local
          myorigin = $mydomain
          mydestination = $myhostname, localhost.$mydomain, localhost, $mydomain
          relay_domains =

          # Mailbox
          home_mailbox = Maildir/
          mailbox_command =

          # Restrictions
          smtpd_recipient_restrictions =
              permit_mynetworks,
              reject_unauth_destination

          mynetworks = 10.10.0.0/24, 127.0.0.0/8

          # Logging
          maillog_file = /var/log/mail.log
      notify: restart postfix

    - name: Configurar Dovecot
      ansible.builtin.copy:
        dest: /etc/dovecot/dovecot.conf
        content: |
          # Configuracion Dovecot - Banco del Sol
          protocols = imap pop3
          listen = *, ::

          # SSL
          ssl = required
          ssl_cert = </etc/ssl/certs/ssl-cert-snakeoil.pem
          ssl_key = </etc/ssl/private/ssl-cert-snakeoil.key

          # Auth
          auth_mechanisms = plain login
          disable_plaintext_auth = yes

          # Mailbox
          mail_location = maildir:~/Maildir
          mail_home_dir = /var/mail/%u

          # Logging
          log_path = /var/log/dovecot.log
      notify: restart dovecot

    - name: Habilitar servicios
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: yes
        state: started
      loop:
        - postfix
        - dovecot

    - name: Configurar firewall mailserver
      community.general.ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        from_ip: "{{ item.from_ip | default('any') }}"
        direction: "{{ item.direction | default('in') }}"
        state: enabled
      loop:
        - { rule: "allow", port: "25", proto: "tcp", from_ip: "any", direction: "in" }
        - { rule: "allow", port: "587", proto: "tcp", from_ip: "any", direction: "in" }
        - { rule: "allow", port: "993", proto: "tcp", from_ip: "any", direction: "in" }
        - { rule: "allow", port: "22", proto: "tcp", from_ip: "10.10.0.0/24", direction: "in" }

  handlers:
    - name: restart postfix
      ansible.builtin.systemd:
        name: postfix
        state: restarted

    - name: restart dovecot
      ansible.builtin.systemd:
        name: dovecot
        state: restarted

