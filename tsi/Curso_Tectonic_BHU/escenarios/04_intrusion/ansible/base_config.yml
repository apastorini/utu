        dest: /etc/logrotate.d/mysql-server
        owner: root
        group: root
        mode: "0644"
        content: |
          /var/log/mysql/*.log {
              daily
              missingok
              rotate 90
              compress
              delaycompress
              notifempty
              create 0640 mysql adm
              sharedscripts
              postrotate
                  /usr/bin/mysqladmin -u root flush-logs 2>/dev/null || true
              endscript
          }

    - name: Crear script de monitoreo de consultas sospechosas
      ansible.builtin.copy:
        dest: /usr/local/bin/check_suspicious_queries.sh
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # Script de monitoreo para consultas sospechosas en MySQL
          LOG_FILE="/var/log/mysql/general.log"
          ALERT_FILE="/var/log/mysql/suspicious_queries.log"
          PATTERNS="UNION.*SELECT|OR.*1.*=.*1|DROP.*TABLE|DELETE.*FROM.*WHERE.*1.*=.*1|INSERT.*INTO.*users|UPDATE.*users.*SET"

          if [ -f "$LOG_FILE" ]; then
              grep -iE "$PATTERNS" "$LOG_FILE" >> "$ALERT_FILE"
              if [ $? -eq 0 ]; then
                  logger -t mysql_monitor "WARNING: Suspicious queries detected in MySQL"
              fi
          fi

    - name: Configurar cron de monitoreo MySQL
      ansible.builtin.cron:
        name: "Monitor consultas sospechosas MySQL"
        minute: "*/5"
        job: "/usr/local/bin/check_suspicious_queries.sh"
        user: root

