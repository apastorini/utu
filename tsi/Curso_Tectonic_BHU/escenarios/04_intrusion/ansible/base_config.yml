    - name: Crear archivo .htaccess para logs
      ansible.builtin.copy:
        dest: "{{ banco_del_sol.app_directory }}/public/.htaccess"
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          # Banco del Sol - Apache Configuration
          RewriteEngine On

          # Redirigir a HTTPS
          RewriteCond %{HTTPS} off
          RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

          # Bloquear acceso a directorio de configuracion
          <Directory "{{ banco_del_sol.app_directory }}/config">
              Require all denied
          </Directory>

          # Bloquear acceso a directorio de logs
          <Directory "{{ banco_del_sol.app_directory }}/logs">
              Require all denied
          </Directory>

    - name: Configurar Apache VirtualHost
      ansible.builtin.copy:
        dest: /etc/apache2/sites-available/banco_del_sol.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          <VirtualHost *:80>
              ServerName banco-dsol.local
              ServerAlias www.banco-dsol.local webserver.banco-dsol.local
              Redirect permanent / https://banco-dsol.local/
          </VirtualHost>

          <VirtualHost *:443>
              ServerName banco-dsol.local
              ServerAlias www.banco-dsol.local webserver.banco-dsol.local
              DocumentRoot /var/www/html/banco_del_sol/public

              SSLEngine on
              SSLCertificateFile /etc/ssl/certs/banco_del_sol.crt
              SSLCertificateKeyFile /etc/ssl/private/banco_del_sol.key

              <Directory /var/www/html/banco_del_sol/public>
                  Options -Indexes +FollowSymLinks
                  AllowOverride All
                  Require all granted
              </Directory>

              # Logging
              ErrorLog ${APACHE_LOG_DIR}/banco_del_sol_error.log
              CustomLog ${APACHE_LOG_DIR}/banco_del_sol_access.log combined

              # LogLevel para capturar mas detalles
              LogLevel info
          </VirtualHost>

    - name: Habilitar modulos de Apache
      apache2.apache_module:
        name: "{{ item }}"
        state: present
      loop:
        - rewrite
        - ssl
        - headers
        - proxy

    - name: Habilitar sitio
      ansible.builtin.command: a2ensite banco_del_sol.conf
      args:
        creates: /etc/apache2/sites-enabled/banco_del_sol.conf

    - name: Deshabilitar sitio default
      ansible.builtin.command: a2dissite 000-default.conf
      args:
        removes: /etc/apache2/sites-enabled/000-default.conf
      ignore_errors: yes

    - name: Generar certificado SSL autofirmado
      ansible.builtin.command: >
        openssl req -x509 -nodes -days 365 -newkey rsa:2048
        -keyout /etc/ssl/private/banco_del_sol.key
        -out /etc/ssl/certs/banco_del_sol.crt
        -subj "/C=UY/ST=Montevideo/L=Montevideo/O=Banco del Sol/OU=IT/CN=banco-dsol.local"
      args:
        creates: /etc/ssl/certs/banco_del_sol.crt

    - name: Configurar permisos de directorios
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: www-data
        group: www-data
        mode: "{{ item.mode }}"
      loop:
        - { path: "/var/www/html/banco_del_sol", mode: "0755" }
        - { path: "/var/www/html/banco_del_sol/public", mode: "0755" }
        - { path: "/var/www/html/banco_del_sol/uploads", mode: "0777" }
        - { path: "/var/www/html/banco_del_sol/logs", mode: "0777" }
        - { path: "/var/www/html/banco_del_sol/config", mode: "0750" }

    - name: Configurar logrotate para logs de aplicacion
      ansible.builtin.copy:
        dest: /etc/logrotate.d/banco_del_sol
        owner: root
        group: root
        mode: "0644"
        content: |
          /var/www/html/banco_del_sol/logs/*.log {
              daily
              missingok
              rotate 90
              compress
              delaycompress
              notifempty
              create 0644 www-data www-data
              sharedscripts
          }

    - name: Iniciar Apache
      ansible.builtin.systemd:
        name: apache2
        enabled: yes
        state: started

    - name: Configurar firewall webserver
      community.general.ufw:
        rule: "{{ item.rule }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto }}"
        from_ip: "{{ item.from_ip | default('any') }}"
        direction: "{{ item.direction | default('in') }}"
        state: enabled
      loop:
        - { rule: "allow", port: "80", proto: "tcp", from_ip: "any", direction: "in" }
        - { rule: "allow", port: "443", proto: "tcp", from_ip: "any", direction: "in" }
        - { rule: "allow", port: "22", proto: "tcp", from_ip: "10.10.0.0/24", direction: "in" }
        - { rule: "allow", port: "3306", proto: "tcp", from_ip: "10.10.2.30", direction: "out" }

# ==============================================================================
# Configuracion del Servidor de Base de Datos
# ==============================================================================
- name: Configurar Database Server - Banco del Sol
  hosts: database
  become: yes
  gather_facts: yes
  vars:
    banco_del_sol:
      db_name: "banco_del_sol"
      db_user: "bds_webapp"
      db_password: "W3bApp_D3l_Sol_2024!"
      db_root_password: "Tectonic_DB_2024!"
      monitor_user: "bds_monitor"
      monitor_password: "M0n1t0r_D3l_Sol_2024!"

  tasks:
    - name: Instalar MySQL Server
      ansible.builtin.apt:
        name:
          - mysql-server-8.0
          - mysql-client-8.0
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Configurar MySQL - Bind Address
      ansible.builtin.lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        line: "bind-address = 0.0.0.0"
        state: present
        regexp: "^bind-address"
      notify: restart mysql

    - name: Configurar MySQL - General Query Log
      ansible.builtin.blockinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        marker: "# {mark} GENERAL LOG CONFIGURATION"
        insertafter: "\\[mysqld\\]"
        block: |
          general_log = 1
          general_log_file = /var/log/mysql/general.log
      notify: restart mysql

    - name: Configurar MySQL - Slow Query Log
      ansible.builtin.blockinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        marker: "# {mark} SLOW QUERY LOG CONFIGURATION"
        insertafter: "\\[mysqld\\]"
        block: |
          slow_query_log = 1
          slow_query_log_file = /var/log/mysql/slow-query.log
          long_query_time = 2
          log_queries_not_using_indexes = 1
      notify: restart mysql

    - name: Configurar MySQL - Binlog
      ansible.builtin.blockinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        marker: "# {mark} BINLOG CONFIGURATION"
