    - name: "FASE 1.2 - Crear logs de deteccion de SQLi - Login form"
      delegate_to: webserver
      become: yes
      ansible.builtin.blockinfile:
        path: /var/log/apache2/access.log
        marker: "# {mark} ATTACK SQLI LOGIN"
        insertafter: EOF
        block: |
          {{ attacker_ip }} - - [{{ attack_start_time }}] "POST /login.php HTTP/1.1" 200 2905 "username=admin'%20OR%20'1'%3D'1&password=test" "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0"
