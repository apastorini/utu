- name: "FASE 2 - Simular colocacion de webshell"
  hosts: webserver
  become: yes
  gather_facts: yes
  vars:
    attacker_ip: "10.10.1.100"
    webserver_ip: "10.10.1.10"
    database_ip: "10.10.2.30"

  tasks:
    - name: "FASE 2 - Iniciar simulacion de webshell"
      ansible.builtin.debug:
