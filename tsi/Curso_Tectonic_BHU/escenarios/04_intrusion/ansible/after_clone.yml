          Objetivo: {{ webserver_ip }}
          Tecnica: T1190 - Exploit Public-Facing Application
          ============================================

    - name: "FASE 1.1 - Crear logs de escaneo inicial"
      delegate_to: webserver
      become: yes
      ansible.builtin.blockinfile:
        path: /var/log/apache2/access.log
        marker: "# {mark} ATTACK SCANNING PHASE"
        insertafter: EOF
        block: |
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET / HTTP/1.1" 200 4523
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /login.php HTTP/1.1" 200 2891
          {{ attacker_ip }} - - [{{ attack_start_time }}] "POST /login.php HTTP/1.1" 200 2905
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /admin/ HTTP/1.1" 403 287
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /phpmyadmin/ HTTP/1.1" 404 199
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /wp-admin/ HTTP/1.1" 404 199
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /robots.txt HTTP/1.1" 200 123
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /.env HTTP/1.1" 403 287
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /config.php HTTP/1.1" 200 891
          {{ attacker_ip }} - - [{{ attack_start_time }}] "GET /search.php HTTP/1.1" 200 1456
