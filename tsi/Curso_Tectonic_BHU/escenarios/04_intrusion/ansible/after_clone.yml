---
# ==============================================================================
# Escenario 04 - Intrusion y Movimiento Lateral
# Simulacion del Ataque - after_clone.yml
# ==============================================================================
# Este playbook simula la cadena de ataque completa contra la infraestructura
# de Banco del Sol. Crea logs, archivos y eventos que los estudiantes deben
# detectar y analizar como equipo de respuesta azul (blue team).
#
# IMPORTANTE: Este playbook se ejecuta DESPUES de base_config.yml y simula
# las acciones del atacante en forma de logs y archivos de evidencia.
#
# Cadena de Ataque:
#   Fase 1: Explotacion Web - Inyeccion SQL
#   Fase 2: Punto de Apoyo Inicial - Webshell
#   Fase 3: Movimiento Lateral
#   Fase 4: Escalamiento de Privilegios
# ==============================================================================

- name: Simular Cadena de Ataque - Banco del Sol
  hosts: localhost
  become: no
  gather_facts: no
  connection: local

  vars:
    attack_start_time: "{{ lookup('pipe', 'date -d \"1 hour ago\" +%Y-%m-%dT%H:%M:%S') }}"
    attacker_ip: "10.10.1.100"
    webserver_ip: "10.10.1.10"
    database_ip: "10.10.2.30"
    fileserver_ip: "10.10.2.20"
    domaincontroller_ip: "10.10.0.10"
    mailserver_ip: "10.10.2.10"
    workstation_ip: "10.10.2.50"

