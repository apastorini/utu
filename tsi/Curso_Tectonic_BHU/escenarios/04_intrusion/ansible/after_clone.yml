          ============================================
          FASE 2: PUNTO DE APOYO INICIAL
          ============================================
          Atacante: {{ attacker_ip }}
          Objetivo: {{ webserver_ip }}
          Tecnica: T1505.003 - Server Software Component: Web Shell
          ============================================

    - name: "FASE 2.1 - Colocar webshell en directorio de uploads"
      ansible.builtin.copy:
        dest: "/var/www/html/banco_del_sol/uploads/shell.php"
        owner: www-data
        group: www-data
        mode: "0644"
        content: |
          <?php
          /**
           * shell.php - Banco del Sol Online
           * =================================
           * Este archivo NO es un webshell real.
           * Es una simulacion para fines educativos.
           * Los comandos no se ejecutan realmente.
           *
           * Si encuentras este archivo, significa que
           * el servidor ha sido comprometido.
           */

          // Simulacion de webshell - NO EJECUTA COMANDOS REALES
          if (isset($_POST['cmd'])) {
              $cmd = $_POST['cmd'];

              // Log de la actividad maliciosa
              $log_entry = date('Y-m-d H:i:s') . " - WEBSHELL ACCESS: cmd=" . $cmd . " from=" . $_SERVER['REMOTE_ADDR'];
              error_log($log_entry, 3, "/var/www/html/banco_del_sol/logs/websell_activity.log");

              // Respuesta simulada
              echo "<pre>";
              echo "Banco del Sol Online - Panel de Administracion\n";
              echo "================================================\n";
              echo "Comando: " . htmlspecialchars($cmd) . "\n";
              echo "Usuario: www-data\n";
              echo "Directorio: " . getcwd() . "\n";
              echo "Fecha: " . date('Y-m-d H:i:s') . "\n";
              echo "</pre>";
          } elseif (isset($_GET['action'])) {
              $action = $_GET['action'];

              // Log de la actividad
              $log_entry = date('Y-m-d H:i:s') . " - WEBSHELL ACTION: " . $action . " from=" . $_SERVER['REMOTE_ADDR'];
              error_log($log_entry, 3, "/var/www/html/banco_del_sol/logs/websell_activity.log");

              echo "<pre>";
              echo "Banco del Sol Online - Sistema de Gestion\n";
              echo "================================================\n";

              switch($action) {
                  case 'info':
                      echo "Sistema: " . php_uname() . "\n";
                      echo "PHP: " . phpversion() . "\n";
                      echo "Servidor: " . $_SERVER['SERVER_SOFTWARE'] . "\n";
                      echo "Documento: " . $_SERVER['DOCUMENT_ROOT'] . "\n";
                      echo "Usuario: " . get_current_user() . "\n";
                      break;
                  case 'files':
                      $files = scandir(getcwd());
                      foreach ($files as $file) {
                          echo $file . "\n";
                      }
                      break;
                  default:
                      echo "Acciones disponibles: info, files\n";
              }
              echo "</pre>";
          } else {
              // Pagina de login falsa
              echo "<!DOCTYPE html>";
              echo "<html><head><title>Banco del Sol - Sistema</title></head>";
              echo "<body>";
              echo "<h1>Banco del Sol Online</h1>";
              echo "<p>Sistema de administracion en mantenimiento.</p>";
              echo "</body></html>";
          }
          ?>

    - name: "FASE 2.2 - Crear log de creacion del webshell"
      ansible.builtin.blockinfile:
        path: /var/www/html/banco_del_sol/logs/websell_activity.log
        marker: "# {mark} WEBSHELL CREATION"
        insertafter: EOF
