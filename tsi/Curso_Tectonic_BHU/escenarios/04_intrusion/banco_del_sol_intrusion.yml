networks:
  - name: "dmz"
    description: "Red de Demilitarizada - Servidores expuestos"
    cidr: "10.10.1.0/24"
    subnet_mask: "255.255.255.0"
    gateway: "10.10.1.1"
    vlan_id: 100
    dhcp: false
    dns_server: "10.10.0.10"
    internet_access: true
    firewall_rules:
      - description: "Permitir HTTP/HTTPS desde Internet"
        direction: "inbound"
        source: "any"
        destination: "10.10.1.10"
        ports: "80,443"
        action: "allow"
      - description: "Permitir SSH desde Management"
        direction: "inbound"
        source: "10.10.0.0/24"
        destination: "any"
        ports: "22"
        action: "allow"
      - description: "Permitir trafico interno DMZ"
        direction: "intra-zone"
        source: "10.10.1.0/24"
        destination: "10.10.1.0/24"
        action: "allow"
      - description: "Bloquear acceso directo DMZ -> Internal"
        direction: "outbound"
        source: "10.10.1.0/24"
        destination: "10.10.2.0/24"
        action: "deny"
      - description: "Permitir webserver a database (MySQL)"
        direction: "outbound"
        source: "10.10.1.10"
        destination: "10.10.2.30"
        ports: "3306"
        action: "allow"
      - description: "Permitir DNS"
        direction: "outbound"
        source: "10.10.1.0/24"
        destination: "10.10.0.10"
        ports: "53"
        action: "allow"

  - name: "internal"
    description: "Red Interna Corporativa - Servidores internos"
    cidr: "10.10.2.0/24"
    subnet_mask: "255.255.255.0"
    gateway: "10.10.2.1"
    vlan_id: 200
    dhcp: false
    dns_server: "10.10.0.10"
    internet_access: true
    firewall_rules:
      - description: "Permitir trafico interno"
        direction: "intra-zone"
        source: "10.10.2.0/24"
        destination: "10.10.2.0/24"
        action: "allow"
      - description: "Permitir SMB desde internal"
        direction: "inbound"
        source: "10.10.2.0/24"
        destination: "10.10.2.20"
        ports: "445,139"
        action: "allow"
      - description: "Permitir MySQL desde webserver"
        direction: "inbound"
        source: "10.10.1.10"
        destination: "10.10.2.30"
        ports: "3306"
        action: "allow"
      - description: "Permitir RDP desde Management"
        direction: "inbound"
        source: "10.10.0.0/24"
        destination: "10.10.2.0/24"
        ports: "3389"
        action: "allow"
      - description: "Permitir acceso a Management"
        direction: "outbound"
        source: "10.10.2.0/24"
        destination: "10.10.0.0/24"
        action: "allow"
      - description: "Bloquear acceso directo Internal -> DMZ"
        direction: "outbound"
        source: "10.10.2.0/24"
        destination: "10.10.1.0/24"
        action: "deny"

  - name: "management"
    description: "Red de Gestion - Administracion de dominio"
    cidr: "10.10.0.0/24"
    subnet_mask: "255.255.255.0"
    gateway: "10.10.0.1"
    vlan_id: 50
    dhcp: false
    dns_server: "10.10.0.10"
    internet_access: true
    firewall_rules:
      - description: "Permitir acceso a DC desde todas las redes"
        direction: "inbound"
        source: "any"
        destination: "10.10.0.10"
        ports: "53,88,135,389,445,636,3268,3269"
        action: "allow"
      - description: "Permitir RDP desde Management"
        direction: "inbound"
        source: "10.10.0.0/24"
        destination: "10.10.0.0/24"
        ports: "3389"
        action: "allow"
      - description: "Permitir WinRM desde Management"
        direction: "inbound"
        source: "10.10.0.0/24"
        destination: "10.10.0.0/24"
        ports: "5985,5986"
        action: "allow"
      - description: "Permitir acceso completo Management"
        direction: "intra-zone"
        source: "10.10.0.0/24"
        destination: "10.10.0.0/24"
        action: "allow"

  - name: "internet"
    description: "Simulacion de Internet"
    cidr: "172.16.0.0/24"
    subnet_mask: "255.255.255.0"
    gateway: "172.16.0.1"
    description: "Simulacion de red externa"

monitoring:
  siem:
    enabled: true
    server: "10.10.2.10"
    port: 514
    protocol: "syslog"
    log_sources:
      - "webserver"
      - "database"
      - "fileserver"
      - "domaincontroller"
      - "mailserver"
      - "workstation"

  snmp:
    enabled: true
    community: "tectonic_2024"
    version: "2c"

  netflow:
    enabled: true
    collector: "10.10.2.10"
    port: 9995
    interface: "eth0"

  ntp:
    server: "10.10.0.10"
    stratum: 2

scoring:
  method: "checks"
  total_points: 100
  passing_score: 70
  checks_interval_seconds: 30
  evaluation_delay_seconds: 60
  auto_evaluate: true
  manual_review_required:
    - "SC-06"
    - "SC-08"
    - "SC-10"

  automated_checks:
    - id: "SC-01"
      type: "log_pattern"
      target: "webserver"
      file: "/var/log/apache2/access.log"
      patterns:
        - "(?i)union.*select"
        - "(?i)or.*1.*=.*1"
        - "(?i)comment.*--"
        - "(?i)select.*from"
      expected_count: 5
      points: 5

    - id: "SC-02"
      type: "file_check"
      target: "webserver"
      path: "/var/www/html/uploads/shell.php"
      exists: false
      points: 5

    - id: "SC-03"
      type: "log_pattern"
      target: "database"
      file: "/var/log/mysql/general.log"
      patterns:
        - "10.10.1.10"
        - "bds_webapp"
      expected_count: 3
      points: 5

    - id: "SC-04"
      type: "event_check"
      target: "fileserver"
      event_log: "Security"
      event_id: 4624
      filters:
        source_ip: "10.10.1.10"
        logon_type: 3
      points: 5

    - id: "SC-05"
      type: "event_check"
      target: "domaincontroller"
      event_log: "Security"
      event_id: 4624
      filters:
        source_ip: "10.10.2.20"
      points: 5

    - id: "SC-09"
      type: "file_check"
      target: "webserver"
      path: "/var/www/html/uploads/shell.php"
      exists: false
      points: 5

  manual_checks:
    - id: "SC-06"
      type: "report_review"
      description: "Documentacion de la cadena de ataque"
      points: 10

    - id: "SC-07"
      type: "network_check"
      target: "webserver"
      description: "Aislamiento del webserver"
      points: 5

    - id: "SC-08"
      type: "credential_check"
      description: "Rotacion de credenciales comprometidas"
      points: 5

    - id: "SC-10"
      type: "vulnerability_check"
      description: "Correccion de la vulnerabilidad SQLi"
      points: 5

hints:
  - id: "H01"
    cost: 5
    category: "Detection"
    text: |
      Revisa los logs de Apache en el webserver (/var/log/apache2/access.log).
      Busca patrones inusuales como UNION SELECT, comillas simples repetidas,
      o strings como ' OR '1'='1 en las URI de las peticiones HTTP.
    target_audience: "Fase 1 - Deteccion"

  - id: "H02"
    cost: 5
    category: "Detection"
    text: |
      El webshell se encuentra en el directorio de uploads de la aplicacion.
      Verifica archivos PHP en /var/www/html/uploads/ que no deberian estar ahi.
      Compara con la lista de archivos legítimos.
    target_audience: "Fase 2 - Analisis"

  - id: "H03"
    cost: 10
    category: "Analysis"
    text: |
      Las credenciales de la base de datos estan configuradas en el archivo
      de conexion PHP de la aplicacion. Busca en /var/www/html/banco_del_sol/config/
      el archivo de configuracion de base de datos.
    target_audience: "Fase 2 - Analisis"

  - id: "H04"
    cost: 10
    category: "Analysis"
    text: |
      En el fileserver existe un archivo de configuracion que contiene
      credenciales de administrador: C:\Compartidos\IT\config_servidores.txt
      Revisa el contenido de los compartidos SMB.
    target_audience: "Fase 3 - Movimiento Lateral"

time_management:
  phase_1_detection:
    recommended_minutes: 30
    critical_findings:
      - "Patron SQLi en webserver"
      - "Errores de base de datos"
      - "Webshell detectado"

  phase_2_analysis:
    recommended_minutes: 45
    critical_findings:
      - "Cadena de ataque documentada"
      - "Credenciales comprometidas identificadas"
      - "Sistemas afectados mapeados"

  phase_3_containment:
    recommended_minutes: 30
    critical_actions:
      - "Aislamiento de webserver"
      - "Bloqueo de IP atacante"
      - "Revocacion de credenciales"

  phase_4_eradication_recovery:
    recommended_minutes: 45
    critical_actions:
      - "Eliminacion de webshell"
      - "Parcheo de vulnerabilidad"
      - "Restablecimiento de credenciales"

  phase_5_documentation:
    recommended_minutes: 30
    deliverables:
      - "Reporte de incidente"
      - "Timeline del ataque"
      - "Recomendaciones de mejora"

rescue_commands:
  - name: "Verificar estado del webserver"
    target: "webserver"
    command: "systemctl status apache2"
    description: "Comprueba que el servicio web esta funcionando"

  - name: "Reiniciar servicios de red"
    target: "webserver"
    command: "systemctl restart networking"
    description: "Reinicia la configuracion de red"

  - name: "Verificar conectividad"
    target: "webserver"
    command: "ping -c 3 10.10.2.30"
    description: "Prueba conectividad hacia base de datos"

  - name: "Verificar estado de MySQL"
    target: "database"
    command: "systemctl status mysql"
    description: "Comprueba que MySQL esta funcionando"

  - name: "Verificar comparticiones SMB"
    target: "fileserver"
    command: "Get-SmbShare"
    description: "Lista las comparticiones SMB activas"

  - name: "Verificar servicios de AD"
    target: "domaincontroller"
    command: "Get-Service ADWS,KDC,Netlogon,DNS"
    description: "Comprueba servicios criticos de Active Directory"

