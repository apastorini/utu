---
lab:
  id: "BHU-TEC-004"
  name: "Banco del Sol - Intrusion y Movimiento Lateral"
  description: |
    Edicion de laboratorio para el escenario de intrusion y movimiento lateral
    contra la infraestructura de Banco del Sol. Este laboratorio simula un
    ataque completo desde la explotacion de una vulnerabilidad web hasta el
    escalamiento de privilegios en el dominio Active Directory.

  edition: "intrusion"
  scenario: "04_intrusion"
  difficulty: "advanced"
  estimated_duration: 180

infrastructure:
  provider: "vmware"
  base_image: "tectonic-base-2024"
  snapshot_before_lab: true
  revert_on_completion: true

  global_settings:
    ntp_server: "10.10.0.10"
    dns_primary: "10.10.0.10"
    dns_secondary: "8.8.8.8"
    syslog_server: "10.10.2.10"
    time_zone: "America/Montevideo"

virtual_machines:
  - name: attacker
    hostname: "attacker.banco-dsol.local"
    description: "Estacion de ataque Kali Linux para simular el adversario"
    os:
      type: "linux"
      distribution: "kali"
      version: "2024.1"
    role: "attacker"
    network_interfaces:
      - name: "eth0"
        network: "dmz"
        ip_address: "10.10.1.100"
        netmask: "255.255.255.0"
        gateway: "10.10.1.1"
        static: true
    resources:
      cpu: 2
      memory_mb: 2048
      disk_gb: 40
    software:
      - nmap
      - sqlmap
      - metasploit-framework
      - burpsuite
      - curl
      - python3
      - impacket-scripts
    configuration:
      desktop_environment: "xfce"
      auto_login: true
      root_password: "tectonic2024"
      ssh_enabled: true

  - name: webserver
    hostname: "webserver.banco-dsol.local"
    description: |
      Servidor web Ubuntu con aplicacion PHP vulnerable a inyeccion SQL.
      Expone la aplicacion bancaria "Banco del Sol Online" en puerto 443 (HTTPS)
      y 80 (HTTP con redireccion). Es el punto de entrada del ataque.
    os:
      type: "linux"
      distribution: "ubuntu"
      version: "22.04 LTS"
    role: "webserver"
    network_interfaces:
      - name: "eth0"
        network: "dmz"
        ip_address: "10.10.1.10"
        netmask: "255.255.255.0"
        gateway: "10.10.1.1"
        static: true
      - name: "eth1"
        network: "internal"
        ip_address: "10.10.2.11"
        netmask: "255.255.255.0"
        gateway: "10.10.2.1"
        static: true
    resources:
      cpu: 2
      memory_mb: 4096
      disk_gb: 60
    software:
      - apache2
      - php8.1
      - php8.1-mysql
      - libapache2-mod-php
      - python3
      - python3-pip
      - mysql-client
      - fail2ban
      - ufw
      - logrotate
    ports:
      - port: 80
        protocol: "tcp"
        state: "open"
        description: "HTTP - Redireccion a HTTPS"
      - port: 443
        protocol: "tcp"
        state: "open"
        description: "HTTPS - Aplicacion bancaria"
      - port: 22
        protocol: "tcp"
        state: "open"
        description: "SSH - Administracion"
    configuration:
      web_root: "/var/www/html"
      app_directory: "/var/www/html/banco_del_sol"
      log_directory: "/var/log/apache2"
      ssl_certificate: "/etc/ssl/certs/banco_del_sol.crt"
      ssl_key: "/etc/ssl/private/banco_del_sol.key"
      apache_config: "/etc/apache2/sites-available/banco_del_sol.conf"
      php_version: "8.1"
      document_root: "/var/www/html/banco_del_sol/public"
      upload_directory: "/var/www/html/banco_del_sol/uploads"
      database_host: "10.10.2.30"
      database_port: 3306
      database_name: "banco_del_sol"
      database_user: "bds_webapp"
      database_password: "W3bApp_D3l_Sol_2024!"
      admin_email: "admin@banco-dsol.local"
      ssh_enabled: true
      root_password: "Tectonic_W3b_2024"

  - name: database
    hostname: "database.banco-dsol.local"
    description: |
      Servidor de base de datos MySQL 8.0 conteniendo la base de datos
      "banco_del_sol" con tablas de clientes, cuentas y transacciones.
      Solo accesible desde la red interna.
    os:
      type: "linux"
      distribution: "ubuntu"
      version: "22.04 LTS"
    role: "database"
    network_interfaces:
      - name: "eth0"
        network: "internal"
        ip_address: "10.10.2.30"
        netmask: "255.255.255.0"
        gateway: "10.10.2.1"
        static: true
    resources:
      cpu: 4
      memory_mb: 8192
      disk_gb: 200
    software:
      - mysql-server-8.0
      - mysql-client-8.0
      - python3
      - python3-pymysql
      - logrotate
    ports:
      - port: 3306
        protocol: "tcp"
        state: "open"
        description: "MySQL - Base de datos"
        allowed_sources:
          - "10.10.2.11"
          - "10.10.2.1"
      - port: 22
        protocol: "tcp"
        state: "open"
        description: "SSH - Administracion"
    configuration:
      mysql_config: "/etc/mysql/mysql.conf.d/mysqld.cnf"
      general_log: true
      general_log_file: "/var/log/mysql/general.log"
      slow_query_log: true
      slow_query_log_file: "/var/log/mysql/slow-query.log"
      log_queries_not_using_indexes: true
      binlog_enabled: true
      server_id: 1
      root_password: "Tectonic_DB_2024!"
      app_user: "bds_webapp"
      app_password: "W3bApp_D3l_Sol_2024!"
      app_database: "banco_del_sol"
      monitoring_user: "bds_monitor"
      monitoring_password: "M0n1t0r_D3l_Sol_2024!"
      ssh_enabled: true

  - name: fileserver
    hostname: "fileserver.banco-dsol.local"
    description: |
      Servidor de archivos Windows Server 2019 con comparticiones SMB
      para documentos corporativos. Contiene archivos sensibles de clientes
      y configuraciones internas. Miembro del dominio banco-dsol.local.
    os:
      type: "windows"
      distribution: "windows_server"
      version: "2019"
    role: "fileserver"
    network_interfaces:
      - name: "eth0"
        network: "internal"
        ip_address: "10.10.2.20"
        netmask: "255.255.255.0"
        gateway: "10.10.2.1"
        static: true
    resources:
      cpu: 2
      memory_mb: 4096
      disk_gb: 500
    software:
      - "File and Storage Services"
      - "DFS Namespaces"
      - "SMB Direct"
      - "PowerShell 5.1"
      - "Sysmon"
      - "Windows Event Forwarding"
    ports:
      - port: 445
        protocol: "tcp"
        state: "open"
        description: "SMB - Comparticiones de archivos"
      - port: 139
        protocol: "tcp"
        state: "open"
        description: "NetBIOS Session"
      - port: 3389
        protocol: "tcp"
        state: "open"
        description: "RDP - Administracion remota"
      - port: 5985
        protocol: "tcp"
        state: "open"
        description: "WinRM HTTP"
    configuration:
      domain: "banco-dsol.local"
      shares:
        - name: "Documentos"
          path: "C:\Compartidos\Documentos"
          description: "Documentos corporativos"
          access_group: "Usuarios Banco del Sol"
          permissions: "Read"
        - name: "Clientes"
          path: "C:\Compartidos\Clientes"
          description: "Archivos de clientes"
          access_group: "Gerentes"
          permissions: "FullControl"
        - name: "IT"
          path: "C:\Compartidos\IT"
          description: "Documentacion tecnica"
          access_group: "Equipo TI"
          permissions: "Read"
        - name: "ADMIN$"
          path: "C:\Windows"
          description: "Comparticion de administracion"
          access_group: "Administrators"
          permissions: "FullControl"
      local_admin_user: "fsadmin"
      local_admin_password: "F1l3Adm1n_2024!"
      service_account: "svc_fileserver"
      service_account_password: "SvC_F1l3S3rv_2024!"
      event_forwarding_enabled: true
      sysmon_installed: true
      audit_policy: "advanced"
      log_retention_days: 90
      suspicious_file: "C:\Compartidos\IT\config_servidores.txt"
      suspicious_file_content: |
        # Configuracion de servidores - Acceso restringido Equipo TI
        # ================================================
        # Servidor Web
        webserver_admin: admin
        webserver_pass: Admin_Web_2024!

        # Base de datos
        db_root: root
        db_root_pass: Tectonic_DB_2024!
        db_app_user: bds_webapp
        db_app_pass: W3bApp_D3l_Sol_2024!

        # Domain Controller
        dc_admin: administrator
        dc_admin_pass: D0m41n_2024!

        # Cuenta de servicio
        svc_domain: svc_domainadmin
        svc_domain_pass: Svc_D0m41n_2024!

  - name: mailserver
    hostname: "mailserver.banco-dsol.local"
    description: |
      Servidor de correo electronico Ubuntu con Postfix y Dovecot.
      Maneja el correo interno de Banco del Sol.
    os:
      type: "linux"
      distribution: "ubuntu"
      version: "22.04 LTS"
    role: "mailserver"
    network_interfaces:
      - name: "eth0"
        network: "internal"
        ip_address: "10.10.2.10"
        netmask: "255.255.255.0"
        gateway: "10.10.2.1"
        static: true
    resources:
      cpu: 2
      memory_mb: 4096
      disk_gb: 100
    software:
      - postfix
      - dovecot
      - roundcube
      - python3
      - logrotate
    ports:
      - port: 25
        protocol: "tcp"
        state: "open"
        description: "SMTP"
      - port: 587
        protocol: "tcp"
        state: "open"
        description: "SMTP Submission"
      - port: 993
        protocol: "tcp"
        state: "open"
        description: "IMAPS"
      - port: 22
        protocol: "tcp"
        state: "open"
        description: "SSH - Administracion"
    configuration:
      domain: "banco-dsol.local"
      smtp_hostname: "mail.banco-dsol.local"
      imap_hostname: "mail.banco-dsol.local"
      mail_directory: "/var/mail"
      log_file: "/var/log/mail.log"
      ssh_enabled: true
      root_password: "Tectonic_Mail_2024"

  - name: domaincontroller
    hostname: "DC01.banco-dsol.local"
    description: |
      Controlador de dominio Windows Server 2019 para el dominio
      banco-dsol.local. Contiene las cuentas de usuario, politicas de
