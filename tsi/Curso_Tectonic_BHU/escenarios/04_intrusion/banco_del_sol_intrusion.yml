    os:
      type: "windows"
      distribution: "windows_server"
      version: "2019"
    role: "domaincontroller"
    network_interfaces:
      - name: "eth0"
        network: "management"
        ip_address: "10.10.0.10"
        netmask: "255.255.255.0"
        gateway: "10.10.0.1"
        static: true
    resources:
      cpu: 4
      memory_mb: 8192
      disk_gb: 100
    software:
