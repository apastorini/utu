# ============================================================
# Configuración del escenario
# ============================================================

scenario:
  # Tiempo antes de que se active el ataque (en minutos despues del clone)
  activation_delay: 5

  # Indicadores que se crean durante el ataque
  indicators:
    file_indicators:
      - path: "C:\\Shares\\Datos_Clientes\\README_RANSOM.txt"
        description: "Nota de rescate del ransomware"
      - path: "C:\\Shares\\Reportes_Financieros\\README_RANSOM.txt"
        description: "Nota de rescate en carpeta de reportes"
      - path: "C:\\Shares\\Recursos_Humanos\\README_RANSOM.txt"
        description: "Nota de rescate en carpeta de RRHH"
      - path: "C:\\Shares\\Datos_Clientes\\.backup_hidden"
        description: "Directorio oculto con copias originales"
      - path: "C:\\Shares\\.ransom_log.txt"
        description: "Log de actividad del ransomware"

    log_indicators:
      - source: "Security"
        event_id: 4624
        description: "Inicio de sesion exitoso con cuenta de servicio"
      - source: "Security"
        event_id: 4648
        description: "Inicio de sesion explicito con credenciales"
      - source: "System"
        event_id: 8222
        description: "Servicio VSS modificado o eliminado"
      - source: "PowerShell"
        event_id: 4104
        description: "Bloque de script de PowerShell ejecutado"

    network_indicators:
      - type: "smb_lateral_movement"
        source: "10.10.2.100"
        destination: "10.10.2.30"
        description: "Movimiento lateral via SMB al fileserver"
      - type: "powershell_remoting"
        source: "10.10.2.100"
        destination: "10.10.2.30"
        description: "Ejecucion remota de comandos PowerShell"

    registry_indicators:
      - path: "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run"
        value: "RansomService"
        description: "Entrada de persistencia del ransomware"

  # Credenciales para los estudiantes (acceso limitado)
  student_access:
    workstation:
      username: "cmartinez"
      password: "C@rlos2025!"
      notes: "Acceso RDP a la estacion de trabajo"
    fileserver:
      username: "cmartinez"
      password: "C@rlos2025!"
      notes: "Acceso via SMB con credenciales mapeadas"

  # Hints disponibles (se activan por tiempo o manualmente)
  hints:
    - time_minutes: 30
      text: "Revise los archivos en las carpetas compartidas del fileserver. Busque archivos con extension .encrypted"
    - time_minutes: 60
      text: "El fileserver tiene un log en C:\\Shares\\.ransom_log.txt que registra la actividad del ransomware"
    - time_minutes: 90
      text: "Verifique si las copias de sombra del volumen estan disponibles con vssadmin list shadows"
    - time_minutes: 120
      text: "Revise el registro de eventos de Seguridad en el fileserver. Busque eventos 4624 y 4648"

  # Evaluacion
  evaluation:
    max_score: 100
    criteria:
      - id: "detect_01"
        description: "Detectar la existencia de archivos .encrypted"
        points: 15
      - id: "detect_02"
        description: "Encontrar y analizar la nota de rescate"
        points: 10
      - id: "analyze_01"
        description: "Identificar el metodo de cifrado (AES)"
        points: 10
      - id: "analyze_02"
        description: "Verificar eliminacion de copias de sombra"
        points: 10
      - id: "analyze_03"
        description: "Identificar el vector de entrada"
        points: 10
      - id: "contain_01"
        description: "Aislar el fileserver de la red"
        points: 10
      - id: "contain_02"
        description: "Preservar evidencia forense"
        points: 10
      - id: "recover_01"
        description: "Intentar recuperacion desde copias de sombra"
        points: 10
      - id: "recover_02"
        description: "Restaurar archivos desde backup"
        points: 10
      - id: "document_01"
        description: "Documentar el incidente completamente"
        points: 5

# ============================================================
# Configuracion de red
# ============================================================

routing:
  - from: "DMZ"
    to: "Internal"
    allow: true
    ports: [445, 1433, 3389, 5985]
    description: "DMZ a Internal - Servicios necesarios"
  - from: "Internal"
    to: "DMZ"
    allow: true
    ports: [80, 443, 25, 143, 993, 22]
    description: "Internal a DMZ - Servicios de usuario"
  - from: "Management"
    to: "Internal"
    allow: true
    ports: [22, 445, 3389, 5985, 4444]
    description: "Management a Internal - Administracion"
  - from: "Internal"
    to: "Management"
    allow: false
    description: "Internal a Management - Bloqueado"
  - from: "DMZ"
    to: "Management"
    allow: false
    description: "DMZ a Management - Bloqueado"
