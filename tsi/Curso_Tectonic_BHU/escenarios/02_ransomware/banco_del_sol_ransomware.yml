---
# ============================================================
# Escenario 02 - Ransomware
# Banco del Sol - Simulación de Ataque Ransomware
# Lab Edition - Tectonic Cyber Range
# ============================================================

lab:
  name: "Banco del Sol - Ransomware Attack"
  description: |
    Escenario de ataque ransomware contra la infraestructura de Banco del Sol.
    El equipo debe detectar, contener y recuperarse de un ataque de cifrado
    AES que afecta los archivos compartidos en el servidor de archivos.

  edition: "lab"
  version: "1.0"
  difficulty: "intermediate"
  estimated_duration: "150"  # minutos
  category: "incident-response"

# ============================================================
# Redes del laboratorio
# ============================================================

networks:
  - name: "DMZ"
    cidr: "10.10.1.0/24"
    gateway: "10.10.1.1"
    vlan_id: 100
    description: "Zona desmilitarada"

  - name: "Internal"
    cidr: "10.10.2.0/24"
    gateway: "10.10.2.1"
    vlan_id: 200
    description: "Red interna corporativa"

  - name: "Management"
    cidr: "10.10.0.0/24"
    gateway: "10.10.0.1"
    vlan_id: 50
    description: "Red de gestión"

  - name: "Internet"
    cidr: "172.16.0.0/24"
    gateway: "172.16.0.1"
    vlan_id: 999
    description: "Simulación de Internet"

# ============================================================
# Máquinas virtuales
# ============================================================

vms:

  # --- Atacante ---
  - name: "attacker"
    hostname: "attacker"
    role: "attacker"
    network: "Management"
    ip_address: "10.10.0.10"
    subnet_mask: "255.255.255.0"
    gateway: "10.10.0.1"
    dns: ["10.10.2.10"]
    os:
      type: "linux"
      distribution: "kali"
      version: "2024.1"
    specs:
      cpu: 2
      ram_mb: 4096
      disk_gb: 60
    services:
      - name: "ssh"
        port: 22
      - name: "metasploit"
        port: 4444
    scripts:
      after_clone:
        - "ansible/after_clone.yml"
    notes: |
      Estación de ataque Kali Linux. Contiene herramientas de penetración
      y el script de ransomware simulado. Los estudiantes no tienen acceso
      directo a esta máquina, pero pueden encontrar rastros de su actividad.

  # --- Servidor Web ---
  - name: "webserver"
    hostname: "webserver"
    role: "webserver"
    network: "DMZ"
    ip_address: "10.10.1.10"
    subnet_mask: "255.255.255.0"
    gateway: "10.10.1.1"
    dns: ["10.10.2.10"]
    os:
      type: "linux"
      distribution: "ubuntu"
      version: "22.04"
    specs:
      cpu: 2
      ram_mb: 4096
      disk_gb: 40
    services:
      - name: "nginx"
        port: 80
      - name: "nginx-ssl"
        port: 443
      - name: "ssh"
        port: 22
    base_config:
      - "ansible/base_config.yml"
    notes: |
      Servidor web de la banca en línea de Banco del Sol. Expuesto a la
      red DMZ. No es el objetivo principal del ransomware, pero puede
      contener indicadores de compromiso secundarios.

  # --- Servidor de Correo ---
  - name: "mailserver"
    hostname: "mailserver"
    role: "mailserver"
    network: "DMZ"
    ip_address: "10.10.1.20"
    subnet_mask: "255.255.255.0"
    gateway: "10.10.1.1"
    dns: ["10.10.2.10"]
    os:
      type: "linux"
      distribution: "ubuntu"
      version: "22.04"
    specs:
      cpu: 2
      ram_mb: 4096
      disk_gb: 40
    services:
      - name: "postfix"
        port: 25
      - name: "dovecot"
        port: 143
      - name: "dovecot-imaps"
        port: 993
      - name: "ssh"
        port: 22
    base_config:
      - "ansible/base_config.yml"
    notes: |
      Servidor de correo corporativo. Contiene emails que podrían incluir
      el correo de phishing utilizado para el acceso inicial. Los estudiantes
      pueden revisar el buzón del usuario comprometido.

