---
name: ransomware
description: |
  Escenario de ataque ransomware contra la infraestructura de Banco del Sol.
  Un actor malicioso ha logrado infiltrarse en la red corporativa y ejecutar
  un script de cifrado AES que afecta los archivos almacenados en el servidor
  de archivos (fileserver). Los estudiantes actúan como equipo azul (defensores)
  y deben detectar, contener, erradicar y recuperarse del ataque.

  El ransomware simula cifrar archivos compartidos en SMB mediante AES-256,
  eliminando copias de sombra del volumen y dejando una nota de rescate.
  Los equipos deben analizar el incidente, preservar evidencia y restaurar
  los datos desde copias de seguridad.

  Escenarios incluidos:
  - Detección del ransomware mediante análisis de archivos modificados
  - Análisis de la nota de rescate y el método de cifrado
  - Recuperación de copias de sombra del volumen (vssadmin)
  - Restauración de archivos desde backups
  - Containment del sistema afectado
  - Análisis forense de artefactos dejados por el atacante

tags:
  - ransomware
  - encryption
  - malware
  - incident-response
  - aes
  - vssadmin
  - smb
  - forensics

difficulty: intermediate
estimated_time: "2.5 hours"

learning_objectives:
  - Identificar indicadores de compromiso (IoC) de un ataque ransomware
  - Analizar notas de rescate y determinar variante del ransomware
  - Verificar eliminación de copias de sombra del volumen (vssadmin)
  - Contener un sistema afectado sin perder evidencia forense
  - Restaurar archivos desde copias de seguridad y copias de sombra
  - Realizar análisis forense básico de artefactos de malware
  - Documentar correctamente un incidente de seguridad
  - Implementar medidas de mitigación post-incidente

