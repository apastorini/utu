attack_narrative: |
  El atacante obtuvo acceso inicial mediante credenciales comprometidas extraídas
  de un phishing anterior. Desde la estación de trabajo, el atacante escaló
  privilegios y obtuvo acceso al fileserver mediante SMB. Se ejecutó un script
  de Python que simula cifrado AES-256 de archivos en las carpetas compartidas,
  se eliminaron copias de sombra del volumen y se dejó una nota de rescate.
  Los usuarios reportan que no pueden acceder a los archivos compartidos.

blue_team_objectives: |
  Como equipo azul, su misión es:
  1. Detectar el incidente mediante alertas y reportes de usuarios
  2. Analizar el alcance del daño en el fileserver
  3. Identificar el tipo de ransomware y su método de propagación
  4. Contener el incidente aislando el sistema afectado
  5. Intentar recuperar archivos desde copias de sombra
  6. Restaurar datos desde backups verificados
  7. Erradicar el malware y cerrar vectores de ataque
  8. Documentar el incidente completo para el reporte final

evaluation_criteria:
  - Detección temprana del ransomware (tiempo de respuesta)
  - Análisis correcto de los indicadores de compromiso
  - Preservación adecuada de evidencia forense
  - Containment efectivo sin pérdida de datos adicionales
  - Recuperación exitosa de archivos desde copias de sombra o backups
  - Documentación completa del incidente
  - Implementación de controles preventivos post-incidente
