                1010,Lucia,Herrera,01234567,Plazo Fijo,180000.00,2021-09-05
            - name: "transacciones_noviembre_2025.csv"
              content: |
                id_transaccion,fecha,hora,cliente_origen,cliente_destino,monto,tipo,estado
                TX001,2025-11-01,09:15:32,1001,1003,5000.00,transferencia,completada
