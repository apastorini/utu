            - name: "informe_auditoria_interna_Q3.docx"
              content: "[ARCHIVO SIMULADO] Informe de auditoria interna Q3 2025 - Banco del Sol. Contenido clasificado."
            - name: "backup_config_server.dat"
              content: "[ARCHIVO SIMULADO] Configuracion de backup del servidor - No editar manualmente."

        - name: Crear archivos dummy - Reportes Financieros
          ansible.windows.win_copy:
            content: "{{ item.content }}"
            dest: "C:\\Shares\\Reportes_Financieros\\{{ item.name }}"
          loop:
            - name: "balance_general_octubre_2025.xlsx"
              content: "[ARCHIVO SIMULADO] Balance General Banco del Sol - Octubre 2025. Activos: $45.230.000.000 | Pasivos: $38.910.000.000 | Patrimonio: $6.320.000.000"
            - name: "estado_resultados_Q3_2025.xlsx"
              content: "[ARCHIVO SIMULADO] Estado de Resultados Q3 2025 - Banco del Sol. Ingresos por intereses: $2.150.000.000 | Gastos operativos: $890.000.000 | Utilidad neta: $945.000.000"
            - name: "proyecciones_2026_preliminar.pdf"
              content: "[ARCHIVO SIMULADO] Proyecciones Financieras 2026 - Documento preliminar confidencial. Crecimiento estimado: 8.5% | ROI proyectado: 14.2%"
            - name: "concentracion_cartera_noviembre.csv"
              content: |
                tipo_producto,cantidad_clientes,monto_total,porcentaje_cartera
                Cuentas Corrientes,45230,1809200000.00,40.0
                Cajas de Ahorro,38900,1945000000.00,43.0
                Plazos Fijos,12450,622500000.00,13.8
                Creditos Hipotecarios,3200,96000000.00,2.1
                Creditos Personales,8900,89000000.00,2.0
                Tarjetas de Credito,21000,52500000.00,1.2
            - name: "inventario_activos_TIC.xlsx"
              content: "[ARCHIVO SIMULADO] Inventario de Activos TIC - Banco del Sol. Total servidores: 47 | Total estaciones: 312 | Total switches: 28"

        - name: Crear archivos dummy - Recursos Humanos
          ansible.windows.win_copy:
            content: "{{ item.content }}"
            dest: "C:\\Shares\\Recursos_Humanos\\{{ item.name }}"
          loop:
            - name: "nomina_empleados_noviembre_2025.csv"
              content: |
                legajo,nombre,apellido,departamento,cargo,salario_bruto,bonificacion
                EMP001,Carlos,Martinez,IT,Analista Senior,95000,12000
                EMP002,Laura,Gonzalez,Finanzas,Contadora,105000,15000
                EMP003,Miguel,Rodriguez,Ventas,Ejecutivo,78000,8000
                EMP004,Ana,Lopez,RRHH,Coordinadora,88000,10000
                EMP005,Pedro,Fernandez,IT,SysAdmin,110000,18000
                EMP006,Maria,Garcia,Legal,Abogada,120000,20000
                EMP007,Juan,Sanchez,Operaciones,Supervisor,72000,7000
                EMP008,Carmen,Diaz,Marketing,Gerente,135000,25000
                EMP009,Roberto,Morales,IT,Director TI,180000,35000
                EMP010,Lucia,Herrera,Finanzas,CFO,220000,50000
            - name: "registros_asistencia_octubre.csv"
              content: |
                legajo,fecha,entrada,salida,horas_extra,observaciones
                EMP001,2025-10-01,08:55,17:05,0.5,
                EMP002,2025-10-01,09:00,17:30,1.0,
                EMP005,2025-10-01,08:30,22:15,3.75,incidente servidor
                EMP009,2025-10-01,08:00,19:00,2.0,auditoria
            - name: "politicas_seguridad_info_2025.pdf"
              content: "[ARCHIVO SIMULADO] Politicas de Seguridad de la Informacion Banco del Sol 2025. Documento confidencial."

        # --- Configuracion de VSS (Volume Shadow Copy) ---
        - name: Verificar servicio VSS
          ansible.windows.win_service:
            name: VSS
            state: started
            start_mode: auto

        - name: Crear tarea programada para VSS (cada 6 horas)
          ansible.windows.win_scheduled_task:
            name: "BancoDelSol_VSS_Backup"
            description: "Copia de sombra automatica del volumen C:"
            state: present
            actions:
              - path: "vssadmin.exe"
                arguments: "create shadow /for=C:"
            triggers:
              - type: "daily"
                start_time: "02:00:00"
                repetition:
                  interval: "PT6H"
                  duration: "PT24H"
                  stop_at_duration_end: false
            principal:
              user_id: "SYSTEM"
              logon_type: "serviceAccount"
              run_level: "highest"

        - name: Ejecutar VSS inicial para crear primera copia de sombra
          ansible.windows.win_command: vssadmin.exe create shadow /for=C:
          register: vss_result

        - name: Verificar copia de sombra creada
          ansible.windows.win_command: vssadmin.exe list shadows
          register: vss_list
          changed_when: false

        - name: Registrar estado de VSS
          ansible.builtin.debug:
            msg: "VSS configurado correctamente. Copias de sombra disponibles."

        # --- Configuracion de Logging ---
        - name: Configurar politica de auditoria de seguridad
          ansible.windows.win_shell: |
            # Habilitar auditoria de acceso a objetos
            auditpol /set /subcategory:"File System" /success:enable /failure:enable
            auditpol /set /subcategory:"Registry" /success:enable /failure:enable
            auditpol /set /subcategory:"File Share" /success:enable /failure:enable

            # Habilitar auditoria de inicio de sesion
            auditpol /set /subcategory:"Logon" /success:enable /failure:enable
            auditpol /set /subcategory:"Logoff" /success:enable

            # Habilitar auditoria de cambios en cuentas
            auditpol /set /subcategory:"User Account Management" /success:enable /failure:enable
            auditpol /set /subcategory:"Security Group Management" /success:enable /failure:enable

            # Habilitar auditoria de privilegios
            auditpol /set /subcategory:"Sensitive Privilege Use" /success:enable /failure:enable

            Write-Output "Politica de auditoria configurada correctamente"
          args:
            executable: powershell

        - name: Configurar politica de eventos de seguridad
          ansible.windows.win_shell: |
            # Aumentar tamano del log de seguridad a 1GB
            wevtutil sl Security /ms:1073741824
            wevtutil sl System /ms:1073741824
            wevtutil sl Application /ms:1073741824
            wevtutil sl "Windows PowerShell" /ms:536870912
            wevtutil sl "Microsoft-Windows-PowerShell/Operational" /ms:536870912

            Write-Output "Tamanos de log configurados correctamente"
          args:
            executable: powershell

        - name: Habilitar PowerShell Script Block Logging
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging
            name: EnableScriptBlockLogging
            data: 1
            type: dword

        - name: Habilitar PowerShell Module Logging
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging
            name: EnableModuleLogging
            data: 1
            type: dword

        - name: Configurar modulos de PowerShell para logging
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ModuleLogging\ModuleNames
            name: "*"
            data: "*"
            type: string

        # --- Configuracion de Windows Defender ---
        - name: Verificar Windows Defender activo
          ansible.windows.win_shell: |
            Get-MpComputerStatus | Select-Object -Property RealTimeProtectionEnabled, AntivirusEnabled
          args:
            executable: powershell
          register: defender_status

        - name: Actualizar definiciones de Windows Defender
          ansible.windows.win_shell: Update-MpSignature
          args:
            executable: powershell
          register: update_result

        - name: Configurar exclusiones de Windows Defender para shares
          ansible.windows.win_shell: |
            # Excluir directorios de shares del escaneo en tiempo real
            # (necesario para el funcionamiento del laboratorio)
            Add-MpExclusion -ExclusionPath "C:\Shares\Backups"
            Add-MpExclusion -ExclusionPath "C:\Shares\Logs"
            Write-Output "Exclusiones de Defender configuradas"
          args:
            executable: powershell

        - name: Habilitar proteccion de acceso a carpetas
          ansible.windows.win_shell: |
            Set-MpPreference -EnableControlledFolderAccess Disabled
            Write-Output "Proteccion de carpetas deshabilitada para laboratorio"
          args:
            executable: powershell

        # --- Configuracion de firewall ---
        - name: Configurar reglas de firewall para SMB
          ansible.windows.win_firewall_rule:
            name: "SMB-In"
            localport: 445,139
            action: allow
            direction: in
            protocol: tcp
            state: present
            enabled: true

        - name: Configurar reglas de firewall para RDP
          ansible.windows.win_firewall_rule:
            name: "RDP-In"
            localport: 3389
            action: allow
            direction: in
            protocol: tcp
            state: present
            enabled: true

        - name: Configurar reglas de firewall para WinRM
          ansible.windows.win_firewall_rule:
            name: "WinRM-In"
            localport: 5985,5986
            action: allow
            direction: in
            protocol: tcp
            state: present
            enabled: true

        # --- Servicios adicionales ---
        - name: Habilitar servicio de registro remoto
          ansible.windows.win_service:
            name: RemoteRegistry
            state: started
            start_mode: auto

        - name: Habilitar WinRM
          ansible.windows.win_shell: |
            Enable-PSRemoting -Force -SkipNetworkProfileCheck
            Set-Item WSMan:\localhost\Client\TrustedHosts -Value "*" -Force
            winrm quickconfig -q
            winrm set winrm/config/service '@{AllowUnencrypted="true"}'
            winrm set winrm/config/service/auth '@{Basic="true"}'
          args:
            executable: powershell

        # --- Crear directorio de evidencia ---
        - name: Crear directorio para evidencia forense
          ansible.windows.win_file:
            path: "C:\\Forensics"
            state: directory

        - name: Crear directorio de backups
          ansible.windows.win_file:
            path: "C:\\Backups"
            state: directory

        - name: Crear script de recopilacion de evidencia
          ansible.windows.win_copy:
            content: |
              # Script de Recopilacion de Evidencia - Banco del Sol
              # Ejecutar como administrador
              param(
                  [string]$OutputDir = "C:\Forensics\Evidence_$(Get-Date -Format 'yyyyMMdd_HHmmss')"
              )

              New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null

              Write-Host "=== Recopilando evidencia del sistema ===" -ForegroundColor Green

              # Informacion del sistema
              Write-Host "[1/10] Recopilando informacion del sistema..."
              systeminfo | Out-File "$OutputDir\systeminfo.txt"
              ipconfig /all | Out-File "$OutputDir\network_config.txt"
              netstat -ano | Out-File "$OutputDir\netstat.txt"
              net user | Out-File "$OutputDir\users.txt"
              net localgroup | Out-File "$OutputDir\groups.txt"
              net share | Out-File "$OutputDir\shares.txt"

              # Procesos
              Write-Host "[2/10] Recopilando procesos..."
              Get-Process | Format-Table -AutoSize | Out-File "$OutputDir\processes.txt"
              Get-WmiObject Win32_Service | Format-Table -AutoSize | Out-File "$OutputDir\services.txt"

              # Tareas programadas
              Write-Host "[3/10] Recopilando tareas programadas..."
              Get-ScheduledTask | Format-Table -AutoSize | Out-File "$OutputDir\scheduled_tasks.txt"

              # Servicios VSS
              Write-Host "[4/10] Verificando copias de sombra..."
              vssadmin list shadows | Out-File "$OutputDir\vss_shadows.txt"
              vssadmin list writers | Out-File "$OutputDir\vss_writers.txt"
              vssadmin list providers | Out-File "$OutputDir\vss_providers.txt"

              # Registry
              Write-Host "[5/10] Recopilando entradas de registro..."
              Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run" | Out-File "$OutputDir\registry_run.txt"
              Get-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce" | Out-File "$OutputDir\registry_runonce.txt"

              # Logs de seguridad
              Write-Host "[6/10] Exportando logs de seguridad..."
              wevtutil epl Security "$OutputDir\security.evtx" /ow:true
              wevtutil epl System "$OutputDir\system.evtx" /ow:true
              wevtutil epl Application "$OutputDir\application.evtx" /ow:true
              wevtutil epl "Windows PowerShell" "$OutputDir\powershell.evtx" /ow:true

              # Archivos modificados
              Write-Host "[7/10] Buscando archivos cifrados..."
              Get-ChildItem -Path "C:\Shares" -Recurse -Filter "*.encrypted" |
                  Format-Table FullName, Length, LastWriteTime -AutoSize |
                  Out-File "$OutputDir\encrypted_files.txt"

              # Ransom note
              Write-Host "[8/10] Buscando nota de rescate..."
              Get-ChildItem -Path "C:\Shares" -Recurse -Filter "README_RANSOM*" |
                  ForEach-Object {
                      Write-Host "  Encontrado: $($_.FullName)" -ForegroundColor Yellow
                      Get-Content $_.FullName | Out-File "$OutputDir\ransom_note_$($_.Directory.Name).txt"
                  }

              # Hashes de archivos
              Write-Host "[9/10] Calculando hashes de archivos..."
              Get-ChildItem -Path "C:\Shares" -Recurse -File |
                  ForEach-Object {
                      [PSCustomObject]@{
                          Path = $_.FullName
                          Hash = (Get-FileHash $_.FullName -Algorithm MD5).Hash
                          Size = $_.Length
                          Modified = $_.LastWriteTime
                      }
                  } | Export-Csv "$OutputDir\file_hashes.csv" -NoTypeInformation

              # Log de evento
              Write-Host "[10/10] Generando reporte final..."
              $report = @"
              ================================================
              REPORTE DE EVIDENCIA - BANCO DEL SOL
              Fecha: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
              Equipo: $env:COMPUTERNAME
              ================================================

              Directorio de salida: $OutputDir
              Total archivos recopilados: $((Get-ChildItem $OutputDir -Recurse -File).Count)
              Tamano total: $([math]::Round((Get-ChildItem $OutputDir -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1KB, 2)) KB
              ================================================
              "@
              $report | Out-File "$OutputDir\REPORT.txt"

              Write-Host "=== Evidencia recopilada en: $OutputDir ===" -ForegroundColor Green
              Write-Host "Total archivos: $((Get-ChildItem $OutputDir -Recurse -File).Count)" -ForegroundColor Cyan
            dest: "C:\\Forensics\\collect_evidence.ps1"

        # --- Verificacion final ---
        - name: Verificar configuracion completa
          ansible.windows.win_shell: |
            Write-Host "=== Verificacion de Configuracion - Fileserver ===" -ForegroundColor Green
            Write-Host "Shares SMB:" -ForegroundColor Yellow
            Get-SmbShare | Format-Table Name, Path, Description -AutoSize
            Write-Host ""
            Write-Host "Copias de sombra:" -ForegroundColor Yellow
            vssadmin list shadows
            Write-Host ""
            Write-Host "Servicios clave:" -ForegroundColor Yellow
            Get-Service VSS, WinRM, RemoteRegistry | Format-Table Name, Status, StartType -AutoSize
            Write-Host ""
            Write-Host "Archivos en shares:" -ForegroundColor Yellow
            Get-ChildItem C:\Shares -Recurse -File | Measure-Object | Select-Object Count
          args:
            executable: powershell
          register: verification_result

      when: inventory_hostname == "fileserver"

    # ============================================================
    # Configuracion del Domain Controller
    # ============================================================

    - name: Configurar Domain Controller
      block:
        - name: Instalar Active Directory Domain Services
          ansible.windows.win_feature:
            name:
              - AD-Domain-Services
              - RSAT-AD-PowerShell
              - RSAT-AD-AdminCenter
              - DNS
            state: present

        - name: Verificar servicios de AD
          ansible.windows.win_service:
            name: "{{ item }}"
            state: started
            start_mode: auto
          loop:
            - NTDS
            - DNS
            - Kdc
            - Netlogon
            - W32Time

        - name: Crear OU para Banco del Sol
          community.windows.win_domain_object:
            path: "DC=BancoDelSol,DC=local"
            state: present
            type: organizationalUnit
            name: "BancoDelSol"

        - name: Crear usuarios del dominio
          community.windows.win_domain_user:
            name: "{{ item.name }}"
            sam_account_name: "{{ item.username }}"
            password: "{{ item.password }}"
            state: present
            groups:
              - "{{ item.groups | join(',') }}"
          loop:
