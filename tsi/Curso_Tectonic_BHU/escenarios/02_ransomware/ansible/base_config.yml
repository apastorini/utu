---
# ============================================================
# Escenario 02 - Ransomware
# Configuracion Base - Banco del Sol
# ============================================================
# Este playbook configura la infraestructura base del escenario
# antes de que se ejecute el ataque simulado.
# ============================================================

- name: Configuracion base - Banco del Sol
  hosts: all
  become: true
  vars:
    domain_name: "BancoDelSol.local"
    domain_netbios: "BancoDelSol"
    admin_password: "B@ncoDelSol2025!"
    service_account_password: "S3rv1c32025!"
    timezone: "America/Montevideo"

  tasks:

    # ============================================================
    # Configuracion general - Todos los sistemas
    # ============================================================

    - name: Establecer zona horaria
      community.windows.win_timezone:
        timezone: "{{ timezone }}"
      when: ansible_os_family == "Windows"

    - name: Configurar hostname
      ansible.windows.win_hostname:
        name: "{{ inventory_hostname }}"
      when: ansible_os_family == "Windows"
      register: hostname_result

    - name: Reiniciar si cambio hostname
      ansible.windows.win_reboot:
      when: hostname_result is changed

    - name: Configurar DNS del dominio
      ansible.windows.win_dns_client:
        adapter_names: "*"
        dns_servers:
          - 10.10.2.10
      when: ansible_os_family == "Windows"

    # ============================================================
    # Configuracion del Fileserver
    # ============================================================

    - name: Configurar Fileserver
      block:
        - name: Instalar caracteristicas de Windows Server
          ansible.windows.win_feature:
            name:
              - FS-FileServer
              - FS-SMB
              - FS-VSS
              - FS-Resource-Manager
              - RSAT-AD-PowerShell
            state: present

        - name: Crear directorio de shares
          ansible.windows.win_file:
            path: "{{ item }}"
            state: directory
          loop:
            - "C:\\Shares"
            - "C:\\Shares\\Datos_Clientes"
            - "C:\\Shares\\Reportes_Financieros"
            - "C:\\Shares\\Recursos_Humanos"
            - "C:\\Shares\\Backups"
            - "C:\\Shares\\Logs"

        - name: Crear grupo de seguridad para Finanzas
          community.windows.win_group:
            name: "Finanzas"
            description: "Departamento de Finanzas - Acceso a reportes financieros"
            state: present

        - name: Crear grupo de seguridad para RRHH
          community.windows.win_group:
            name: "RRHH"
            description: "Departamento de Recursos Humanos"
            state: present

        - name: Crear grupo de seguridad para Direccion
          community.windows.win_group:
            name: "Direccion"
            description: "Direccion General del Banco"
            state: present

        - name: Configurar share Datos_Clientes
          ansible.windows.win_shell: |
            New-SmbShare -Name "Datos_Clientes" `
              -Path "C:\Shares\Datos_Clientes" `
              -Description "Datos de clientes del banco" `
              -FullAccess "BancoDelSol\Finanzas" `
              -ReadAccess "BancoDelSol\Empleados" `
              -ChangeAccess "BancoDelSol\IT" `
              -Force
          args:
            executable: powershell

        - name: Configurar share Reportes_Financieros
          ansible.windows.win_shell: |
            New-SmbShare -Name "Reportes_Financieros" `
              -Path "C:\Shares\Reportes_Financieros" `
              -Description "Reportes financieros del banco" `
              -FullAccess "BancoDelSol\Finanzas" `
              -ReadAccess "BancoDelSol\Direccion" `
              -Force
          args:
            executable: powershell

        - name: Configurar share Recursos_Humanos
          ansible.windows.win_shell: |
            New-SmbShare -Name "Recursos_Humanos" `
              -Path "C:\Shares\Recursos_Humanos" `
              -Description "Documentacion de recursos humanos" `
              -FullAccess "BancoDelSol\RRHH" `
              -ReadAccess "BancoDelSol\Direccion" `
              -Force
          args:
            executable: powershell

        - name: Configurar permisos NTFS en Datos_Clientes
          community.windows.win_file_acl:
            path: "C:\\Shares\\Datos_Clientes"
            rule:
              - principal: "BancoDelSol\\Finanzas"
                type: allow
                rights: "FullControl"
              - principal: "BancoDelSol\\Empleados"
                type: allow
                rights: "Read"
              - principal: "BancoDelSol\\IT"
                type: allow
                rights: "Modify"

        - name: Configurar permisos NTFS en Reportes_Financieros
          community.windows.win_file_acl:
            path: "C:\\Shares\\Reportes_Financieros"
            rule:
              - principal: "BancoDelSol\\Finanzas"
                type: allow
                rights: "FullControl"
              - principal: "BancoDelSol\\Direccion"
                type: allow
                rights: "Read"

        - name: Crear archivos dummy - Datos Clientes
          ansible.windows.win_copy:
            content: "{{ item.content }}"
            dest: "C:\\Shares\\Datos_Clientes\\{{ item.name }}"
          loop:
            - name: "clientes_activos_2025_Q4.csv"
