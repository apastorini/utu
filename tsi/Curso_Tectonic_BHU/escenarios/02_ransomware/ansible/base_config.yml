    # ============================================================
    # Configuracion de la Estacion de Trabajo
    # ============================================================

    - name: Configurar Workstation
      block:
        - name: Crear directorio de usuario
          ansible.windows.win_file:
            path: "C:\\Users\\cmartinez"
            state: directory

        - name: Crear carpeta Desktop
          ansible.windows.win_file:
            path: "C:\\Users\\cmartinez\\Desktop"
            state: directory

        - name: Crear archivo de accesos rapidos
          ansible.windows.win_copy:
            content: |
              Acceso rapido a recursos - Banco del Sol
              =========================================
              Servidor de archivos: \\fileserver\Datos_Clientes
              Reportes financieros: \\fileserver\Reportes_Financieros
              Recursos humanos: \\fileserver\Recursos_Humanos
              Correo: https://mail.bancodelsol.local
              Intranet: https://intranet.bancodelsol.local
            dest: "C:\\Users\\cmartinez\\Desktop\\acceso_rapido.txt"

        - name: Mapear unidad de red S: (Datos_Clientes)
          ansible.windows.win_shell: |
            net use S: \\fileserver\Datos_Clientes /persistent:yes
          args:
            executable: powershell

        - name: Mapear unidad de red R: (Reportes_Financieros)
          ansible.windows.win_shell: |
            net use R: \\fileserver\Reportes_Financieros /persistent:yes
          args:
            executable: powershell

        - name: Configurar historial de PowerShell
          ansible.windows.win_regedit:
            path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell
            name: ExecutionPolicy
            data: "RemoteSigned"
            type: string

        - name: Habilitar RDP
          ansible.windows.win_regedit:
            path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
            name: fDenyTSConnections
            data: 0
            type: dword

        - name: Configurar regla de firewall para RDP
          ansible.windows.win_firewall_rule:
            name: "AllowRDP"
            localport: 3389
            action: allow
            direction: in
            protocol: tcp
            state: present
            enabled: true

        - name: Verificar conectividad al fileserver
          ansible.windows.win_ping:
          register: ping_result

      when: inventory_hostname == "workstation"

