---
# =============================================================================
# Escenario 06 - Analisis Forense Digital
# Banco del Sol - Curso Tectonic BHU Uruguay
# =============================================================================
# Playbook de configuracion base: prepara el entorno forense,
# crea imagenes de disco y volcado de memoria de la estacion
# de trabajo, e instala herramientas de analisis en el VM del instructor/alumno.
# =============================================================================

- name: "Escenario 06 - Configuracion Base del Entorno Forense"
  hosts: all
  become: true
  vars_files:
    - vars/defaults.yml

  tasks:
    # =========================================================================
    # FACTS Y PREPARACION DEL SISTEMA
    # =========================================================================
    - name: Recopilar facts del sistema
      ansible.builtin.setup:
        gather_subset:
          - network
          - hardware
          - virtual

    - name: Definir variable de escenario
      ansible.builtin.set_fact:
        scenario_name: "06_forensia"
        scenario_description: "Analisis Forense Digital - Banco del Sol"

    # =========================================================================
    # CONFIGURACION DE RED
    # =========================================================================
    - name: Configurar hostname segun maquina
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Configurar /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars[item].ansible_host }} {{ item }}"
        state: present
      loop: "{{ groups['all'] }}"
      when: hostvars[item].ansible_host is defined

# =============================================================================
# PLAY 2: Preparar la estacion de trabajo (workstation)
# =============================================================================
- name: "Preparar estacion de trabajo - Simular entorno corporativo"
  hosts: workstation
  become: true
  vars_files:
    - vars/defaults.yml

  tasks:
    # =========================================================================
    # INSTALAR PAQUETES BASE
    # =========================================================================
    - name: Actualizar cache de paquetes
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar paquetes base del sistema
      ansible.builtin.apt:
        name:
          - openssh-server
          - apache2
          - libapache2-mod-php
          - php
          - php-mysql
          - mysql-server
          - postfix
          - dovecot-imapd
          - cron
          - logrotate
          - rsyslog
          - sudo
          - vim
          - nano
          - wget
          - curl
          - net-tools
          - iputils-ping
          - tcpdump
          - unzip
          - zip
          - tar
          - htop
          - tmux
          - git
          - libreoffice-writer
          - libreoffice-calc
          - evolution
          - firefox-esr
          - xdg-utils
          - trash-cli
          - tree
          - findutils
          - procps
          - psmisc
          - lsof
          - strace
        state: present

    - name: Instalar paquetes adicionales
      ansible.builtin.apt:
        name:
          - cups
          - avahi-daemon
          - samba
          - nfs-common
          - cifs-utils
        state: present

    # =========================================================================
    # CREAR USUARIOS DEL SISTEMA
    # =========================================================================
    - name: Crear usuario normal - maria.garcia
      ansible.builtin.user:
        name: maria.garcia
        comment: "Maria Garcia - Departamento de Operaciones"
        home: /home/maria.garcia
        shell: /bin/bash
        password: "$6$rounds=656000$kFzGx8qW$pQ2r4T6y8u0i2o4p6a8s0d2f4g6h8j0k2l4"
        create_home: yes
        groups:
          - sudo
          - cdrom
          - floppy
          - audio
          - dip
          - video
          - plugdev
          - netdev
        state: present

    - name: Crear usuario normal - carlos.lopez
      ansible.builtin.user:
        name: carlos.lopez
        comment: "Carlos Lopez - Desarrollador"
        home: /home/carlos.lopez
        shell: /bin/bash
        password: "$6$rounds=656000$aBcDeFgH$iJkLmNoPqRsTuVwXyZ0aB1c2D3e4F5g6H7i"
        create_home: yes
        groups:
          - sudo
        state: present

    - name: Crear usuario de servicio - www-data (verificar)
      ansible.builtin.user:
        name: www-data
        shell: /usr/sbin/nologin
        system: yes
        state: present

    # =========================================================================
    # CONFIGURAR APACHE
    # =========================================================================
    - name: Habilitar modulo rewrite de Apache
      apache2_module:
        name: rewrite
        state: present

    - name: Habilitar modulo headers de Apache
      apache2_module:
        name: headers
        state: present

    - name: Copiar configuracion del portal bancario
      ansible.builtin.copy:
        src: files/apache/banco_del_sol.conf
        dest: /etc/apache2/sites-available/banco_del_sol.conf
        owner: root
        group: root
        mode: '0644'

    - name: Habilitar sitio del portal bancario
      ansible.builtin.command: a2ensite banco_del_sol.conf
      changed_when: false

    - name: Deshabilitar sitio por defecto
      ansible.builtin.command: a2dissite 000-default.conf
      changed_when: false
      ignore_errors: yes

