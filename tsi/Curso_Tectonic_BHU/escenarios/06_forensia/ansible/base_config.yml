# =============================================================================
# PLAY 4: Configurar servidor de correo (mailserver)
# =============================================================================
- name: "Configurar servidor de correo"
  hosts: mailserver
  become: true
  vars_files:
    - vars/defaults.yml

  tasks:
    - name: Actualizar cache de paquetes
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar paquetes de correo
      ansible.builtin.apt:
        name:
          - postfix
          - dovecot-core
          - dovecot-imapd
          - mailutils
          - clamav
          - clamav-daemon
          - spamassassin
        state: present

    - name: Configurar Postfix
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?myhostname', line: 'myhostname = mail.bancodelsol.uy' }
        - { regexp: '^#?mydomain', line: 'mydomain = bancodelsol.uy' }
        - { regexp: '^#?myorigin', line: 'myorigin = $mydomain' }
        - { regexp: '^#?inet_interfaces', line: 'inet_interfaces = all' }
        - { regexp: '^#?mydestination', line: 'mydestination = $myhostname, localhost.$mydomain, localhost, $mydomain' }

    - name: Reiniciar Postfix
      ansible.builtin.systemd:
        name: postfix
        state: started
        enabled: yes

    - name: Reiniciar Dovecot
      ansible.builtin.systemd:
        name: dovecot
        state: started
        enabled: yes

