    # CREAR ESTRUCTURA DEL PORTAL BANCARIO
    # =========================================================================
    - name: Crear directorio del portal
      ansible.builtin.file:
        path: /var/www/html/banco_del_sol
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

