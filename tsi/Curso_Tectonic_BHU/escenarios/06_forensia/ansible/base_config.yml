        group: www-data
        mode: '0644'

    - name: Crear script de login (vulnerable a SQLi)
      ansible.builtin.copy:
        content: |
          <?php
          // Portal Bancario - Login
          // NOTA: Este script tiene vulnerabilidad de SQL injection intencional
          $db_host = "localhost";
          $db_user = "admin_banco";
          $db_pass = "B@nc0d3lSol_2024";
          $db_name = "banco_del_sol";

          if ($_SERVER["REQUEST_METHOD"] == "POST") {
              $usuario = $_POST["usuario"];
              $password = $_POST["password"];

              $conn = new mysqli($db_host, $db_user, $db_pass, $db_name);

              if ($conn->connect_error) {
                  die("Error de conexion: " . $conn->connect_error);
              }

              // VULNERABILIDAD: SQL Injection - query sin prepared statements
              $query = "SELECT * FROM usuarios WHERE usuario='$usuario' AND password='$password'";
              $result = $conn->query($query);

              if ($result && $result->num_rows > 0) {
                  $row = $result->fetch_assoc();
                  session_start();
                  $_SESSION["usuario"] = $row["usuario"];
                  $_SESSION["nombre"] = $row["nombre"];
                  header("Location: dashboard.php");
                  exit();
              } else {
                  echo "<script>alert('Credenciales incorrectas'); window.history.back();</script>";
              }

              $conn->close();
          }
          ?>
        dest: /var/www/html/banco_del_sol/login.php
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Crear dashboard basico
