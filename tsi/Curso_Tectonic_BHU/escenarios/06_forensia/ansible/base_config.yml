                  .login-form { margin-top: 20px; }
                  .login-form input { width: 100%; padding: 10px; margin: 5px 0 15px 0; border: 1px solid #ddd; }
                  .login-form button { background: #1a237e; color: white; padding: 10px 20px; border: none; cursor: pointer; }
