        policy: "{{ item.policy }}"
        rule: "{{ item.rule | default(omit) }}"
        from_ip: "{{ item.from_ip | default(omit) }}"
        to_port: "{{ item.to_port | default(omit) }}"
        proto: "{{ item.proto | default(omit) }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }
        - { direction: incoming, rule: allow, to_port: 22, proto: tcp }
        - { direction: incoming, rule: allow, to_port: 80, proto: tcp }
        - { direction: incoming, rule: allow, to_port: 443, proto: tcp }
        - { direction: incoming, rule: allow, from_ip: 10.10.0.0/24, to_port: 22, proto: tcp }
        - { direction: incoming, rule: allow, from_ip: 10.10.2.0/24, to_port: 22, proto: tcp }

