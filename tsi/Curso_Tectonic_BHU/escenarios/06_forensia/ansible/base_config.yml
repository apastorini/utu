    - name: Crear directorios de logs de Apache
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: adm
        group: adm
        mode: '0750'
      loop:
        - /var/log/apache2
        - /var/log/apache2/archivos

    # =========================================================================
    # CONFIGURAR SERVICIO SSH
    # =========================================================================
    - name: Configurar SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication yes' }
        - { regexp: '^#?Port ', line: 'Port 22' }
        - { regexp: '^#?Protocol', line: 'Protocol 2' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding yes' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 6' }
        - { regexp: '^#?AllowUsers', line: 'AllowUsers maria.garcia carlos.lopez admin_local' }

    - name: Reiniciar servicio SSH
      ansible.builtin.systemd:
        name: sshd
        state: restarted
        enabled: yes

