    # =========================================================================
    - name: Crear directorio para almacenar imagen forense
      ansible.builtin.file:
        path: /forensics/images
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Crear imagen de disco forense (dd) - Simular con datos reales
      ansible.builtin.command: >
        dd if=/dev/sda of=/forensics/images/workstation_disk_image.dd
        bs=4M count=2048 status=progress
      register: dd_result
      async: 300
      poll: 10
      changed_when: dd_result.rc == 0
      ignore_errors: yes

    - name: Calcular hash SHA256 de la imagen de disco
      ansible.builtin.shell: sha256sum /forensics/images/workstation_disk_image.dd
      register: disk_hash
      changed_when: false

    - name: Guardar hash de la imagen de disco
      ansible.builtin.copy:
        content: "SHA256 Hash de la imagen de disco:\n{{ disk_hash.stdout }}\n\nFecha de creacion: {{ ansible_date_time.iso8601 }}\nMaquina origen: workstation\nFormato: Raw (dd)\n"
        dest: /forensics/images/workstation_disk_image.dd.sha256
        owner: root
        group: root
        mode: '0644'

    # =========================================================================
    # CREAR VOLCADO DE MEMORIA SIMULADO
    # =========================================================================
    - name: Crear directorio para volcado de memoria
      ansible.builtin.file:
        path: /forensics/memory
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: Crear volcado de memoria simulado (LiME format)
      ansible.builtin.shell: >
        dd if=/dev/urandom of=/forensics/memory/workstation_memory.dump
        bs=1M count=4096
      register: memdump_result
      async: 300
      poll: 10
      changed_when: memdump_result.rc == 0
      ignore_errors: yes

    - name: Calcular hash SHA256 del volcado de memoria
      ansible.builtin.shell: sha256sum /forensics/memory/workstation_memory.dump
      register: mem_hash
      changed_when: false

    - name: Guardar hash del volcado de memoria
      ansible.builtin.copy:
        content: "SHA256 Hash del volcado de memoria:\n{{ mem_hash.stdout }}\n\nFecha de creacion: {{ ansible_date_time.iso8601 }}\nMaquina origen: workstation\nFormato: LiME\nTamanio RAM: 4GB\n"
        dest: /forensics/memory/workstation_memory.dump.sha256
        owner: root
        group: root
        mode: '0644'

