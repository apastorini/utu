# =============================================================================
# PLAY 7: Configurar instructor VM
# =============================================================================
- name: "Configurar VM del instructor - Almacenamiento de evidencia"
  hosts: instructor
  become: true
  vars_files:
    - vars/defaults.yml

  tasks:
    - name: Actualizar cache de paquetes
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar paquetes necesarios
      ansible.builtin.apt:
        name:
          - nfs-kernel-server
          - nfs-common
          - openssh-server
          - nginx
          - python3
          - python3-pip
          - git
          - curl
          - wget
          - jq
          - tree
          - ncdu
        state: present

    - name: Crear directorio de evidencia
      ansible.builtin.file:
        path: /evidence
        state: directory
        owner: root
        group: instructor
        mode: '0750'

    - name: Crear subdirectorios de evidencia
      ansible.builtin.file:
        path: "/evidence/{{ item }}"
        state: directory
        owner: root
        group: instructor
        mode: '0750'
      loop:
        - disk_images
        - memory_dumps
        - log_archives
        - screenshots
        - chain_of_custody
        - student_submissions
        - tools

    - name: Crear grupo instructor
      ansible.builtin.group:
        name: instructor
        state: present

    - name: Crear usuario instructor
      ansible.builtin.user:
        name: instructor
        groups: instructor
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Configurar NFS para compartir imagen forense
      ansible.builtin.copy:
        content: |
          # NFS exports for forensic evidence
          /evidence  10.10.0.20(rw,sync,no_subtree_check,no_root_squash)
        dest: /etc/exports
        owner: root
        group: root
        mode: '0644'

    - name: Reiniciar servicio NFS
      ansible.builtin.systemd:
        name: nfs-kernel-server
        state: restarted
        enabled: yes

    - name: Crear script de verificacion de hashes
      ansible.builtin.copy:
        content: |
          #!/bin/bash
          # Script para verificar integridad de evidencia forense
          # Banco del Sol - Escenario 06 - Analisis Forense

          EVIDENCE_DIR="/evidence"
          LOG_FILE="/evidence/verification_$(date +%Y%m%d_%H%M%S).log"

          echo "=== Verificacion de Integridad de Evidencia ===" | tee "$LOG_FILE"
          echo "Fecha: $(date)" | tee -a "$LOG_FILE"
          echo "" | tee -a "$LOG_FILE"

          for hash_file in $(find "$EVIDENCE_DIR" -name "*.sha256" -o -name "*.md5"); do
              echo "Verificando: $hash_file" | tee -a "$LOG_FILE"
              dir=$(dirname "$hash_file")
              base=$(basename "$hash_file" | sed 's/\.\(sha256\|md5\)$//')

              if [ -f "$dir/$base" ]; then
                  if grep -q "SHA256" "$hash_file"; then
                      expected=$(grep "SHA256" "$hash_file" | awk '{print $NF}')
                      actual=$(sha256sum "$dir/$base" | awk '{print $1}')
                  elif grep -q "MD5" "$hash_file"; then
                      expected=$(grep "MD5" "$hash_file" | awk '{print $NF}')
                      actual=$(md5sum "$dir/$base" | awk '{print $1}')
                  fi

                  if [ "$expected" = "$actual" ]; then
                      echo "  [OK] $base - Hash verificado" | tee -a "$LOG_FILE"
                  else
                      echo "  [FALLO] $base - Hash NO coincide" | tee -a "$LOG_FILE"
                      echo "    Esperado: $expected" | tee -a "$LOG_FILE"
                      echo "    Actual:   $actual" | tee -a "$LOG_FILE"
                  fi
              else
                  echo "  [ERROR] Archivo no encontrado: $dir/$base" | tee -a "$LOG_FILE"
              fi
              echo "" | tee -a "$LOG_FILE"
          done

          echo "=== Verificacion completada ===" | tee -a "$LOG_FILE"
        dest: /usr/local/bin/verify_evidence.sh
        owner: root
        group: instructor
        mode: '0750'

    - name: Crear plantilla de cadena de custodia
      ansible.builtin.copy:
        content: |
          =============================================================
          CADENA DE CUSTODIA DE EVIDENCIA DIGITAL
          Banco del Sol - Escenario 06
