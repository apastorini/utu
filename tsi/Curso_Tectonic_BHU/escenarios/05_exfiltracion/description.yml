attack_narrative: |
  El atacante obtuvo acceso inicial a la estacion de trabajo mediante credenciales
  comprometidas. Una vez dentro de la red, establish un canal covert de exfiltracion
  utilizando DNS tunneling. La herramienta de exfiltracion codifica datos sensibles
  en subdominios base64 y los envia como consultas DNS a un dominio controlado por
  el atacante (exfil.attacker.com). El servidor DNS externo responde con registros
  TXT que funcionan como canal de command and control.

  El atacante exfiltra registros de la base de datos bancaria (datos de clientes)
  y documentos confidenciales del servidor de archivos. El trafico DNS se mezcla
  con consultas normales dificultando su deteccion. Los estudiantes deben identificar
  los patrones anomalos antes de que todos los datos sensibles sean comprometidos.

blue_team_objectives: |
  Como equipo azul, su mision es:
  1. Detectar el trafico DNS anomalo mediante analisis de logs y captura de paquetes
  2. Identificar las consultas DNS con subdominios codificados como canal de exfiltracion
  3. Analizar y decodificar los datos que se estan exfiltrando
  4. Mapear completamente el canal de command and control
  5. Contener el incidente bloqueando el dominio de exfiltracion
  6. Aislar la estacion de trabajo comprometida
  7. Implementar controles de seguridad DNS
  8. Erradicar la backdoor y verificar que no haya persistencia
  9. Verificar que no haya datos adicionales comprometidos
  10. Documentar el incidente completo para el reporte final

evaluation_criteria:
  - Deteccion temprana del trafico DNS anomalo
  - Analisis correcto de los patrones de exfiltracion
  - Decodificacion exitosa de los datos exfiltrados
  - Identificacion completa del canal de command and control
  - Containment efectivo bloqueando el dominio y aislando el sistema
  - Implementacion de controles de seguridad DNS post-incidente
  - Erradicacion completa de la backdoor
  - Documentacion detallada del incidente y las lecciones aprendidas
