---
name: dns_tunneling_exfiltracion
description: |
  Escenario de exfiltracion de datos mediante DNS tunneling contra la infraestructura
  de Banco del Sol. Un actor malicioso ha comprometido una estacion de trabajo en la red
  interna y utiliza un canal covert basado en consultas DNS para exfiltrar datos
  sensibles hacia un servidor externo controlado por el atacante.

  Los datos objetivo incluyen registros de clientes del servidor de base de datos
  (numeros de cuenta, saldos, datos personales) y documentos confidenciales almacenados
  en el servidor de archivos compartido por SMB.

  La tecnica de DNS tunneling codifica los datos exfiltrados como subdominios en
  consultas DNS (base64 encoded), aprovechando que el trafico DNS rara vez es
  inspeccionado o filtrado en las redes corporativas.

  Los estudiantes actuan como equipo azul (defensores) y deben detectar el canal
  covert de exfiltracion, analizar el trafico DNS anomalo, contener la filtracion
  y erradicar la amenaza.

  Escenarios incluidos:
  - Deteccion de trafico DNS con patrones anomalos
  - Analisis de consultas DNS con subdominios codificados en base64
  - Identificacion de abuso de registros TXT como canal de C2
  - Decodificacion de datos exfiltrados a traves del trafico DNS
  - Containment del canal de exfiltracion
  - Aislamiento de la estacion de trabajo comprometida
  - Bloqueo de resolucion DNS externa no autorizada

tags:
  - exfiltration
  - dns-tunneling
  - data-theft
  - apt
  - covert-channel
  - dns
  - base64
  - incident-response

difficulty: advanced
estimated_time: "2.5 hours"

learning_objectives:
  - Comprender el mecanismo del DNS tunneling como metodo de exfiltracion de datos
  - Detectar trafico DNS con patrones anomalos que indiquen un canal covert
  - Identificar consultas DNS con subdominios excesivamente largos
  - Reconocer el abuso de registros TXT como canal de command and control
  - Analizar y decodificar datos exfiltrados en consultas DNS
  - Implementar controles de seguridad en la resolucion DNS
  - Contener un incidente de exfiltracion sin perder evidencia
  - Aplicar mejores practicas de seguridad DNS en entornos corporativos
  - Documentar correctamente un incidente de exfiltracion de datos
  - Evaluar la necesidad de soluciones de DLP (Data Loss Prevention)

