          ('4.567.890-1', 'Hernandez Castro, Roberto Carlos', '0011-2233-4460', 67890.30, 'Pocitos, Rambla Mahatma Gandhi 3456', '2123-4567', 'rhernandez@email.com', '2020-02-14', 'preferencial'),
          ('3.210.987-6', 'Torres Ramirez, Patricia Elena', '0011-2233-4461', 198540.60, 'Cordón, Ciudad Vieja 789', '2123-8901', 'ptorres@email.com', '2019-07-30', 'vip'),
          ('2.876.543-2', 'Diaz Morales, Fernando Andres', '0011-2233-4462', 43210.45, 'Buceo, Av. Del Libertador 1234', '2123-2345', 'fdiaz@email.com', '2021-04-18', 'basico'),
          ('5.432.109-8', 'Sanchez Vargas, Claudia Andrea', '0011-2233-4463', 156780.20, 'Parque Rodó, Av. Constituyente 567', '2123-6789', 'csanchez@email.com', '2018-08-12', 'preferencial'),
