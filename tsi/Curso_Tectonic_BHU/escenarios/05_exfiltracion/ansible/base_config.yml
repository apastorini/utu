        path: /etc/samba/smb.conf
        marker: "# {mark} BANCO DEL SOL - DIRECTORIO"
        insertbefore: "^\[global\]"
        block: |
          [Compartido]
            path = /srv/samba/Compartido
            browseable = yes
            read only = no
            guest ok = yes
            create mask = 0664
            directory mask = 0775
            force user = nobody
      when: inventory_hostname == "fileserver"

    - name: Reiniciar Samba
      systemd:
        name: smbd
        state: restarted
        enabled: yes
      when: inventory_hostname == "fileserver"

    # =========================================================
    # CONFIGURACION DEL WORKSTATION
    # =========================================================
    - name: Crear directorio de trabajo en workstation
      file:
        path: /home/student
        state: directory
        owner: student
        group: student
        mode: '0755'
      when: inventory_hostname == "workstation"

    - name: Configurar DNS en workstation
      copy:
        content: |
          nameserver 10.10.2.10
          nameserver 8.8.8.8
          nameserver 8.8.4.4
          search bancodelsol.local
        dest: /etc/resolv.conf
        owner: root
        group: root
        mode: '0644'
      when: inventory_hostname == "workstation"

    # =========================================================
    # CONFIGURACION DE CAPTURA DE TRAFICO
    # =========================================================
    - name: Crear directorio para capturas de trafico
      file:
        path: /var/log/traffic_captures
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Crear script de captura de trafico DNS
      copy:
        content: |
          #!/bin/bash
          # Captura de trafico DNS para analisis de exfiltracion
          CAPTURE_DIR="/var/log/traffic_captures"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          # Capturar trafico DNS con suficiente espacio para analisis
          tcpdump -i any port 53 -w "${CAPTURE_DIR}/dns_capture_${TIMESTAMP}.pcap" -c 100000 &
          TCPDUMP_PID=$!
          
          echo "Captura de trafico DNS iniciada"
          echo "PID: ${TCPDUMP_PID}"
          echo "Archivo: ${CAPTURE_DIR}/dns_capture_${TIMCODE}.pcap"
          echo "${TCPDUMP_PID}" > /tmp/dns_capture.pid
          
          # Mantener la captura activa
          wait $TCPDUMP_PID
        dest: /usr/local/bin/start_dns_capture.sh
        owner: root
        group: root
        mode: '0755'

    - name: Iniciar captura de trafico DNS
      command: /usr/local/bin/start_dns_capture.sh
      async: 600
      poll: 0
      ignore_errors: yes

    # =========================================================
    # HABILITAR LOGGING EN TODOS LOS SISTEMAS
    # =========================================================
    - name: Configurar rsyslog para logs centralizados
      lineinfile:
        path: /etc/rsyslog.conf
        line: "*.* @@10.10.2.10:514"
        state: present
      ignore_errors: yes

    - name: Habilitar audit logging
      command: auditctl -e 1
      ignore_errors: yes

    - name: Configurar audit rules para archivos sensibles
      lineinfile:
        path: /etc/audit/rules.d/banco.rules
        line: "{{ item }}"
        state: present
        create: yes
      loop:
        - "-w /etc/passwd -p wa -k identity"
        - "-w /etc/shadow -p wa -k identity"
        - "-w /var/log/ -p wa -k logs"
      ignore_errors: yes

    # =========================================================
    # VERIFICACION DE CONFIGURACION
    # =========================================================
    - name: Verificar servicios ejecutandose
      command: systemctl is-active {{ item.service }}
      register: service_check
      failed_when: service_check.rc != 0
      loop:
        - { service: "ssh" }
        - { service: "bind9", when: "inventory_hostname == 'domaincontroller'" }
        - { service: "mysql", when: "inventory_hostname == 'database'" }
        - { service: "smbd", when: "inventory_hostname == 'fileserver'" }
      when: item.when is not defined or item.when | bool

    - name: Reportar estado de configuracion
      debug:
        msg: >
          [{{ inventory_hostname }}] Configuracion base completada.
          Servicios activos verificados.
