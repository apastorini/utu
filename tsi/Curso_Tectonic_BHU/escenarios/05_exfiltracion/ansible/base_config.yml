      when: inventory_hostname == "database"

    - name: Habilitar logging de consultas en MySQL
      lineinfile:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
        line: "{{ item }}"
        state: present
      loop:
        - "general_log = 1"
        - "general_log_file = /var/log/mysql/query.log"
        - "log_error = /var/log/mysql/error.log"
      when: inventory_hostname == "database"

    - name: Reiniciar MySQL
      systemd:
        name: mysql
        state: restarted
      when: inventory_hostname == "database"

    # =========================================================
    # CONFIGURACION DEL SERVIDOR DE ARCHIVOS (SMB)
    # =========================================================
    - name: Instalar Samba
      apt:
        name:
