---
# Banco del Sol - Escenario 05: Exfiltracion via DNS Tunneling
# Configuracion base del laboratorio
# Ejecutar despues de clonar las VMs

- name: Configuracion base del escenario de exfiltracion
  hosts: all
  become: true
  vars:
    banco_del_sol:
      nombre: "Banco del Sol"
      dominio: "bancodelsol.local"
      dns_domain: "bancodelsol.local"

  tasks:
    # =========================================================
    # CONFIGURACION GENERAL DE RED
    # =========================================================
    - name: Configurar hostname en todas las VMs
      hostname:
        name: "{{ inventory_hostname }}"

    - name: Configurar /etc/hosts con todos los servidores
      lineinfile:
        path: /etc/hosts
        line: "{{ item.ip }} {{ item.hostname }}.{{ banco_del_sol.dns_domain }} {{ item.hostname }}"
        state: present
      loop:
        - { ip: "10.10.0.10", hostname: "attacker" }
        - { ip: "10.10.1.10", hostname: "webserver" }
        - { ip: "10.10.1.20", hostname: "mailserver" }
        - { ip: "10.10.2.10", hostname: "domaincontroller" }
        - { ip: "10.10.2.30", hostname: "fileserver" }
        - { ip: "10.10.2.40", hostname: "database" }
        - { ip: "10.10.2.100", hostname: "workstation" }

    # =========================================================
    # INSTALACION DE HERRAMIENTAS BASE
    # =========================================================
    - name: Instalar paquetes base en todas las VMs
      apt:
        name:
          - tcpdump
          - dnsutils
          - bind9
          - bind9utils
          - wireshark-common
          - tshark
          - nmap
          - curl
          - wget
          - python3
          - python3-pip
          - sysstat
          - net-tools
          - iputils-ping
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Instalar paquetes base en VMs RedHat
      yum:
        name:
          - tcpdump
          - bind-utils
          - bind
          - wireshark-cli
          - nmap
          - curl
          - wget
          - python3
          - python3-pip
          - sysstat
          - net-tools
        state: present
      when: ansible_os_family == "RedHat"

    # =========================================================
    # CONFIGURACION DE DNS LOGGING
    # =========================================================
    - name: Configurar DNS logging en domaincontroller
      blockinfile:
        path: /etc/bind/named.conf.local
        marker: "# {mark} BANCO DEL SOL DNS LOGGING"
        insertafter: EOF
        block: |
          logging {
              channel query_log {
                  file "/var/log/bind/query.log" versions 3 size 50m;
                  severity info;
                  print-time yes;
                  print-severity yes;
                  print-category yes;
              };
              channel security_log {
                  file "/var/log/bind/security.log" versions 3 size 20m;
                  severity dynamic;
                  print-time yes;
                  print-severity yes;
                  print-category yes;
              };
              category queries { query_log; };
              category security { security_log; };
              category rate-limit { query_log; };
          };
      when: inventory_hostname == "domaincontroller"

    - name: Crear directorio para logs DNS
      file:
        path: /var/log/bind
        state: directory
        owner: bind
        group: bind
        mode: '0755'
      when: inventory_hostname == "domaincontroller"

    - name: Habilitar y reiniciar servicio DNS
      systemd:
        name: bind9
        state: restarted
        enabled: yes
      when: inventory_hostname == "domaincontroller"

    # =========================================================
    # CONFIGURACION DEL SERVIDOR DE BASE DE DATOS
    # =========================================================
    - name: Instalar MySQL server
      apt:
        name:
          - mysql-server
          - python3-mysqldb
        state: present
      when: inventory_hostname == "database"

    - name: Iniciar servicio MySQL
      systemd:
        name: mysql
        state: started
        enabled: yes
      when: inventory_hostname == "database"

    - name: Crear base de datos de prueba
      mysql_db:
        name: banco_del_sol
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: inventory_hostname == "database"

    - name: Crear usuario de base de datos
      mysql_user:
        name: admin_banco
        password: "B@nco$2025!Secure"
        priv: "banco_del_sol.*:ALL"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      when: inventory_hostname == "database"

    - name: Crear tablas de datos de prueba
      mysql_query:
        login_db: banco_del_sol
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_user: admin_banco
        login_password: "B@nco$2025!Secure"
        query: "{{ item }}"
      loop:
        - |
          CREATE TABLE IF NOT EXISTS clientes (
            id INT AUTO_INCREMENT PRIMARY KEY,
            dni VARCHAR(12) NOT NULL,
            nombre_completo VARCHAR(100) NOT NULL,
            numero_cuenta VARCHAR(20) NOT NULL,
            saldo DECIMAL(15,2) NOT NULL,
            direccion VARCHAR(200),
            telefono VARCHAR(20),
            email VARCHAR(100),
            fecha_registro DATE,
            nivel_cuenta ENUM('basico', 'preferencial', 'vip', 'premium'),
            INDEX idx_dni (dni),
            INDEX idx_cuenta (numero_cuenta)
          ) ENGINE=InnoDB;
        - |
          CREATE TABLE IF NOT EXISTS tarjetas_credito (
            id INT AUTO_INCREMENT PRIMARY KEY,
            numero_tarjeta VARCHAR(19) NOT NULL,
            titular VARCHAR(100) NOT NULL,
            fecha_vencimiento DATE NOT NULL,
            cvv VARCHAR(4) NOT NULL,
            limite_credito DECIMAL(12,2) NOT NULL,
            saldo_actual DECIMAL(12,2) NOT NULL,
            cliente_id INT,
            FOREIGN KEY (cliente_id) REFERENCES clientes(id),
            INDEX idx_tarjeta (numero_tarjeta)
          ) ENGINE=InnoDB;
        - |
          CREATE TABLE IF NOT EXISTS transacciones (
            id_transaccion INT AUTO_INCREMENT PRIMARY KEY,
            fecha DATETIME NOT NULL,
            monto DECIMAL(12,2) NOT NULL,
            tipo ENUM('deposito', 'retiro', 'transferencia', 'pago') NOT NULL,
            cuenta_origen VARCHAR(20) NOT NULL,
            cuenta_destino VARCHAR(20),
            descripcion VARCHAR(200),
            INDEX idx_fecha (fecha),
            INDEX idx_cuenta_origen (cuenta_origen)
          ) ENGINE=InnoDB;
      when: inventory_hostname == "database"

