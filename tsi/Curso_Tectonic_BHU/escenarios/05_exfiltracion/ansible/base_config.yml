      when: inventory_hostname == "database"

    - name: Poblar tabla tarjetas de credito
      mysql_query:
        login_db: banco_del_sol
        login_unix_socket: /var/run/mysqld/mysqld.sock
        login_user: admin_banco
        login_password: "B@nco$2025!Secure"
        query: >
          INSERT IGNORE INTO tarjetas_credito (numero_tarjeta, titular, fecha_vencimiento, cvv, limite_credito, saldo_actual, cliente_id)
          VALUES
          ('4532-1234-5678-9012', 'Garcia Rodriguez, Maria Elena', '2027-03-31', '847', 500000.00, 125000.00, 1),
          ('4532-2345-6789-0123', 'Fernandez Lopez, Carlos Alberto', '2026-11-30', '392', 300000.00, 87500.00, 2),
          ('4532-3456-7890-1234', 'Martinez Silva, Ana Victoria', '2028-06-30', '156', 750000.00, 45000.00, 3),
