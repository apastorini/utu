stroke="#7aa7c4" stroke-width="1.2"/><text x="390.0" y="266.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">agente</text><rect x="570" y="200" width="160" height="44" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="650.0" y="225.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#1a1a1a">Servidor 3</text><rect x="570" y="248" width="160" height="30" rx="4" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="650.0" y="266.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">agente</text><line x1="130" y1="104" x2="130" y2="146" stroke="#2e7d4f" stroke-width="1.8"/><line x1="650" y1="104" x2="650" y2="146" stroke="#2e7d4f" stroke-width="1.8"/><line x1="130" y1="146" x2="650" y2="146" stroke="#2e7d4f" stroke-width="1.8"/><line x1="130" y1="146" x2="390" y2="96" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="30" y="168" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#2e7d4f">traps (push):  no solicitadas. El agente avisa cuando quiere.</text><text x="30" y="184" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#2e7d4f">Problema: no podes confiar en que lleguen, y no sabes quien esta caido.</text><line x1="130" y1="278" x2="130" y2="296" stroke="#14507a" stroke-width="1.8"/><line x1="390" y1="278" x2="390" y2="296" stroke="#14507a" stroke-width="1.8"/><line x1="650" y1="278" x2="650" y2="296" stroke="#14507a" stroke-width="1.8"/><line x1="650" y1="296" x2="130" y2="278" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="30" y="310" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#14507a">polling (pull):  GET / GETNEXT / GETBULK.</text><text x="30" y="326" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#14507a">El gestor pregunta dispositivo por dispositivo: con muchos, se demora.</text><text x="390" y="24" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">El agente vive en el dispositivo gestionado y la MIB es el esquema de los datos (OIDs jerarquicos).</text></svg></div><div><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 330" style="max-width:760px"><rect width="760" height="330" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Un tunel y por que complica el MTU</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><text x="30" y="36" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#666">Que envuelve a que:</text><rect x="30" y="56" width="120" height="30" rx="3" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="90.0" y="74.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">Host A   192.168.1.25</text><rect x="30" y="88" width="620" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="340.0" y="106.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">paquete original:  192.168.1.25  -&gt;  10.0.0.7</text><rect x="96" y="120" width="554" height="30" rx="3" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="373.0" y="138.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">cabecera IPsec (nueva)</text><rect x="162" y="152" width="488" height="30" rx="3" fill="#f7d9c8" stroke="#c8621a" stroke-width="1.2"/><text x="406.0" y="170.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">cabecera IP exterior:  200.10.10.1  -&gt;  200.10.10.2</text><rect x="620" y="56" width="110" height="90" rx="4" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="675.0" y="104.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">Host B\n10.0.0.7</text><text x="385" y="196" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#c8621a">Cada capa de overlay AUMENTA el tamano del paquete y RESTA MTU disponible.</text><text x="385" y="216" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Por eso hace falta clamp MSS en el borde de las redes con jumbo frames.</text><text x="385" y="244" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Y rompe el aislamiento de capas: el router exterior tiene que ENENDER IPsec</text><text x="385" y="262" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">para forwarding, cuando su unico trabajo deberia ser mirar la IP de destino.</text><text x="385" y="292" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#14507a">Tipos: site-to-site (always on) y remoto (el usuario inicia).</text></svg></div><div><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 700 380" style="max-width:700px"><rect width="700" height="380" fill="#ffffff"/><text x="350.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Dijkstra: S (definitivos) y T (tentativos)</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><line x1="350" y1="60" x2="170" y2="170" stroke="#2e7d4f" stroke-width="2.4"/><rect x="247.0" y="104.0" width="26" height="22" rx="11" fill="#ffffff" stroke="#b8cfdb" stroke-width="1.2"/><text x="260.0" y="118.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">1</text><line x1="350" y1="60" x2="530" y2="170" stroke="#b9c6cf" stroke-width="1.4"/><rect x="427.0" y="104.0" width="26" height="22" rx="11" fill="#ffffff" stroke="#b8cfdb" stroke-width="1.2"/><text x="440.0" y="118.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">4</text><line x1="170" y1="170" x2="100" y2="300" stroke="#2e7d4f" stroke-width="2.4"/><rect x="122.0" y="224.0" width="26" height="22" rx="11" fill="#ffffff" stroke="#b8cfdb" stroke-width="1.2"/><text x="135.0" y="238.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">2</text><line x1="170" y1="170" x2="350" y2="300" stroke="#2e7d4f" stroke-width="2.4"/><rect x="247.0" y="224.0" width="26" height="22" rx="11" fill="#ffffff" stroke="#b8cfdb" stroke-width="1.2"/><text x="260.0" y="238.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">5</text><line x1="530" y1="170" x2="350" y2="300" stroke="#b9c6cf" stroke-width="1.4"/><rect x="427.0" y="224.0" width="26" height="22" rx="11" fill="#ffffff" stroke="#b8cfdb" stroke-width="1.2"/><text x="440.0" y="238.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">1</text><line x1="530" y1="170" x2="600" y2="300" stroke="#b9c6cf" stroke-width="1.4"/><rect x="552.0" y="224.0" width="26" height="22" rx="11" fill="#ffffff" stroke="#b8cfdb" stroke-width="1.2"/><text x="565.0" y="238.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">3</text><line x1="100" y1="300" x2="350" y2="300" stroke="#2e7d4f" stroke-width="2.4"/><rect x="212.0" y="289.0" width="26" height="22" rx="11" fill="#ffffff" stroke="#b8cfdb" stroke-width="1.2"/><text x="225.0" y="303.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">1</text><line x1="350" y1="300" x2="600" y2="300" stroke="#b9c6cf" stroke-width="1.4"/><rect x="462.0" y="289.0" width="26" height="22" rx="11" fill="#ffffff" stroke="#b8cfdb" stroke-width="1.2"/><text x="475.0" y="303.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">2</text><circle cx="350" cy="60" r="21" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2.2"/><text x="350" y="65" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">u</text><text x="350" y="96" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">d=0</text><circle cx="170" cy="170" r="21" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2.2"/><text x="170" y="175" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">v</text><text x="170" y="206" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">d=1</text><circle cx="530" cy="170" r="21" fill="#f7d9c8" stroke="#c8621a" stroke-width="2.2"/><text x="530" y="175" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">w</text><text x="530" y="206" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">d=4</text><circle cx="100" cy="300" r="21" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2.2"/><text x="100" y="305" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">x</text><text x="100" y="336" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">d=3</text><circle cx="350" cy="300" r="21" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="2.2"/><text x="350" y="305" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">y</text><text x="350" y="336" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">d=5</text><circle cx="600" cy="300" r="21" fill="#f7d9c8" stroke="#c8621a" stroke-width="2.2"/><text x="600" y="305" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#1a1a1a">z</text><text x="600" y="336" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">d=7</text><circle cx="60" cy="34" r="8" fill="#2e7d4f"/><text x="74" y="38" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">definitivo (S)</text><circle cx="180" cy="34" r="8" fill="#f7d9c8" stroke="#c8621a"/><text x="194" y="38" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">tentativo (T)</text><text x="350" y="365" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Dijkstra termina cuando S = todos los nodos.</text></svg></div><div><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 340" style="max-width:780px"><rect width="780" height="340" fill="#ffffff"/><text x="390.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Los tres servicios de seguridad</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="34" y="46" width="190" height="46" rx="5" fill="#14507a" stroke="#14507a" stroke-width="1.2"/><text x="129.0" y="73.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">Confidencialidad</text><text x="240" y="65" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">solo el emisor y el receptor entienden el mensaje</text><text x="240" y="84" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">con: cifrado simetrico o asimetrico</text><rect x="34" y="108" width="190" height="46" rx="5" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="129.0" y="135.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">Integridad</text><text x="240" y="127" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">el mensaje no fue alterado en transito</text><text x="240" y="146" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">con: hash / HMAC / AEAD</text><rect x="34" y="170" width="190" height="46" rx="5" fill="#c8621a" stroke="#c8621a" stroke-width="1.2"/><text x="129.0" y="197.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">No repudio</text><text x="240" y="189" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">el emisor no puede negar haberlo enviado</text><text x="240" y="208" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">con: firma digital + identidad vinculable</text><text x="34" y="262" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#666">La diferencia fina entre integridad y no repudio NO es el algoritmo:</text><text x="34" y="282" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#c8621a">es quien controla la clave privada. Si la tiene solo Alicia, Alicia no puede negar.</text><text x="34" y="312" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#0b3d5c">Y los tres se resuelven juntos en TLS, no por separado.</text></svg></div><div><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 740 260" style="max-width:740px"><rect width="740" height="260" fill="#ffffff"/><text x="370.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Handshake de TLS 1.3 en un RTT</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="34" y="46" width="150" height="42" rx="5" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="109.0" y="70.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">1 RTT extra</text><text x="200" y="72" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">ClientHello: versiones, cipher suites, key share</text><rect x="34" y="104" width="150" height="42" rx="5" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="109.0" y="128.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">1 RTT</text><text x="200" y="130" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">ServerHello + Certificate + Finished</text><rect x="34" y="162" width="150" height="42" rx="5" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="109.0" y="186.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">0 RTT</text><text x="200" y="188" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">ya se pueden mandar datos de aplicacion</text><text x="34" y="244" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">TLS 1.3 cambio: solo AEAD, sin compresion, sin renegociacion, y forward secrecy obligatorio.</text><text x="34" y="262" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">El certificado sigue siendo X.509: lo que cambio fue el intercambio de claves.</text></svg></div><div><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 330" style="max-width:760px"><rect width="760" height="330" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Los 6 bloques del curso</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="34" y="48" width="190" height="38" rx="4" fill="#14507a" stroke="#14507a" stroke-width="1.2"/><text x="129.0" y="70.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">A · Fundamentos</text><text x="244" y="72" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">1-7</text><text x="300" y="72" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">redes, capas, retardo, Nyquist/Shannon</text><rect x="34" y="93" width="190" height="38" rx="4" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="129.0" y="115.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">B · Aplicacion</text><text x="244" y="117" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">8-15</text><text x="300" y="117" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">HTTP, DNS, correo, sockets, DHCP</text><rect x="34" y="138" width="190" height="38" rx="4" fill="#c8621a" stroke="#c8621a" stroke-width="1.2"/><text x="129.0" y="160.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">C · Transporte</text><text x="244" y="162" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">16-23</text><text x="300" y="162" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">UDP, TCP, control de congestion</text><rect x="34" y="183" width="190" height="38" rx="4" fill="#b3261e" stroke="#b3261e" stroke-width="1.2"/><text x="129.0" y="205.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">D · Red</text><text x="244" y="207" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">24-37</text><text x="300" y="207" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">IPv4, subnetting, ruteo, BGP, IPv6</text><rect x="34" y="228" width="190" height="38" rx="4" fill="#7aa7c4" stroke="#7aa7c4" stroke-width="1.2"/><text x="129.0" y="250.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">E · Enlace</text><text x="244" y="252" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">38-43</text><text x="300" y="252" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">framing, CRC, ARQ, acceso, 802.11</text><rect x="34" y="273" width="190" height="38" rx="4" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="129.0" y="295.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">F · Servicios</text><text x="244" y="297" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">44-48</text><text x="300" y="297" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">multimedia, QoS, SNMP, seguridad</text></svg></div><div><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 720 400" style="max-width:720px"><rect width="720" height="400" fill="#ffffff"/><text x="360.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Del clic a la primera respuesta</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="40" y="56" width="110" height="42" rx="5" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="95.0" y="81.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight=" rx="4" fill="#fff" stroke="#c8621a" stroke-width="1.2"/><text x="567.0" y="192.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#c8621a">2 RTT</text><rect x="40" y="224" width="110" height="42" rx="5" fill="#b3261e" stroke="#b3261e" stroke-width="1.2"/><text x="95.0" y="249.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">HTTP</text><rect x="166" y="224" width="330" height="42" rx="4" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="331.0" y="248.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">GET /index.html  -&gt;  200 OK</text><rect x="512" y="224" width="110" height="42" rx="4" fill="#fff" stroke="#b3261e" stroke-width="1.2"/><text x="567.0" y="248.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#b3261e">1 RTT</text><rect x="40" y="280" width="110" height="42" rx="5" fill="#eef2f5" stroke="#666" stroke-width="1.2"/><text x="95.0" y="305.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#666">luego</text><rect x="166" y="280" width="456" height="42" rx="4" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="394.0" y="304.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">una conexion TCP por objeto en HTTP/1.1, o multiplexada en h2/h3</text><rect x="40" y="342" width="582" height="44" rx="5" fill="#e9f4ed" stroke="#2e7d4f" stroke-width="1.2"/><text x="331.0" y="368.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#1a1a1a">En total: ~5 RTT antes de recibir el primer byte de la pagina.</text><text x="40" y="408" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Por eso importan la cache, las cookies de sesion y la conexion persistente:</text><text x="40" y="426" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">cada RTT ahorrado se siente en el tiempo de carga.</text></svg></div><div><svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 330" style="max-width:760px"><rect width="760" height="330" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Leaky bucket frente a token bucket</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="60" y="60" width="150" height="150" rx="6" fill="#fff" stroke="#14507a" stroke-width="2"/><rect x="63" y="150" width="144" height="57" fill="#9fc6e0" opacity="0.55"/><line x1="63" y1="150" x2="207" y2="150" stroke="#9fc6e0" stroke-width="2"/><text x="135" y="232" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">leaky bucket</text><rect x="280" y="60" width="150" height="150" rx="6" fill="#fff" stroke="#14507a" stroke-width="2"/><rect x="283" y="180" width="144" height="27" fill="#9fd8b0" opacity="0.55"/><line x1="283" y1="180" x2="427" y2="180" stroke="#9fd8b0" stroke-width="2"/><text x="355" y="232" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">token bucket</tex
