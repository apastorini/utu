<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 740 260" style="max-width:740px"><rect width="740" height="260" fill="#ffffff"/><text x="370.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Handshake de TLS 1.3 en un RTT</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="34" y="46" width="150" height="42" rx="5" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="109.0" y="70.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">1 RTT extra</text><text x="200" y="72" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">ClientHello: versiones, cipher suites, key share</text><rect x="34" y="104" width="150" height="42" rx="5" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="109.0" y="128.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">1 RTT</text><text x="200" y="130" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">ServerHello + Certificate + Finished</text><rect x="34" y="162" width="150" height="42" rx="5" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="109.0" y="186.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">0 RTT</text><text x="200" y="188" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">ya se pueden mandar datos de aplicacion</text><text x="34" y="244" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">TLS 1.3 cambio: solo AEAD, sin compresion, sin renegociacion, y forward secrecy obligatorio.</text><text x="34" y="262" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">El certificado sigue siendo X.509: lo que cambio fue el intercambio de claves.</text></svg>