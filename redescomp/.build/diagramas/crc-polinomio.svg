0" y="317.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#c8621a">0011</text><text x="286" y="319" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#c8621a">= el CRC (4 bits)</text><text x="40" y="352" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">En GF(2) sumar es XOR y multiplicar es AND. Por eso la resta de la division es un XOR.</text><text x="40" y="372" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Se divide D(x)·x^r entre G(x) y se manda el resto pegado al mensaje original.</text></svg>