<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 340" style="max-width:780px"><rect width="780" height="340" fill="#ffffff"/><text x="390.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Unicast, multicast y anycast en IPv6</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="34" y="48" width="210" height="34" rx="5" fill="#14507a" stroke="#14507a" stroke-width="1.2"/><text x="139.0" y="69.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">Unicast</text><text x="139.0" y="104" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">un emisor -&gt; un receptor</text><rect x="49" y="118" width="180" height="30" rx="4" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="139.0" y="136.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">2001:db8::1</text><circle cx="139.0" cy="205" r="17" fill="#fff" stroke="#14507a" stroke-width="2.2"/><line x1="139.0" y1="152" x2="139.0" y2="183" stroke="#14507a" stroke-width="1.8" marker-end="url(#po)"/><rect x="289" y="48" width="210" height="34" rx="5" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="394.0" y="69.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">Multicast</text><text x="394.0" y="104" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">ff00::/8 con jerarquia de ambito</text><rect x="304" y="118" width="180" height="30" rx="4" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="394.0" y="136.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">ff02::1:ff00:1</text><circle cx="394.0" cy="205" r="17" fill="#fff" stroke="#2e7d4f" stroke-width="2.2"/><line x1="394.0" y1="152" x2="394.0" y2="183" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#po)"/><rect x="544" y="48" width="210" height="34" rx="5" fill="#c8621a" stroke="#c8621a" stroke-width="1.2"/><text x="649.0" y="69.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">Anycast</text><text x="649.0" y="104" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">varios nodos con la MISMA IP</text><rect x="559" y="118" width="180" height="30" rx="4" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="649.0" y="136.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">2001:db8::1</text><circle cx="597.0" cy="205" r="17" fill="#fff" stroke="#c8621a" stroke-width="2.2"/><circle cx="649.0" cy="205" r="17" fill="#fff" stroke="#c8621a" stroke-width="2.2"/><circle cx="701.0" cy="205" r="17" fill="#fff" stroke="#c8621a" stroke-width="2.2"/><line x1="649.0" y1="152" x2="649.0" y2="183" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="649.0" y="245" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#c8621a">el router elige el mas cercano</text><text x="390.0" y="296" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#b3261e">anycast NO es un tipo de direccion: es un SERVICIO que se le da a un grupo de nodos.</text><text x="390.0" y="314" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Es lo que usan los root servers de DNS y los resolvers publicos (1.1.1.1, 8.8.8.8).</text></svg>