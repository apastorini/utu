e="9.5" font-weight="400" fill="#1a1a1a">Time to Live</text><text x="127.5" y="182" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">8</text><rect x="215.0" y="138" width="175.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="302.5" y="156.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Protocol</text><text x="302.5" y="182" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">8</text><rect x="390.0" y="138" width="350.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="565.0" y="156.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Header Checksum</text><text x="565.0" y="182" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">16</text><rect x="40.0" y="172" width="700.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="390.0" y="190.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Source IP Address</text><text x="390.0" y="216" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">32</text><rect x="40.0" y="206" width="700.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="390.0" y="224.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Destination IP Address</text><text x="390.0" y="250" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">32</text><rect x="40.0" y="240" width="2800.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="1440.0" y="258.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Options (variables)</text><text x="1440.0" y="284" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">128</text><text x="40" y="314" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#666">En naranja: los tres campos que hacen posible la fragmentación. El bit DF es el 2.º de Flags.</text><text x="40" y="336" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">IHL = 5 significa cabecera de 20 bytes sin opciones.</text></svg>