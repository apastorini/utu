<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 330" style="max-width:760px"><rect width="760" height="330" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Los 6 bloques del curso</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="34" y="48" width="190" height="38" rx="4" fill="#14507a" stroke="#14507a" stroke-width="1.2"/><text x="129.0" y="70.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">A · Fundamentos</text><text x="244" y="72" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">1-7</text><text x="300" y="72" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">redes, capas, retardo, Nyquist/Shannon</text><rect x="34" y="93" width="190" height="38" rx="4" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="129.0" y="115.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">B · Aplicacion</text><text x="244" y="117" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">8-15</text><text x="300" y="117" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">HTTP, DNS, correo, sockets, DHCP</text><rect x="34" y="138" width="190" height="38" rx="4" fill="#c8621a" stroke="#c8621a" stroke-width="1.2"/><text x="129.0" y="160.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">C · Transporte</text><text x="244" y="162" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">16-23</text><text x="300" y="162" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">UDP, TCP, control de congestion</text><rect x="34" y="183" width="190" height="38" rx="4" fill="#b3261e" stroke="#b3261e" stroke-width="1.2"/><text x="129.0" y="205.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">D · Red</text><text x="244" y="207" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">24-37</text><text x="300" y="207" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">IPv4, subnetting, ruteo, BGP, IPv6</text><rect x="34" y="228" width="190" height="38" rx="4" fill="#7aa7c4" stroke="#7aa7c4" stroke-width="1.2"/><text x="129.0" y="250.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">E · Enlace</text><text x="244" y="252" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">38-43</text><text x="300" y="252" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">framing, CRC, ARQ, acceso, 802.11</text><rect x="34" y="273" width="190" height="38" rx="4" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="129.0" y="295.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">F · Servicios</text><text x="244" y="297" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">44-48</text><text x="300" y="297" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">multimedia, QoS, SNMP, seguridad</text></svg>