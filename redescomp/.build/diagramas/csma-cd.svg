idth="250" height="26" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="605.0" y="266.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">r en [0,7]</text><text x="605.0" y="244" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">intento 3</text><line x1="270" y1="250" x2="195" y2="250" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#po)"/><text x="70" y="292" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#14507a">backoff exponencial:  r en [0, 2^k - 1],  k = numero de intento</text><text x="70" y="310" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#2e7d4f">el menor r gana y transmite; si vuelve a chocar, dobla el rango.</text></svg>