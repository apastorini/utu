<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 380" style="max-width:780px"><rect width="780" height="380" fill="#ffffff"/><text x="390.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">CSMA/CA con RTS/CTS y estacion oculta</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="55" y="44" width="110" height="32" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="110.0" y="64.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#1a1a1a">A</text><line x1="110" y1="76" x2="110" y2="300" stroke="#7aa7c4" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="335" y="44" width="110" height="32" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="390.0" y="64.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#1a1a1a">B</text><line x1="390" y1="76" x2="390" y2="300" stroke="#7aa7c4" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="605" y="44" width="110" height="32" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="660.0" y="64.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#1a1a1a">C (oculta)</text><line x1="660" y1="76" x2="660" y2="300" stroke="#7aa7c4" stroke-width="1.3" stroke-dasharray="4 3"/><line x1="110" y1="104" x2="390" y2="104" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="250.0" y="97" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#c8621a">RTS de A</text><line x1="390" y1="138" x2="660" y2="138" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#po)"/><text x="525.0" y="131" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#2e7d4f">CTS de B</text><line x1="110" y1="172" x2="390" y2="172" stroke="#14507a" stroke-width="1.8" marker-end="url(#po)"/><text x="250.0" y="165" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#14507a">trama de A</text><line x1="390" y1="206" x2="110" y2="206" stroke="#b3261e" stroke-width="1.8" marker-end="url(#po)"/><text x="250.0" y="199" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#b3261e">ACK de B</text><text x="70" y="216" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#2e7d4f">asi se resuelve la estacion oculta:</text><rect x="70" y="226" width="640" height="74" rx="5" fill="#eef7f0" stroke="#2e7d4f" stroke-width="1.2"/><text x="390.0" y="266.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">C no oye el RTS de A (no esta a su alcance), pero SI oye el CTS de B: se actualiza su NAV y espera sin transmitir.</text><line x1="660" y1="300" x2="660" y2="300" stroke="#2e7d4f" stroke-width="1.6"/><text x="60" y="338" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">En radio no se puede usar CSMA/CD: la antena es half-duplex, la potencia propia enmascera a los demas</text><text x="60" y="354" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">y no se puede transmitir y escuchar a la vez. Por eso WiFi no detecta colisiones: las EVITA.</text><text x="60" y="374" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#c8621a">Mecanismos: RTS/CTS, NAK, ACK por trama (no acumulado), espera aleatoria y EDCA con 4 colas.</text></svg>