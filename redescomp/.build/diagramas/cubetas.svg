<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 330" style="max-width:760px"><rect width="760" height="330" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Leaky bucket frente a token bucket</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><text x="30" y="40" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#666">La misma salida (una linea fina a la derecha) sale de dos mecanismos distintos:</text><rect x="50" y="64" width="160" height="160" rx="6" fill="#fff" stroke="#14507a" stroke-width="2"/><rect x="53" y="154" width="154" height="67" fill="#9fc6e0" opacity="0.55"/><line x1="53" y1="154" x2="207" y2="154" stroke="#9fc6e0" stroke-width="2.4"/><text x="130" y="250" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">leaky bucket</text><text x="130" y="268" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">nivel = liquido acumulado</text><rect x="270" y="64" width="160" height="160" rx="6" fill="#fff" stroke="#14507a" stroke-width="2"/><rect x="273" y="184" width="154" height="37" fill="#9fd8b0" opacity="0.55"/><line x1="273" y1="184" x2="427" y2="184" stroke="#9fd8b0" stroke-width="2.4"/><text x="350" y="250" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">token bucket</text><text x="350" y="268" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">nivel = tokens disponibles</text><line x1="218" y1="144" x2="218" y2="144" stroke="#14507a" stroke-width="1.8" marker-end="url(#po)"/><line x1="218" y1="74" x2="218" y2="214" stroke="#14507a" stroke-width="2"/><text x="226" y="148" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#14507a">salida a la\ntasa r</text><line x1="438" y1="144" x2="438" y2="144" stroke="#14507a" stroke-width="1.8" marker-end="url(#po)"/><line x1="438" y1="74" x2="438" y2="214" stroke="#14507a" stroke-width="2"/><text x="446" y="148" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#14507a">salida a la\ntasa r</text><line x1="130" y1="14" x2="130" y2="58" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="140" y="34" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#c8621a">entrada</text><line x1="350" y1="14" x2="350" y2="58" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="360" y="34" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#c8621a">tokens a\nritmo r</text><line x1="130" y1="14" x2="350" y2="14" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="500" y="74" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">leaky bucket</text><text x="500" y="96" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">· salida SIEMPRE a la tasa r</text><text x="500" y="115" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">· si esta llena, descarta el paquete</text><text x="500" y="134" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">· NO permite rafagas</text><text x="500" y="153" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">· introduce latencia por la cola</text><text x="500" y="196" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">token bucket</text><text x="500" y="218" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">· sale a la tasa r, pero puede</text><text x="500" y="237" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">  BURSTAR hasta b tokens</text><text x="500" y="256" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">· los tokens se generan a ritmo r</text><text x="500" y="275" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">  y se consumen al enviar</text><text x="500" y="294" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">· SI permite rafagas</text><text x="30" y="300" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#14507a">Parametros comunes:  b = capacidad (tamanio de la cubeta / cantidad maxima de tokens)</text><text x="30" y="318" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#14507a">                             r = tasa de salida o de generacion de tokens</text></svg>