<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 350" style="max-width:780px"><rect width="780" height="350" fill="#ffffff"/><text x="390.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Modelo de gestion: gestor, agentes y MIB</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="290" y="46" width="200" height="48" rx="6" fill="#f7d9c8" stroke="#c8621a" stroke-width="1.2"/><text x="390.0" y="74.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#1a1a1a">Gestor / NMS</text><rect x="50" y="200" width="160" height="44" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="130.0" y="225.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#1a1a1a">Router 1</text><rect x="50" y="248" width="160" height="30" rx="4" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="130.0" y="266.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">agente</text><rect x="310" y="200" width="160" height="44" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="390.0" y="225.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#1a1a1a">Switch 2</text><rect x="310" y="248" width="160" height="30" rx="4" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="390.0" y="266.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">agente</text><rect x="570" y="200" width="160" height="44" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="650.0" y="225.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#1a1a1a">Servidor 3</text><rect x="570" y="248" width="160" height="30" rx="4" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="650.0" y="266.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">agente</text><line x1="130" y1="104" x2="130" y2="146" stroke="#2e7d4f" stroke-width="1.8"/><line x1="650" y1="104" x2="650" y2="146" stroke="#2e7d4f" stroke-width="1.8"/><line x1="130" y1="146" x2="650" y2="146" stroke="#2e7d4f" stroke-width="1.8"/><line x1="130" y1="146" x2="390" y2="96" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="30" y="168" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#2e7d4f">traps (push):  no solicitadas. El agente avisa cuando quiere.</text><text x="30" y="184" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#2e7d4f">Problema: no podes confiar en que lleguen, y no sabes quien esta caido.</text><line x1="130" y1="278" x2="130" y2="296" stroke="#14507a" stroke-width="1.8"/><line x1="390" y1="278" x2="390" y2="296" stroke="#14507a" stroke-width="1.8"/><line x1="650" y1="278" x2="650" y2="296" stroke="#14507a" stroke-width="1.8"/><line x1="650" y1="296" x2="130" y2="278" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="30" y="310" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#14507a">polling (pull):  GET / GETNEXT / GETBULK.</text><text x="30" y="326" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#14507a">El gestor pregunta dispositivo por dispositivo: con muchos, se demora.</text><text x="390" y="24" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">El agente vive en el dispositivo gestionado y la MIB es el esquema de los datos (OIDs jerarquicos).</text></svg>