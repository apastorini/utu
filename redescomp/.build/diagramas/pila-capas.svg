<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 560" style="max-width:780px"><rect width="780" height="560" fill="#ffffff"/><text x="390.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Equivalencia entre el modelo OSI y TCP/IP</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><text x="195.0" y="52" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#0b3d5c">OSI   (7 capas)</text><text x="585.0" y="52" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="700" fill="#0b3d5c">TCP/IP   (5 capas)</text><path d="M36 88 L36 236" stroke="#c8621a" stroke-width="1.8" fill="none"/><text x="28" y="162.0" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#c8621a">se</text><text x="28" y="176.0" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#c8621a">fusionan</text><rect x="50" y="88" width="290" height="44" rx="4" fill="#fbe9dd" stroke="#7aa7c4" stroke-width="1.2"/><text x="195.0" y="114.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#1a1a1a">7  Aplicación</text><rect x="50" y="140" width="290" height="44" rx="4" fill="#fbe9dd" stroke="#7aa7c4" stroke-width="1.2"/><text x="195.0" y="166.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">6  Presentación</text><rect x="50" y="192" width="290" height="44" rx="4" fill="#fbe9dd" stroke="#7aa7c4" stroke-width="1.2"/><text x="195.0" y="218.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">5  Sesión</text><rect x="50" y="244" width="290" height="44" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="195.0" y="270.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">4  Transporte</text><rect x="50" y="296" width="290" height="44" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="195.0" y="322.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">3  Red</text><rect x="50" y="348" width="290" height="44" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="195.0" y="374.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">2  Enlace de datos</text><rect x="50" y="400" width="290" height="44" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="195.0" y="426.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">1  Física</text><rect x="440" y="140.0" width="290" height="44" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="585.0" y="166.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#1a1a1a">5  Aplicación</text><line x1="346" y1="162.0" x2="434" y2="162.0" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><rect x="440" y="244.0" width="290" height="44" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="585.0" y="270.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">4  Transporte</text><line x1="346" y1="266.0" x2="434" y2="266.0" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><rect x="440" y="296.0" width="290" height="44" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="585.0" y="322.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">3  Internet</text><line x1="346" y1="318.0" x2="434" y2="318.0" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><rect x="440" y="362.0" width="290" height="44" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="585.0" y="388.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#1a1a1a">2  Acceso a red</text><line x1="346" y1="384.0" x2="434" y2="384.0" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="390.0" y="478" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#666">En TCP/IP no existen Presentación ni Sesión:</text><text x="390.0" y="498" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="400" fill="#666">el cifrado vive en la capa de Aplicación (TLS) y en la biblioteca.</text><text x="390.0" y="524" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#c8621a">Ojo: hay dos criterios de conteo. Tanenbaum cuenta 5 capas porque</text><text x="390.0" y="540" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#c8621a">separa enlace y física; Kurose cuenta 4. La capa 3 es la misma.</text></svg>