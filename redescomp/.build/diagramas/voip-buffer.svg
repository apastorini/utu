<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 720 380" style="max-width:720px"><rect width="720" height="380" fill="#ffffff"/><text x="360.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Buffer de jitter: por que p es el maximo, no el promedio</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><line x1="90" y1="110" x2="90" y2="320" stroke="#666"/><line x1="90" y1="320" x2="610" y2="320" stroke="#666"/><line x1="90.0" y1="320" x2="90.0" y2="320.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="90.0" cy="320.0" r="4.5" fill="#b3261e"/><text x="98.0" y="324.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">0</text><line x1="138.0" y1="320" x2="138.0" y2="248.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="138.0" cy="248.0" r="4.5" fill="#b3261e"/><text x="146.0" y="252.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">60</text><line x1="186.0" y1="320" x2="186.0" y2="212.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="186.0" cy="212.0" r="4.5" fill="#b3261e"/><text x="194.0" y="216.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">90</text><line x1="234.0" y1="320" x2="234.0" y2="140.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="234.0" cy="140.0" r="4.5" fill="#b3261e"/><text x="242.0" y="144.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">150</text><line x1="282.0" y1="320" x2="282.0" y2="98.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="282.0" cy="98.0" r="4.5" fill="#b3261e"/><text x="290.0" y="102.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">185</text><line x1="330.0" y1="320" x2="330.0" y2="44.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="330.0" cy="44.0" r="4.5" fill="#b3261e"/><text x="338.0" y="48.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">230</text><line x1="378.0" y1="320" x2="378.0" y2="-40.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="378.0" cy="-40.0" r="4.5" fill="#b3261e"/><text x="386.0" y="-36.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">300</text><line x1="426.0" y1="320" x2="426.0" y2="-76.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="426.0" cy="-76.0" r="4.5" fill="#b3261e"/><text x="434.0" y="-72.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">330</text><line x1="474.0" y1="320" x2="474.0" y2="-160.0" stroke="#f2dbd3" stroke-width="1"/><circle cx="474.0" cy="-160.0" r="4.5" fill="#b3261e"/><text x="482.0" y="-156.0" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#b3261e">400</text><text x="82" y="324" text-anchor="end" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">0</text><text x="82" y="114" text-anchor="end" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">400 ms</text><text x="82" y="215.0" text-anchor="end" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">llegada</text><text x="618" y="324" text-anchor="end" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#2e7d4f">ti</text><text x="350" y="346" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">tiempo de generacion</text><line x1="90" y1="-160.0" x2="610" y2="-160.0" stroke="#2e7d4f" stroke-width="1.6" stroke-dasharray="6 4"/><text x="106" y="-169.0" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#2e7d4f">p = 400 ms  =  retardo del ULTIMO  -  retardo del primero</text><text x="106" y="130" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">cada punto es un datagrama: se genera cada 40 ms</text><text x="106" y="148" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">(columna) pero llega cuando puede (fila).</text><text x="106" y="176" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">El receptor DEBERIA emitirlos a ritmo constante, no cuando llegan.</text><text x="106" y="192" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Por eso los mete en un buffer y los reproduce en t_i + p.</text><text x="106" y="296" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#c8621a">Sin buffer, el oyente oye un corte cada vez que un datagrama tarda mas que el anterior.</text></svg>