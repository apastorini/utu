<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 800 330" style="max-width:800px"><rect width="800" height="330" fill="#ffffff"/><text x="400.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Un LSP de MPLS saltando por el nucleo</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="40" y="48" width="150" height="52" rx="6" fill="#f7d9c8" stroke="#c8621a" stroke-width="1.2"/><text x="115.0" y="71.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="700" fill="#1a1a1a">LER ingreso</text><text x="115.0" y="84.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="700" fill="#1a1a1a">red de cliente</text><line x1="194" y1="74" x2="241" y2="74" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><rect x="245" y="48" width="150" height="52" rx="6" fill="#eaf2f7" stroke="#14507a" stroke-width="1.2"/><text x="320.0" y="71.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="700" fill="#1a1a1a">LSR 1</text><text x="320.0" y="84.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="700" fill="#1a1a1a">nucleo</text><line x1="399" y1="74" x2="446" y2="74" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><rect x="450" y="48" width="150" height="52" rx="6" fill="#eaf2f7" stroke="#14507a" stroke-width="1.2"/><text x="525.0" y="71.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="700" fill="#1a1a1a">LSR 2</text><text x="525.0" y="84.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="700" fill="#1a1a1a">nucleo</text><line x1="604" y1="74" x2="651" y2="74" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><rect x="655" y="48" width="150" height="52" rx="6" fill="#f7d9c8" stroke="#c8621a" stroke-width="1.2"/><text x="730.0" y="71.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="700" fill="#1a1a1a">LER egreso</text><text x="730.0" y="84.0" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="700" fill="#1a1a1a">red destino</text><text x="40" y="152" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#c8621a">1. el ingreso decide el camino</text><rect x="40" y="160" width="150" height="44" rx="4" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="115.0" y="179.15" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#1a1a1a">IP 8.8.8.8</text><text x="115.0" y="191.15" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#1a1a1a">sin etiqueta</text><line x1="194" y1="182" x2="241" y2="182" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="245" y="152" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#14507a">2. solo cambia la etiqueta</text><rect x="245" y="160" width="150" height="44" rx="4" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="320.0" y="185.15" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#1a1a1a">Lbl 100 · 12000</text><line x1="399" y1="182" x2="446" y2="182" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="450" y="152" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#14507a">3. sigue cambiando</text><rect x="450" y="160" width="150" height="44" rx="4" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="525.0" y="185.15" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#1a1a1a">Lbl 104 · 12000</text><line x1="604" y1="182" x2="651" y2="182" stroke="#c8621a" stroke-width="1.8" marker-end="url(#po)"/><text x="655" y="152" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="9" font-weight="700" fill="#c8621a">4. el egreso saca la etiqueta</text><rect x="655" y="160" width="150" height="44" rx="4" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="730.0" y="179.15" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#1a1a1a">IP 8.8.8.8</text><text x="730.0" y="191.15" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#1a1a1a">sin etiqueta</text><text x="40" y="250" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">El LSR nunca mira la direccion IP: por eso es rapido.</text><text x="40" y="268" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Ese es el trade-off: velocidad a cambio de que el nucleo no</text><text x="40" y="286" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">puede aplicar ningun filtro de seguridad por IP.</text></svg>