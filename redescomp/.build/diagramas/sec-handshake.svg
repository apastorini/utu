<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 518 362" style="max-width:518px"><rect width="518" height="362" fill="#ffffff"/><text x="259.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Three-way handshake y cierre de 4 vias (Examen 2006-12 P4)</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="34.0" y="38" width="200" height="36" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="134.0" y="59.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#1a1a1a">Cliente  :49200</text><line x1="134.0" y1="74" x2="134.0" y2="346" stroke="#7aa7c4" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="284.0" y="38" width="200" height="36" rx="5" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="384.0" y="59.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#1a1a1a">Servidor  :80</text><line x1="384.0" y1="74" x2="384.0" y2="346" stroke="#7aa7c4" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="134.0" y1="100" x2="384.0" y2="100" stroke="#14507a" stroke-width="1.8" marker-end="url(#p)"/><text x="259.0" y="93" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#14507a">1)  SYN         seq = 2000</text><line x1="384.0" y1="132" x2="134.0" y2="132" stroke="#2e7d4f" stroke-width="1.8" marker-end="url(#po