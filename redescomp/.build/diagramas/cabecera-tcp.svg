<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 330" style="max-width:760px"><rect width="760" height="330" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Cabecera TCP, campo por campo</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="40.0" y="70" width="350.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="215.0" y="88.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Source Port</text><text x="215.0" y="114" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">16</text><rect x="390.0" y="70" width="350.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="565.0" y="88.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Destination Port</text><text x="565.0" y="114" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">16</text><rect x="40.0" y="104" width="700.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="390.0" y="122.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Sequence Number</text><text x="390.0" y="148" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">32</text><rect x="40.0" y="138" width="700.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="390.0" y="156.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Acknowledgment Number</text><text x="390.0" y="182" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">32</text><rect x="40.0" y="172" width="87.5" height="30" rx="3" fill="#f7d9c8" stroke="#7aa7c4" stroke-width="1.2"/><text x="83.75" y="190.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Data Offset</text><text x="83.75" y="216" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">4</text><rect x="127.5" y="172" width="65.625" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="160.3125" y="190.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Res</text><text x="160.3125" y="216" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">3</text><rect x="193.125" y="172" width="196.875" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="291.5625" y="190.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Flags</text><text x="291.5625" y="216" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">9</text><rect x="390.0" y="172" width="350.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="565.0" y="190.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Window Size</text><text x="565.0" y="216" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">16</text><rect x="40.0" y="206" width="350.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="215.0" y="224.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Checksum</text><text x="215.0" y="250" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">16</text><rect x="390.0" y="206" width="350.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="565.0" y="224.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Urgent Pointer</text><text x="565.0" y="250" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">16</text><rect x="40.0" y="240" width="3500.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="1790.0" y="258.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Options (variables)</text><text x="1790.0" y="284" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">160</text><text x="40" y="52" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">bit 0</text><text x="40.0" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">0</text><text x="127.5" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">4</text><text x="215.0" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">8</text><text x="302.5" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">12</text><text x="390.0" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">16</text><text x="477.5" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">20</text><text x="565.0" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">24</text><text x="652.5" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">28</text><text x="740.0" y="52" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9" font-weight="400" fill="#666">32</text><text x="40" y="326" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#666">Cabecera minima: 5 filas de 32 bits = 20 bytes. Con opciones puede llegar a 60 bytes.</text><text x="40" y="356" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#c8621a">Los ACKs son de BYTES, no de segmentos:</text><text x="40" y="376" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#c8621a">si seq = 1100 y mandas 20 bytes, el ACK siguiente es 1120.</text></svg>