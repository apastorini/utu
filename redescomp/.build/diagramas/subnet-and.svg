<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 400" style="max-width:780px"><rect width="780" height="400" fill="#ffffff"/><text x="390.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Como se aplica una mascara de subred, bit a bit</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><text x="40" y="44" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">IP</text><text x="400" y="44" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">Mascara  (/26)</text><text x="600" y="44" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#0b3d5c">AND = resultado</text><text x="40" y="76" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="400" fill="#1a1a1a">11000000</text><text x="400" y="76" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="400" fill="#1a1a1a">11111111</text><text x="600" y="76" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#2e7d4f">11000000</text><line x1="36" y1="86" x2="756" y2="86" stroke="#eef2f4"/><text x="40" y="108" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="400" fill="#1a1a1a">10101000</text><text x="400" y="108" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="400" fill="#1a1a1a">11111111</text><text x="600" y="108" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#2e7d4f">10101000</text><line x1="36" y1="118" x2="756" y2="118" stroke="#eef2f4"/><text x="40" y="140" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="400" fill="#1a1a1a">00001010</text><text x="400" y="140" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="400" fill="#1a1a1a">11111111</text><text x="600" y="140" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#2e7d4f">00001010</text><line x1="36" y1="150" x2="756" y2="150" stroke="#eef2f4"/><text x="40" y="172" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="400" fill="#1a1a1a">00110111</text><text x="400" y="172" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="400" fill="#1a1a1a">11000000</text><text x="600" y="172" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#2e7d4f">00000000</text><line x1="36" y1="182" x2="756" y2="182" stroke="#eef2f4"/><text x="40" y="216" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="13" font-weight="700" fill="#0b3d5c">192.168.10.55  AND  255.255.255.192  =  192.168.10.64</text><text x="40" y="248" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#666">Lo que resulta de ese AND:</text><rect x="40" y="268" width="190" height="26" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="46" y="284.5" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">direccion de red</text><text x="242" y="286" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#c8621a">192.168.10.64</text><rect x="40" y="297" width="190" height="26" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="46" y="313.5" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">primer host</text><text x="242" y="315" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#2e7d4f">192.168.10.65</text><rect x="40" y="326" width="190" height="26" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="46" y="342.5" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">ultimo host</text><text x="242" y="344" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#2e7d4f">192.168.10.126</text><rect x="40" y="355" width="190" height="26" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="46" y="371.5" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">broadcast</text><text x="242" y="373" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#b3261e">192.168.10.127</text><rect x="40" y="384" width="190" height="26" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="46" y="400.5" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">hostables</text><text x="242" y="402" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#0b3d5c">62</text><text x="400" y="248" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#666">El prefijo /26 significa:</text><text x="400" y="270" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">26 bits de red + 6 bits de host</text><text x="400" y="290" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">2^6 = 64 direcciones en la subred</text><text x="400" y="310" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#c8621a">64 - 2 = 62 hostables</text><text x="400" y="344" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#666">El AND pone en 0 todos los bits</text><text x="400" y="360" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#666">de host: por eso el resultado es</text><text x="400" y="376" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#666">la direccion de RED, no una de host.</text></svg>