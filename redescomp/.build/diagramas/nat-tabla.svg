<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 350" style="max-width:760px"><rect width="760" height="350" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Tabla NAT con traduccion de puertos (PAT)</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="24" y="46" width="236" height="30" rx="4" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="142.0" y="64.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">IP privada : puerto</text><rect x="268" y="46" width="236" height="30" rx="4" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="386.0" y="64.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">IP publica : puerto</text><rect x="512" y="46" width="236" height="30" rx="4" fill="#0b3d5c" stroke="#0b3d5c" stroke-width="1.2"/><text x="630.0" y="64.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">estado</text><rect x="24" y="82" width="236" height="30" rx="3" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="142.0" y="100.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">192.168.1.25 : 51000</text><rect x="268" y="82" width="236" height="30" rx="3" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="386.0" y="100.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">220.10.10.30 : 40001</text><rect x="512" y="82" width="236" height="30" rx="3" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="630.0" y="100.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">activa</text><rect x="24" y="115" width="236" height="30" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="142.0" y="133.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">192.168.1.25 : 51002</text><rect x="268" y="115" width="236" height="30" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="386.0" y="133.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">220.10.10.30 : 40002</text><rect x="512" y="115" width="236" height="30" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="630.0" y="133.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">activa</text><rect x="24" y="148" width="236" height="30" rx="3" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="142.0" y="166.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">192.168.1.40 : 33333</text><rect x="268" y="148" width="236" height="30" rx="3" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="386.0" y="166.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">220.10.10.30 : 40003</text><rect x="512" y="148" width="236" height="30" rx="3" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="630.0" y="166.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">activa</text><rect x="24" y="181" width="236" height="30" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="142.0" y="199.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">192.168.1.77 : 8080</text><rect x="268" y="181" width="236" height="30" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="386.0" y="199.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">220.10.10.30 : 40004</text><rect x="512" y="181" width="236" height="30" rx="3" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="630.0" y="199.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">timeout 300 s</text><text x="24" y="248" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">La clave de la tabla es (IP privada, puerto privado). El puerto es lo que permite</text><text x="24" y="264" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">multiplexar many-to-one: 3 sesiones, 1 sola IP publica.</text><text x="24" y="290" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Al volver un paquete se busca (IP publica, puerto publico) y se traducen</text><text x="24" y="306" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">la IP destino y el puerto destino.</text><text x="24" y="332" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#c8621a">Ese es el motivo por el que NAT rompe el aislamiento de capas:</text><text x="24" y="348" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#c8621a">el router tiene que entender TCP/UDP para funcionar.</text></svg>