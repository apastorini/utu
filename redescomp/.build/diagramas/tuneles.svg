<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 330" style="max-width:760px"><rect width="760" height="330" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Un tunel y por que complica el MTU</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><text x="30" y="36" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#666">Que envuelve a que:</text><rect x="30" y="56" width="120" height="30" rx="3" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="90.0" y="74.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">Host A   192.168.1.25</text><rect x="30" y="88" width="620" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="340.0" y="106.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">paquete original:  192.168.1.25  -&gt;  10.0.0.7</text><rect x="96" y="120" width="554" height="30" rx="3" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="373.0" y="138.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">cabecera IPsec (nueva)</text><rect x="162" y="152" width="488" height="30" rx="3" fill="#f7d9c8" stroke="#c8621a" stroke-width="1.2"/><text x="406.0" y="170.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">cabecera IP exterior:  200.10.10.1  -&gt;  200.10.10.2</text><rect x="620" y="56" width="110" height="90" rx="4" fill="#eaf2f7" stroke="#b8cfdb" stroke-width="1.2"/><text x="675.0" y="104.5" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#1a1a1a">Host B\n10.0.0.7</text><text x="385" y="196" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#c8621a">Cada capa de overlay AUMENTA el tamano del paquete y RESTA MTU disponible.</text><text x="385" y="216" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Por eso hace falta clamp MSS en el borde de las redes con jumbo frames.</text><text x="385" y="244" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Y rompe el aislamiento de capas: el router exterior tiene que ENENDER IPsec</text><text x="385" y="262" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">para forwarding, cuando su unico trabajo deberia ser mirar la IP de destino.</text><text x="385" y="292" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="10" font-weight="700" fill="#14507a">Tipos: site-to-site (always on) y remoto (el usuario inicia).</text></svg>