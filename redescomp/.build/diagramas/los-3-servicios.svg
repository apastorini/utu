<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 780 356" style="max-width:780px"><rect width="780" height="356" fill="#ffffff"/><text x="390.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Los tres servicios de seguridad</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="34" y="40" width="196" height="48" rx="5" fill="#14507a" stroke="#14507a" stroke-width="1.2"/><text x="132.0" y="68.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">Confidencialidad</text><text x="248" y="59" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">solo el emisor y el receptor entienden el mensaje</text><text x="248" y="79" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">se logra con: cifrado simetrico o asimetrico</text><rect x="34" y="102" width="196" height="48" rx="5" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="132.0" y="130.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">Integridad</text><text x="248" y="121" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">el mensaje no fue alterado en transito</text><text x="248" y="141" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">se logra con: hash / HMAC / AEAD</text><rect x="34" y="164" width="196" height="48" rx="5" fill="#c8621a" stroke="#c8621a" stroke-width="1.2"/><text x="132.0" y="192.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#ffffff">No repudio</text><text x="248" y="183" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">el emisor no puede negar haberlo enviado</text><text x="248" y="203" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">se logra con: firma digital + identidad vinculable</text><rect x="34" y="240" width="712" height="70" rx="6" fill="#fdf3ec" stroke="#c8621a"/><text x="50" y="266" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#c8621a">La diferencia fina entre integridad y no repudio NO es el algoritmo.</text><text x="50" y="288" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#c8621a">Es QUIEN controla la clave privada: si la tiene solo Alicia, Alicia no puede negar.</text><text x="34" y="332" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#0b3d5c">Y los tres se resuelven juntos en TLS, no por separado.</text><text x="34" y="352" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Sumalos: autenticacion (soy quien digo ser) y control de acceso.</text></svg>