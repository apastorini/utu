<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 740 280" style="max-width:740px"><rect width="740" height="280" fill="#ffffff"/><text x="370.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Cabecera IPv6, campo por campo</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="40.0" y="70" width="87.5" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="83.75" y="88.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Version</text><rect x="127.5" y="70" width="175.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="215.0" y="88.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Traffic Class</text><rect x="302.5" y="70" width="437.5" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="521.25" y="88.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Flow Label</text><rect x="40.0" y="104" width="350.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="215.0" y="122.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Payload Length</text><rect x="390.0" y="104" width="175.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="477.5" y="122.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Next Header</text><rect x="565.0" y="104" width="175.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="652.5" y="122.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Hop Limit</text><rect x="40.0" y="138" width="2800.0" height="30" rx="3" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="1440.0" y="156.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Source Address</text><rect x="40.0" y="172" width="2800.0" height="30" rx="3" fill="#dceaf3" stroke="#7aa7c4" stroke-width="1.2"/><text x="1440.0" y="190.325" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="9.5" font-weight="400" fill="#1a1a1a">Destination Address</text><text x="40" y="56" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">cabecera fija de 40 bytes (5 filas), sin opciones</text><text x="40" y="242" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#666">Desaparecen frente a IPv4: el checksum de cabecera, el IHL y el Fragment Offset.</text><text x="40" y="264" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#2e7d4f">Aparece: el Flow Label de 20 bits, que identifica un flujo sin mirar el 5-tupla.</text><text x="40" y="286" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#c8621a">El Payload Length excluye las cabeceras de extensión.</text></svg>