<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 760 510" style="max-width:760px"><rect width="760" height="510" fill="#ffffff"/><text x="380.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Encapsulación: de 500 bytes a 558</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><text x="50" y="64" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#666">Cada capa ENVUELVE a la anterior. Lo naranja es overhead nuevo.</text><text x="50" y="92" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#14507a">Aplicación</text><rect x="146" y="76" width="20" height="42" rx="3" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="156.0" y="101.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#c8621a">+</text><rect x="166" y="76" width="360" height="42" rx="4" fill="#eaf2f7" stroke="#7aa7c4" stroke-width="1.2"/><text x="346.0" y="100.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">500 B  de datos</text><text x="538" y="93" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">500 B</text><text x="50" y="146" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#14507a">Transporte</text><rect x="146" y="130" width="20" height="42" rx="3" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="156.0" y="155.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#c8621a">+</text><rect x="166" y="130" width="100" height="42" rx="4" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="216.0" y="154.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">20 B</text><rect x="266" y="130" width="260" height="42" rx="4" fill="#d8e8f2" stroke="#7aa7c4" stroke-width="1.2"/><text x="396.0" y="154.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">cabecera TCP</text><text x="538" y="147" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">540 B</text><text x="50" y="200" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#14507a">Internet</text><rect x="146" y="184" width="20" height="42" rx="3" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="156.0" y="209.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#c8621a">+</text><rect x="166" y="184" width="100" height="42" rx="4" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="216.0" y="208.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">20 B</text><rect x="266" y="184" width="260" height="42" rx="4" fill="#c2dcee" stroke="#7aa7c4" stroke-width="1.2"/><text x="396.0" y="208.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">cabecera IP</text><text x="538" y="201" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">560 B</text><text x="50" y="254" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="11" font-weight="700" fill="#14507a">Enlace</text><rect x="146" y="238" width="20" height="42" rx="3" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="156.0" y="263.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#c8621a">+</text><rect x="166" y="238" width="100" height="42" rx="4" fill="#fbe0d0" stroke="#c8621a" stroke-width="1.2"/><text x="216.0" y="262.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">18 B</text><rect x="266" y="238" width="260" height="42" rx="4" fill="#aacfe8" stroke="#7aa7c4" stroke-width="1.2"/><text x="396.0" y="262.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">cabecera Ethernet + FCS</text><text x="538" y="255" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">572 B</text><rect x="146" y="304" width="380" height="42" rx="4" fill="#f7d9c8" stroke="#c8621a" stroke-width="1.2"/><text x="336.0" y="329.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#1a1a1a">558 bytes en el medio físico</text><text x="50" y="392" text-anchor="start" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="12" font-weight="700" fill="#2e7d4f">Eficiencia = 500 / 558 = 89.6%</text><rect x="50" y="404" width="380" height="18" fill="#eee" stroke="#b8cfdb"/><rect x="50" y="404" width="340.5" height="18" fill="#2e7d4f"/><text x="438" y="418" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#2e7d4f">datos 89,6%</text><text x="438" y="434" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#c8621a">overhead 10,4%</text><text x="50" y="474" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#666">El receptor hace lo mismo pero al revés: desempaqueta capa por capa.</text><text x="50" y="496" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#c8621a">Con un mensaje de 50 bytes el overhead sería del 54%: por eso HTTP agrupa los objetos pequeños.</text></svg>