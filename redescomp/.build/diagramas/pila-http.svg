<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 720 400" style="max-width:720px"><rect width="720" height="400" fill="#ffffff"/><text x="360.0" y="24" text-anchor="middle" font-family="'Segoe UI','Noto Sans',sans-serif" font-size="15" font-weight="600" fill="#0b3d5c">Del clic a la primera respuesta</text><defs><marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14507a"/></marker><marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c8621a"/></marker><marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker></defs><rect x="40" y="56" width="110" height="42" rx="5" fill="#2e7d4f" stroke="#2e7d4f" stroke-width="1.2"/><text x="95.0" y="81.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">DNS</text><rect x="166" y="56" width="330" height="42" rx="4" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="331.0" y="80.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">resolver www.ejemplo.com -&gt; 93.184.216.34</text><rect x="512" y="56" width="110" height="42" rx="4" fill="#fff" stroke="#2e7d4f" stroke-width="1.2"/><text x="567.0" y="80.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#2e7d4f">1 RTT</text><rect x="40" y="112" width="110" height="42" rx="5" fill="#14507a" stroke="#14507a" stroke-width="1.2"/><text x="95.0" y="137.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">TCP</text><rect x="166" y="112" width="330" height="42" rx="4" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="331.0" y="136.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">handshake de 3 vias contra el puerto 80</text><rect x="512" y="112" width="110" height="42" rx="4" fill="#fff" stroke="#14507a" stroke-width="1.2"/><text x="567.0" y="136.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#14507a">1 RTT</text><rect x="40" y="168" width="110" height="42" rx="5" fill="#c8621a" stroke="#c8621a" stroke-width="1.2"/><text x="95.0" y="193.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">TLS</text><rect x="166" y="168" width="330" height="42" rx="4" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="331.0" y="192.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">handshake, certificado, claves de sesion</text><rect x="512" y="168" width="110" height="42" rx="4" fill="#fff" stroke="#c8621a" stroke-width="1.2"/><text x="567.0" y="192.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#c8621a">2 RTT</text><rect x="40" y="224" width="110" height="42" rx="5" fill="#b3261e" stroke="#b3261e" stroke-width="1.2"/><text x="95.0" y="249.55" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="13" font-weight="700" fill="#ffffff">HTTP</text><rect x="166" y="224" width="330" height="42" rx="4" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="331.0" y="248.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">GET /index.html  -&gt;  200 OK</text><rect x="512" y="224" width="110" height="42" rx="4" fill="#fff" stroke="#b3261e" stroke-width="1.2"/><text x="567.0" y="248.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="700" fill="#b3261e">1 RTT</text><rect x="40" y="280" width="110" height="42" rx="5" fill="#eef2f5" stroke="#666" stroke-width="1.2"/><text x="95.0" y="305.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#666">luego</text><rect x="166" y="280" width="456" height="42" rx="4" fill="#f7f9fa" stroke="#b8cfdb" stroke-width="1.2"/><text x="394.0" y="304.85" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="11" font-weight="400" fill="#1a1a1a">una conexion TCP por objeto en HTTP/1.1, o multiplexada en h2/h3</text><rect x="40" y="342" width="582" height="44" rx="5" fill="#e9f4ed" stroke="#2e7d4f" stroke-width="1.2"/><text x="331.0" y="368.2" text-anchor="middle" font-family="Consolas,'Cascadia Mono',monospace" font-size="12" font-weight="700" fill="#1a1a1a">En total: ~5 RTT antes de recibir el primer byte de la pagina.</text><text x="40" y="408" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">Por eso importan la cache, las cookies de sesion y la conexion persistente:</text><text x="40" y="426" text-anchor="start" font-family="Consolas,'Cascadia Mono',monospace" font-size="10" font-weight="400" fill="#666">cada RTT ahorrado se siente en el tiempo de carga.</text></svg>