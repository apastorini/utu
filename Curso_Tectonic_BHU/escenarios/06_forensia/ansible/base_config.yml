---
# ==============================================================================
# Escenario Forensia - Configuracion Base de Imagenes
# ==============================================================================
# Este playbook se ejecuta DURANTE la creacion de imagenes base (fase Packer).
# Instala todas las dependencias que requieren conexion a internet.
#
# COMPONENTES INSTALADOS:
#   1. blue-team-ws: wireshark, tshark, tcpdump, foremost, sleuthkit,
#                    binwalk, autopsy (cli), python3, volatility3
#   2. db-srv: python3, procps, openssh-server, net-tools
# ==============================================================================

- name: "Configurar blue-team-ws para analisis forense"
  hosts: blue-team-ws
  gather_facts: yes
  become: yes
  tasks:
    - name: "Actualizar repositorios"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: "Instalar herramientas de analisis forense"
      ansible.builtin.package:
        state: present
        name:
          - wireshark
          - wireshark-common
          - tshark
          - tcpdump
          - foremost
          - sleuthkit
          - binwalk
          - autopsy
          - python3
          - python3-pip
          - python3-venv
          - foremost
          - nmap
          - net-tools
          - sqlite3
          - imagemagick
          - exiftool
          - strings
          - file

    - name: "Instalar volatility3 via pip"
      ansible.builtin.pip:
        name:
          - volatility3
          - yara-python
          - pefile
        executable: pip3

    - name: "Instalar herramientas adicionales de analisis"
      ansible.builtin.pip:
        name:
          - scapy
          - pyshark
          - cryptography
        executable: pip3

    - name: "Crear directorio de trabajo forense"
      ansible.builtin.file:
        path: /opt/forensics
        state: directory
        mode: "0755"

    - name: "Copiar scripts de analisis"
      ansible.builtin.copy:
        dest: /opt/forensics/analyze_memory.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Script de analisis de memoria - Banco del Sol
          # Utiliza volatility3 para analisis forense

          MEMORY_FILE="$1"
          OUTPUT_DIR="/opt/forensics/output"

          if [ -z "$MEMORY_FILE" ]; then
            echo "Uso: $0 <archivo_de_memoria>"
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR"

          echo "============================================"
          echo "  ANALISIS DE MEMORIA - VOLATILITY3"
          echo "  Banco del Sol"
          echo "============================================"
          echo ""

          echo "[*] Analizando imagen de memoria..."
          echo "[*] Archivo: $MEMORY_FILE"
          echo "[*] Directorio de salida: $OUTPUT_DIR"
          echo ""

          # Listar procesos
          echo "[*] Listando procesos..."
          python3 -m volatility3 -f "$MEMORY_FILE" windows.pslist 2>/dev/null | tee "$OUTPUT_DIR/process_list.txt"

          # Listar conexiones de red
          echo "[*] Analizando conexiones de red..."
          python3 -m volatility3 -f "$MEMORY_FILE" windows.netscan 2>/dev/null | tee "$OUTPUT_DIR/network_connections.txt"

          # Listar archivos abiertos
          echo "[*] Analizando archivos abiertos..."
          python3 -m volatility3 -f "$MEMORY_FILE" windows.handles 2>/dev/null | tee "$OUTPUT_DIR/open_handles.txt"

          # Buscar DLLs cargadas
          echo "[*] Analizando DLLs cargadas..."
          python3 -m volatility3 -f "$MEMORY_FILE" windows.dlllist 2>/dev/null | tee "$OUTPUT_DIR/loaded_dlls.txt"

          echo ""
          echo "[+] Analisis completado"
          echo "[*] Resultados en: $OUTPUT_DIR"

    - name: "Copiar script de analisis de logs"
      ansible.builtin.copy:
        dest: /opt/forensics/analyze_logs.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Script de analisis de logs - Banco del Sol
          # Analiza logs del sistema en busca de actividad maliciosa

          LOG_DIR="$1"
          OUTPUT_DIR="/opt/forensics/output"

          if [ -z "$LOG_DIR" ]; then
            echo "Uso: $0 <directorio_de_logs>"
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR"

          echo "============================================"
          echo "  ANALISIS DE LOGS - BANCO DEL SOL"
          echo "============================================"
          echo ""

          # Analizar auth.log
          if [ -f "$LOG_DIR/auth.log" ]; then
            echo "[*] Analizando auth.log..."
            echo "  Intentos de login fallidos:"
            grep -i "failed\|failure" "$LOG_DIR/auth.log" | wc -l
            echo "  Intentos de login exitosos:"
            grep -i "accepted" "$LOG_DIR/auth.log" | wc -l
            echo ""
            echo "  Ultimos 20 intentos fallidos:"
            grep -i "failed" "$LOG_DIR/auth.log" | tail -20 | tee "$OUTPUT_DIR/failed_logins.txt"
          fi

          # Analizar syslog
          if [ -f "$LOG_DIR/syslog" ]; then
            echo "[*] Analizando syslog..."
            echo "  Entradas relacionadas con malware:"
            grep -i "malware\|virus\|trojan\|backdoor" "$LOG_DIR/syslog" | tee "$OUTPUT_DIR/malware_entries.txt"
            echo ""
            echo "  Procesos sospechosos:"
            grep -i "nc\|netcat\|ncat\|python.*reverse" "$LOG_DIR/syslog" | tee "$OUTPUT_DIR/suspicious_processes.txt"
          fi

          echo ""
          echo "[+] Analisis de logs completado"

    - name: "Copiar script de recuperacion de archivos"
      ansible.builtin.copy:
        dest: /opt/forensics/recover_files.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Script de recuperacion de archivos - Banco del Sol
          # Usa foremost y sleuthkit para recuperar archivos eliminados

          IMAGE_FILE="$1"
          OUTPUT_DIR="/opt/forensics/recovered"

          if [ -z "$IMAGE_FILE" ]; then
            echo "Uso: $0 <archivo_de_imagen>"
            exit 1
          fi

          mkdir -p "$OUTPUT_DIR"

          echo "============================================"
          echo "  RECUPERACION DE ARCHIVOS"
          echo "  Banco del Sol"
          echo "============================================"
          echo ""

          # Recuperar archivos con foremost
          echo "[*] Recuperando archivos con foremost..."
          foremost -i "$IMAGE_FILE" -o "$OUTPUT_DIR/foremost" 2>/dev/null

          # Analizar con sleuthkit
          echo "[*] Analizando imagen con sleuthkit..."
          fls "$IMAGE_FILE" 2>/dev/null | tee "$OUTPUT_DIR/file_list.txt"

          # Buscar archivos eliminados
          echo "[*] Buscando archivos eliminados..."
          fls -r "$IMAGE_FILE" 2>/dev/null | grep "*" | tee "$OUTPUT_DIR/deleted_files.txt"

          echo ""
          echo "[+] Recuperacion completada"
          echo "[*] Archivos recuperados en: $OUTPUT_DIR/foremost"
          echo "[*] Lista de archivos en: $OUTPUT_DIR/file_list.txt"

- name: "Configurar db-srv con artefactos forenses"
  hosts: db-srv
  gather_facts: yes
  become: yes
  tasks:
    - name: "Actualizar repositorios"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: "Instalar herramientas en db-srv"
      ansible.builtin.package:
        state: present
        name:
          - python3
          - python3-pip
          - procps
          - openssh-server
          - net-tools
          - sysstat
          - last

    - name: "Crear usuario admin"
      ansible.builtin.user:
        name: admin
        password: "{{ 'admin123' | password_hash('sha512', salt='bhusalt', rounds=5000) }}"
        shell: /bin/bash
        groups: sudo
        create_home: yes

    - name: "Habilitar login SSH con password"
      block:
        - name: "Buscar archivos de configuracion SSH"
          ansible.builtin.find:
            paths: /etc/ssh/sshd_config.d
            file_type: file
          register: ssh_config

        - name: "Ajustar configuracion SSH"
          ansible.builtin.lineinfile:
            path: "{{ item.path }}"
            regex: "^\\s*PasswordAuthentication"
            line: "PasswordAuthentication yes"
          with_items:
            - "{{ ssh_config['files'] }}"
            - { path: '/etc/ssh/sshd_config' }

    - name: "Habilitar y iniciar servicio SSH"
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: yes
