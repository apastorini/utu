- name: "Configurar blue-team-ws para analisis forense"
  hosts: blue-team-ws
  gather_facts: yes
  become: yes
  tasks:
    - name: "Crear directorio de trabajo forense"
      ansible.builtin.file:
        path: /opt/forensics
        state: directory
        mode: "0755"

    - name: "Crear script de adquisicion de evidencia"
      ansible.builtin.copy:
        dest: /opt/forensics/acquire_evidence.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Adquisicion de Evidencia - Banco del Sol
          # Preserva evidencia de db-srv para analisis forense

          DB_SRV="{{ hostvars['db-srv']['ansible_default_ipv4']['address'] | default('10.0.0.3') }}"
          OUTPUT_DIR="/opt/forensics/evidence"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)

          mkdir -p "$OUTPUT_DIR/$TIMESTAMP"

          echo "============================================"
          echo "  ADQUISICION DE EVIDENCIA"
          echo "  Banco del Sol - Analisis Forense"
          echo "============================================"
          echo ""

          # Fase 1: Evidencia volatil
          echo "[*] Fase 1: Adquiriendo evidencia volatil..."
          ssh admin@$DB_SRV "ps aux" > "$OUTPUT_DIR/$TIMESTAMP/ps_output.txt"
          ssh admin@$DB_SRV "netstat -tlnp" > "$OUTPUT_DIR/$TIMESTAMP/netstat_output.txt"
          ssh admin@$DB_SRV "ss -tlnp" > "$OUTPUT_DIR/$TIMESTAMP/ss_output.txt"
          ssh admin@$DB_SRV "last -50" > "$OUTPUT_DIR/$TIMESTAMP/last_output.txt"
          ssh admin@$DB_SRV "who" > "$OUTPUT_DIR/$TIMESTAMP/who_output.txt"
          ssh admin@$DB_SRV "w" > "$OUTPUT_DIR/$TIMESTAMP/w_output.txt"
          ssh admin@$DB_SRV "df -h" > "$OUTPUT_DIR/$TIMESTAMP/df_output.txt"
          ssh admin@$DB_SRV "mount" > "$OUTPUT_DIR/$TIMESTAMP/mount_output.txt"
          ssh admin@$DB_SRV "cat /proc/cpuinfo" > "$OUTPUT_DIR/$TIMESTAMP/cpuinfo.txt"
          ssh admin@$DB_SRV "uname -a" > "$OUTPUT_DIR/$TIMESTAMP/uname_output.txt"
          echo "  [+] Evidencia volatil adquirida"

          # Fase 2: Logs del sistema
          echo "[*] Fase 2: Adquiriendo logs del sistema..."
          scp admin@$DB_SRV:/var/log/auth.log "$OUTPUT_DIR/$TIMESTAMP/auth.log" 2>/dev/null
          scp admin@$DB_SRV:/var/log/syslog "$OUTPUT_DIR/$TIMESTAMP/syslog" 2>/dev/null
          scp admin@$DB_SRV:/var/log/kern.log "$OUTPUT_DIR/$TIMESTAMP/kern.log" 2>/dev/null
          ssh admin@$DB_SRV "cat /var/log/auth.log" > "$OUTPUT_DIR/$TIMESTAMP/auth_log_full.txt"
          echo "  [+] Logs adquiridos"

          # Fase 3: Archivos de evidencia
          echo "[*] Fase 3: Adquiriendo archivos de evidencia..."
          ssh admin@$DB_SRV "cat /opt/memory_dump.txt" > "$OUTPUT_DIR/$TIMESTAMP/memory_dump.txt"
          ssh admin@$DB_SRV "cat /opt/.hidden/attack_timeline.txt" > "$OUTPUT_DIR/$TIMESTAMP/attack_timeline.txt"
          ssh admin@$DB_SRV "cat /opt/.hidden/credentials.txt" > "$OUTPUT_DIR/$TIMESTAMP/credentials.txt"
          ssh admin@$DB_SRV "cat /opt/.hidden/data_dump.csv" > "$OUTPUT_DIR/$TIMESTAMP/data_dump.csv"
          ssh admin@$DB_SRV "ls -la /opt/.hidden/" > "$OUTPUT_DIR/$TIMESTAMP/hidden_files.txt"
          echo "  [+] Archivos de evidencia adquiridos"

          # Fase 4: Hashes para integridad
          echo "[*] Fase 4: Calculando hashes de integridad..."
          cd "$OUTPUT_DIR/$TIMESTAMP"
          find . -type f -exec sha256sum {} \; > hashes.txt
          echo "  [+] Hashes calculados"

          echo ""
          echo "[+] Adquisicion de evidencia completada"
          echo "[*] Evidencia en: $OUTPUT_DIR/$TIMESTAMP"

    - name: "Crear script de analisis de timeline"
      ansible.builtin.copy:
        dest: /opt/forensics/build_timeline.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Construccion de Timeline - Banco del Sol
          # Reconstruye la cronologia del ataque

          EVIDENCE_DIR="$1"

          if [ -z "$EVIDENCE_DIR" ]; then
            echo "Uso: $0 <directorio_de_evidencia>"
            exit 1
          fi

          echo "============================================"
          echo "  CONSTRUCCION DE TIMELINE"
          echo "  Banco del Sol"
          echo "============================================"
          echo ""

          # Extraer timestamps de logs
          echo "[*] Extrayendo timestamps de auth.log..."
          if [ -f "$EVIDENCE_DIR/auth.log" ]; then
            grep -E "Jul (11|12)" "$EVIDENCE_DIR/auth.log" | \
              awk '{print $1, $2, $3, $5, $6, $7, $8, $9}' | \
              sort -k2 -n | tee "$EVIDENCE_DIR/timeline_auth.txt"
          fi

          echo ""
          echo "[*] Extrayendo timestamps de syslog..."
          if [ -f "$EVIDENCE_DIR/syslog" ]; then
            grep -E "Jul (11|12)" "$EVIDENCE_DIR/syslog" | \
              awk '{print $1, $2, $3, $5, $6, $7, $8, $9}' | \
              sort -k2 -n | tee "$EVIDENCE_DIR/timeline_syslog.txt"
          fi

          echo ""
          echo "[*] Timeline consolidada:"
          cat "$EVIDENCE_DIR/timeline_auth.txt" "$EVIDENCE_DIR/timeline_syslog.txt" | \
            sort -k2 -n | uniq | tee "$EVIDENCE_DIR/complete_timeline.txt"

          echo ""
          echo "[+] Timeline construida"
          echo "[*] Archivo: $EVIDENCE_DIR/complete_timeline.txt"

