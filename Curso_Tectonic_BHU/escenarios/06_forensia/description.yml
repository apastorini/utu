---
# ==============================================================================
# Escenario 06: Analisis Forense Post-Incidente - Banco del Sol
# ==============================================================================
# Escenario de analisis forense post-incidente. El servidor db-srv ha sido
# "comprometido" y se han colocado artefactos forenses para su analisis.
# Los estudiantes deben usar herramientas forenses para reconstruir lo
# que sucedio: analizar dumps de memoria, logs del sistema, capturas de
# red, y archivos eliminados.
#
# Objetivos de aprendizaje:
#   1. Preservacion de evidencia y cadena de custodia
#   2. Adquisicion de datos volatiles y no volatiles
#   3. Analisis de logs del sistema
#   4. Recuperacion de archivos eliminados
#   5. Creacion de timeline del ataque
#   6. Escritura de reporte forense
# ==============================================================================

institution: bhu
lab_name: forensia
default_os: ubuntu22
description: |
  Escenario de Analisis Forense Post-Incidente contra Banco del Sol.

  El servidor db-srv ha sido comprometido y se han colocado artefactos
  forenses para su analisis. Los estudiantes deben usar herramientas
  forenses para reconstruir que sucedio durante el ataque.

  Artefactos disponibles:
  - Dump de memoria simulado con procesos, conexiones y historial
  - Logs: auth.log (brute force SSH), syslog (ejecucion de malware)
  - Captura de red con trafico C2 simulado
  - Archivos eliminados recuperables con foremost/sleuthkit
  - Archivos ocultos y directorios
  - Timeline completa del ataque

  El equipo de defensa (blue-team-ws) debe:
  - Preservar evidencia y documentar cadena de custodia
  - Realizar adquisicion volatil y no volatil
  - Analizar logs del sistema
  - Recuperar archivos eliminados
  - Crear timeline del ataque
  - Escribir reporte forense

  Herramientas: volatility3, autopsy, wireshark, tshark, foremost,
  sleuthkit, tcpdump, binwalk

# Maquinas del escenario
guest_settings:
  blue-team-ws:
    hostname: blue-team-ws
    entry_point: yes
    memory: 4096
    vcpu: 4
    disk: 30
    base_os: ubuntu22
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

  db-srv:
    hostname: db-srv
    entry_point: no
    memory: 2048
    vcpu: 2
    disk: 20
    base_os: ubuntu22
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

# Topologia de red
topology:
  - name: lab
    members:
      - blue-team-ws
      - db-srv

# Reglas de trafico
traffic_rules:
  - description: Permitir que blue-team-ws acceda a db-srv para analisis forense
    source: blue-team-ws.lab
    destination: db-srv.lab
    port_range: 1-65535
    protocol: all
