---
# ==============================================================================
# Escenario 02: Ataque de Ransomware - Banco del Sol
# ==============================================================================
# Simulacion de un ataque de ransomware contra el sistema bancario core.
# Un script Python en attack-ws genera documentos de prueba en un directorio
# compartido de core-bank, los encripta con AES-256 y deja un rescate.
# El equipo azul debe detectar, contener, erradicar y recuperar.
#
# Objetivos de aprendizaje:
#   1. Deteccion de encriptacion masiva de archivos
#   2. Contencion de hosts comprometidos sin apagar
#   3. Analisis de variantes de ransomware
#   4. Recuperacion desde backups
#   5. Notificacion a CERTuy y URCDP
# ==============================================================================

institution: bhu
lab_name: ransomware
default_os: ubuntu22
description: |
  Escenario de ataque de Ransomware contra Banco del Sol.

  Un atacante utiliza una estacion de trabajo (attack-ws) para ejecutar un
  script Python que genera 50 archivos de prueba (documentos de clientes,
  datos de cuentas) en /srv/banco/documentos/ de core-bank, los encripta
  con AES-256-CBC usando la libreria cryptography de Python, y deja un
  archivo de rescate con direccion de Bitcoin y temporizador.

  Los archivos en /srv/banco/backup/ NO son encriptados (para probar
  la recuperacion).

  El equipo de defensa (blue-team-ws) debe:
  - Detectar la encriptacion en progreso
  - Contener core-bank inmediatamente (sin apagar - preservar memoria)
  - Analizar la variante de ransomware
  - Recuperar desde backups
  - Reportar a CERTuy dentro de 24 horas

  Herramientas: Python, cryptography, AES-256-CBC
  Servicios objetivo: core-bank (directorio compartido)

# Maquinas del escenario
guest_settings:
  attack-ws:
    hostname: attack-ws
    entry_point: yes
    memory: 2048
    vcpu: 2
    disk: 20
    base_os: kali
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

  blue-team-ws:
    hostname: blue-team-ws
    entry_point: yes
    memory: 4096
    vcpu: 4
    disk: 30
    base_os: ubuntu22
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

  core-bank:
    hostname: core-bank
    entry_point: no
    memory: 2048
    vcpu: 2
    disk: 20
    base_os: ubuntu22
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

# Topologia de red
topology:
  - name: lab
    members:
      - attack-ws
      - blue-team-ws
      - core-bank

# Reglas de trafico
traffic_rules:
  - description: Permitir que attack-ws acceda a core-bank via SSH
    source: attack-ws.lab
    destination: core-bank.lab
    port_range: 22
    protocol: tcp
  - description: Permitir que attack-ws acceda a core-bank para encriptar archivos
    source: attack-ws.lab
    destination: core-bank.lab
    port_range: 1-65535
    protocol: all
  - description: Permitir que blue-team-ws acceda a core-bank para monitoreo
    source: blue-team-ws.lab
    destination: core-bank.lab
    port_range: 1-65535
    protocol: all
  - description: Permitir que blue-team-ws acceda a attack-ws para monitoreo
    source: blue-team-ws.lab
    destination: attack-ws.lab
    port_range: 1-65535
    protocol: all
