---
# ==============================================================================
# Edicion del Laboratorio: Phishing - Banco del Sol
# ==============================================================================
# Archivo de edicion para desplegar el escenario de phishing.
# Configura parametros que pueden cambiar cada vez que se imparte el curso.
# ==============================================================================

# Nombre del lab base en el repositorio. Requerido.
base_lab: phishing

# Nombre de la institucion que ofrece esta edicion del lab.
institution: bhu

# Nombre de esta edicion del lab.
lab_edition_name: banco_del_sol_phishing

# Numero de instancias a desplegar (una por participante o grupo).
instance_number: 1

# Directorio con llaves publicas SSH para los profesores.
teacher_pubkey_dir: ./teacher_pubkeys

# Prefijo para los nombres de usuario de los estudiantes.
student_prefix: trainee

# Directorio con llaves publicas SSH para los estudiantes.
student_pubkey_dir: ./student_pubkeys

# Crear contrasenas pseudo-aleatorias para los estudiantes.
create_students_passwords: true

# Semilla pseudo-aleatoria para generacion de contrasenas.
random_seed: bhu_phishing_2026_banco_del_sol
