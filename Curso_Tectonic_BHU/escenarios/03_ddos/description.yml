---
# ==============================================================================
# Escenario 03: Ataque DDoS - Banco del Sol
# ==============================================================================
# Simulacion de un ataque DDoS contra el servidor web del banco.
# attack-ws lanza ataques SYN flood y HTTP flood contra web-srv usando
# hping3 y slowloris. El servidor web se vuelve inaccesible.
# El equipo azul debe detectar, mitigar y recuperar el servicio.
#
# Objetivos de aprendizaje:
#   1. Deteccion de ataques DDoS en trafico de red
#   2. Analisis de patrones de ataque
#   3. Mitigacion con iptables y fail2ban
#   4. Configuracion de SYN cookies
#   5. Recuperacion del servicio web
# ==============================================================================

institution: bhu
lab_name: ddos
default_os: ubuntu22
description: |
  Escenario de ataque DDoS contra Banco del Sol.

  Un atacante utiliza attack-ws para lanzar ataques SYN flood (con hping3)
  y HTTP flood (con slowloris) contra el servidor web (web-srv). El servidor
  web se vuelve inaccesible para los usuarios legitimos.

  El equipo de defensa (blue-team-ws) debe:
  - Detectar el ataque DDoS monitoreando el trafico
  - Analizar los patrones de ataque con tcpdump
  - Mitigar el ataque con iptables y SYN cookies
  - Configurar fail2ban para proteccion futura
  - Recuperar el servicio web
  - Documentar el incidente

  Herramientas del atacante: hping3, slowloris
  Servicios objetivo: nginx en web-srv

# Maquinas del escenario
guest_settings:
  attack-ws:
    hostname: attack-ws
    entry_point: yes
    memory: 2048
    vcpu: 2
    disk: 20
    base_os: kali
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

  blue-team-ws:
    hostname: blue-team-ws
    entry_point: yes
    memory: 4096
    vcpu: 4
    disk: 30
    base_os: ubuntu22
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

  web-srv:
    hostname: web-srv
    entry_point: no
    memory: 2048
    vcpu: 2
    disk: 20
    base_os: ubuntu22
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

# Topologia de red
topology:
  - name: lab
    members:
      - attack-ws
      - blue-team-ws
      - web-srv

# Reglas de trafico
traffic_rules:
  - description: Permitir que attack-ws acceda a web-srv (HTTP)
    source: attack-ws.lab
    destination: web-srv.lab
    port_range: 80
    protocol: tcp
  - description: Permitir que attack-ws acceda a web-srv (todos los puertos para DDoS)
    source: attack-ws.lab
    destination: web-srv.lab
    port_range: 1-65535
    protocol: all
  - description: Permitir que blue-team-ws acceda a web-srv para monitoreo
    source: blue-team-ws.lab
    destination: web-srv.lab
    port_range: 1-65535
    protocol: all
  - description: Permitir que blue-team-ws acceda a attack-ws para monitoreo
    source: blue-team-ws.lab
    destination: attack-ws.lab
    port_range: 1-65535
    protocol: all
