        ('45678901', 'Ana', 'Martinez', 'ana.martinez@email.com', '099456789', 'Plaza Mayor 101', 30000.00),
        ('56789012', 'Pedro', 'Sanchez', 'pedro.sanchez@email.com', '099567890', 'Calle Norte 202', 95000.00),
        ('67890123', 'Laura', 'Fernandez', 'laura.fernandez@email.com', '099678901', 'Av. Sur 303', 150000.00),
        ('78901234', 'Diego', 'Torres', 'diego.torres@email.com', '099789012', 'Calle Oeste 404', 60000.00),
        ('89012345', 'Sofia', 'Ramirez', 'sofia.ramirez@email.com', '099890123', 'Av. Este 505', 85000.00),
        ('90123456', 'Martin', 'Diaz', 'martin.diaz@email.com', '099901234', 'Plaza Norte 606', 110000.00),
        ('01234567', 'Camila', 'Moreno', 'camila.moreno@email.com', '099012345', 'Boulevard Sur 707', 45000.00);

        INSERT INTO cuentas (cliente_id, numero_cuenta, tipo_cuenta, saldo) VALUES
        (1, '10001', 'Caja de Ahorro', 25000.00),
