        name: admin
        password: "{{ 'admin123' | password_hash('sha512', salt='bhusalt', rounds=5000) }}"
        shell: /bin/bash
        groups: sudo
        create_home: yes

    - name: "Crear archivo bandera (planted por el atacante)"
