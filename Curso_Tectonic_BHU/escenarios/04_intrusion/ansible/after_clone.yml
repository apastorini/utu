---
# ==============================================================================
# Escenario Intrusion - Configuracion Post-Clonado
# ==============================================================================
# Este playbook se ejecuta en cada maquina despues del clonado.
# NO hay conexion a internet disponible.
#
# FLUJO DEL ATAQUE:
#   1. Instalar aplicacion Flask vulnerable en web-srv
#   2. Poblar PostgreSQL en db-srv con datos ficticios
#   3. Almacenar contrasena en texto plano en la config de Flask
#   4. Desde attack-ws: usar sqlmap para explotar SQLi
#   5. SSH de attack-ws a db-srv con credenciales extraidas
#   6. Plantar bandera en core-bank
# ==============================================================================

- name: "Configurar PostgreSQL en db-srv con datos ficticios"
  hosts: db-srv
  gather_facts: yes
  become: yes
  tasks:
    - name: "Crear usuario de PostgreSQL para la aplicacion"
      become_user: postgres
      community.postgresql.postgresql_user:
        name: dbadmin
        password: "BancoDelSol2026!"
        state: present
      ignore_errors: yes

    - name: "Crear usuario alternativo"
      become_user: postgres
      community.postgresql.postgresql_user:
        name: admin
        password: "admin123"
        state: present
      ignore_errors: yes

    - name: "Crear base de datos bancaria"
      become_user: postgres
      community.postgresql.postgresql_db:
        name: banco_del_sol
        owner: dbadmin
        state: present
      ignore_errors: yes

    - name: "Crear usuario del sistema para SSH"
      ansible.builtin.user:
        name: admin
        password: "{{ 'admin123' | password_hash('sha512', salt='bhusalt', rounds=5000) }}"
        shell: /bin/bash
        groups: sudo
        create_home: yes
        comment: "Administrador del Sistema"

