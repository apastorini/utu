    - name: "Configurar PostgreSQL para aceptar conexiones remotas"
      ansible.builtin.lineinfile:
        path: /etc/postgresql/*/main/postgresql.conf
        regexp: "^#?\\s*listen_addresses"
        line: "listen_addresses = '*'"

    - name: "Configurar pg_hba.conf para aceptar conexiones"
      ansible.builtin.lineinfile:
        path: /etc/postgresql/*/main/pg_hba.conf
        insertafter: EOF
        line: "host    all             all             0.0.0.0/0               md5"

    - name: "Reiniciar PostgreSQL"
      ansible.builtin.service:
        name: postgresql
        state: restarted

- name: "Configurar Flask vulnerable en web-srv"
  hosts: web-srv
  gather_facts: yes
  become: yes
  tasks:
    - name: "Crear directorio de la aplicacion"
      ansible.builtin.file:
        path: /opt/banco_web
        state: directory
        mode: "0755"

    - name: "Crear aplicacion Flask vulnerable (SQL Injection)"
      ansible.builtin.copy:
        dest: /opt/banco_web/app.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          """
          Aplicacion Web Vulnerable - Banco del Sol
          ADVERTENCIA: Contiene vulnerabilidad SQL Injection intencional
          Solo para fines educativos
          """
          from flask import Flask, request, render_template_string, redirect, url_for
          import psycopg2

          app = Flask(__name__)

          # CONFIGURACION VULNERABLE - Credenciales en texto plano
          DB_HOST = "{{ hostvars['db-srv']['ansible_default_ipv4']['address'] | default('10.0.0.4') }}"
          DB_NAME = "banco_del_sol"
          DB_USER = "dbadmin"
          DB_PASSWORD = "BancoDelSol2026!"
          DB_PORT = "5432"

          def get_db():
              return psycopg2.connect(
                  host=DB_HOST,
                  database=DB_NAME,
                  user=DB_USER,
                  password=DB_PASSWORD,
                  port=DB_PORT
              )

          @app.route('/')
          def index():
              return render_template_string('''
              <!DOCTYPE html>
              <html>
              <head>
                <title>Banco del Sol - Busqueda de Clientes</title>
                <style>
                  body { font-family: Arial; max-width: 800px; margin: 50px auto; }
                  .search-box { padding: 20px; background: #f5f5f5; border-radius: 10px; }
                  input[type="text"] { width: 300px; padding: 10px; }
                  input[type="submit"] { padding: 10px 20px; background: #1a237e; color: white; border: none; border-radius: 5px; }
                  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                  th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                  th { background: #1a237e; color: white; }
                </style>
              </head>
              <body>
                <h1>Banco del Sol - Sistema de Busqueda de Clientes</h1>
                <div class="search-box">
                  <form method="GET" action="/buscar">
                    <input type="text" name="cedula" placeholder="Ingrese cedula del cliente">
                    <input type="submit" value="Buscar">
                  </form>
                </div>
                <p><small>Sistema interno - Uso autorizado solamente</small></p>
              </body>
              </html>
              ''')

          @app.route('/buscar')
          def buscar():
              cedula = request.args.get('cedula', '')
              # VULNERABILIDAD: SQL Injection - concatenacion directa
              query = "SELECT * FROM clientes WHERE cedula = '" + cedula + "'"
              try:
                  conn = get_db()
                  cur = conn.cursor()
                  cur.execute(query)
                  results = cur.fetchall()
                  cur.close()
                  conn.close()

                  if results:
                      html = '<h2>Resultados de Busqueda</h2>'
                      html += '<table><tr><th>Cedula</th><th>Nombre</th><th>Apellido</th><th>Email</th><th>Saldo</th></tr>'
                      for row in results:
                          html += f'<tr><td>{row[1]}</td><td>{row[2]}</td><td>{row[3]}</td><td>{row[4]}</td><td>${row[7]:,.2f}</td></tr>'
                      html += '</table>'
                      return html
                  else:
                      return '<h2>No se encontraron resultados</h2><a href="/">Volver</a>'
              except Exception as e:
                  return f'<h2>Error en la busqueda</h2><pre>{str(e)}</pre><a href="/">Volver</a>'

          @app.route('/api/clientes')
          def api_clientes():
              # Endpoint adicional vulnerable
              cedula = request.args.get('cedula', '1')
              query = "SELECT * FROM clientes WHERE cedula = '" + cedula + "'"
              try:
                  conn = get_db()
                  cur = conn.cursor()
                  cur.execute(query)
                  results = cur.fetchall()
                  cur.close()
                  conn.close()
                  return {"results": [dict(zip(['id','cedula','nombre','apellido','email','telefono','direccion','saldo','estado'], r)) for r in results]}
              except Exception as e:
                  return {"error": str(e)}

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port=5000, debug=True)

    - name: "Crear script de inicio de Flask"
      ansible.builtin.copy:
        dest: /opt/banco_web/start.sh
        mode: "0755"
        content: |
          #!/bin/bash
          cd /opt/banco_web
          python3 app.py

    - name: "Iniciar Flask en background"
      ansible.builtin.shell: |
        nohup python3 /opt/banco_web/app.py &>/dev/null &
      async: 10
      poll: 0

    - name: "Configurar nginx como proxy reverso"
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/banco
        content: |
          server {
            listen 80 default_server;
            server_name _;

            location / {
              proxy_pass http://127.0.0.1:5000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
            }

            access_log /var/log/nginx/banco_access.log;
            error_log /var/log/nginx/banco_error.log;
          }

    - name: "Habilitar sitio del banco"
      ansible.builtin.command:
        cmd: ln -sf /etc/nginx/sites-available/banco /etc/nginx/sites-enabled/banco

    - name: "Deshabilitar sitio por defecto"
      ansible.builtin.command:
        cmd: rm -f /etc/nginx/sites-enabled/default

    - name: "Reiniciar nginx"
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: yes

    - name: "Crear usuario admin en web-srv"
      ansible.builtin.user:
        name: admin
        password: "{{ 'admin123' | password_hash('sha512', salt='bhusalt', rounds=5000) }}"
        shell: /bin/bash
        groups: sudo
        create_home: yes

