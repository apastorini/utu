---
# ==============================================================================
# Escenario Intrusion - Configuracion Base de Imagenes
# ==============================================================================
# Este playbook se ejecuta DURANTE la creacion de imagenes base (fase Packer).
# Instala todas las dependencias que requieren conexion a internet.
#
# COMPONENTES INSTALADOS:
#   1. attack-ws: python3, sqlmap, nmap, sshpass, curl
#   2. web-srv: python3, flask, openssh-server
#   3. db-srv: postgresql, openssh-server
#   4. core-bank: openssh-server, python3
#   5. blue-team-ws: python3, nmap, tcpdump, net-tools
# ==============================================================================

- name: "Configurar attack-ws para intrusion"
  hosts: attack-ws
  gather_facts: yes
  become: yes
  tasks:
    - name: "Actualizar repositorios"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: "Instalar herramientas de ataque"
      ansible.builtin.package:
        state: present
        name:
          - python3
          - python3-pip
          - sqlmap
          - nmap
          - sshpass
          - curl
          - net-tools
          - openssh-client

    - name: "Instalar librerias de Python"
      ansible.builtin.pip:
        name:
          - requests
          - paramiko
        executable: pip3

- name: "Configurar web-srv con Flask vulnerable"
  hosts: web-srv
  gather_facts: yes
  become: yes
  tasks:
    - name: "Actualizar repositorios"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: "Instalar servidor web y dependencias"
      ansible.builtin.package:
        state: present
        name:
          - python3
          - python3-pip
          - python3-venv
          - openssh-server
          - libpq-dev
          - python3-dev
          - gcc

    - name: "Instalar Flask y dependencias"
      ansible.builtin.pip:
        name:
          - flask
          - psycopg2-binary
          - gunicorn
        executable: pip3

    - name: "Habilitar login SSH con password"
      block:
        - name: "Buscar archivos de configuracion SSH"
          ansible.builtin.find:
            paths: /etc/ssh/sshd_config.d
            file_type: file
          register: ssh_config

        - name: "Ajustar configuracion SSH"
          ansible.builtin.lineinfile:
            path: "{{ item.path }}"
            regex: "^\\s*PasswordAuthentication"
            line: "PasswordAuthentication yes"
          with_items:
            - "{{ ssh_config['files'] }}"
            - { path: '/etc/ssh/sshd_config' }

    - name: "Habilitar y iniciar servicio SSH"
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: yes

- name: "Configurar db-srv con PostgreSQL"
  hosts: db-srv
  gather_facts: yes
  become: yes
  tasks:
    - name: "Actualizar repositorios"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: "Instalar PostgreSQL y herramientas"
      ansible.builtin.package:
        state: present
        name:
          - postgresql
          - postgresql-client
          - python3
          - python3-pip
          - python3-psycopg2
          - openssh-server
          - libpq-dev

    - name: "Instalar psycopg2"
      ansible.builtin.pip:
        name: psycopg2-binary
        executable: pip3

    - name: "Habilitar login SSH con password"
      block:
        - name: "Buscar archivos de configuracion SSH"
          ansible.builtin.find:
            paths: /etc/ssh/sshd_config.d
            file_type: file
          register: ssh_config

        - name: "Ajustar configuracion SSH"
          ansible.builtin.lineinfile:
            path: "{{ item.path }}"
            regex: "^\\s*PasswordAuthentication"
            line: "PasswordAuthentication yes"
          with_items:
            - "{{ ssh_config['files'] }}"
            - { path: '/etc/ssh/sshd_config' }

    - name: "Habilitar y iniciar servicio SSH"
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: yes

    - name: "Habilitar y iniciar PostgreSQL"
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: yes

- name: "Configurar core-bank"
  hosts: core-bank
  gather_facts: yes
  become: yes
  tasks:
    - name: "Actualizar repositorios"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: "Instalar herramientas"
      ansible.builtin.package:
        state: present
        name:
          - openssh-server
          - python3

    - name: "Habilitar login SSH con password"
      block:
        - name: "Buscar archivos de configuracion SSH"
          ansible.builtin.find:
            paths: /etc/ssh/sshd_config.d
            file_type: file
          register: ssh_config

        - name: "Ajustar configuracion SSH"
          ansible.builtin.lineinfile:
            path: "{{ item.path }}"
            regex: "^\\s*PasswordAuthentication"
            line: "PasswordAuthentication yes"
          with_items:
            - "{{ ssh_config['files'] }}"
            - { path: '/etc/ssh/sshd_config' }

    - name: "Habilitar y iniciar servicio SSH"
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: yes

- name: "Configurar blue-team-ws"
  hosts: blue-team-ws
  gather_facts: yes
  become: yes
  tasks:
    - name: "Actualizar repositorios"
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: "Instalar herramientas de monitoreo"
      ansible.builtin.package:
        state: present
        name:
          - python3
          - python3-pip
          - nmap
          - tcpdump
          - net-tools
          - curl
          - wireshark-common
          - tshark
