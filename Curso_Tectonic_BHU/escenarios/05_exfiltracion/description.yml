---
# ==============================================================================
# Escenario 05: Exfiltracion de Datos via DNS Tunneling - Banco del Sol
# ==============================================================================
# Simulacion de exfiltracion de datos sensibles del banco utilizando
# DNS tunneling. Un atacante (que ya tiene acceso a db-srv) exfiltra
# datos de clientes (cedulas, numeros de cuenta, saldos) codificandolos
# en consultas DNS usando iodine/dnscat2.
# El equipo azul debe detectar el trafico DNS inusual y contener la fuga.
#
# Objetivos de aprendizaje:
#   1. Deteccion de DNS tunneling en trafico de red
#   2. Analisis de trafico DNS con tshark
#   3. Contencion de exfiltracion de datos
#   4. Evaluacion de alcance de datos comprometidos
#   5. Notificacion a URCDP (72 horas) y CERTuy
# ==============================================================================

institution: bhu
lab_name: exfiltracion
default_os: ubuntu22
description: |
  Escenario de Exfiltracion de Datos via DNS Tunneling contra Banco del Sol.

  Un atacante que ya tiene acceso comprometido a db-srv exfiltra datos
  sensibles de clientes (cedulas, nombres, numeros de cuenta, saldos,
  emails) codificandolos en consultas DNS utilizando dnscat2.

  El equipo de defensa (blue-team-ws) debe:
  - Detectar el trafico DNS inusual (volumen alto, consultas TXT)
  - Decodificar el trafico de DNS tunneling
  - Identificar que datos estan siendo exfiltrados
  - Bloquear el DNS tunneling en el firewall
  - Evaluar el alcance de datos comprometidos
  - Notificar a URCDP dentro de 72 horas y a CERTuy

  Herramientas del atacante: dnscat2, iodine
  Servicios objetivo: DNS tunneling via consultas DNS

# Maquinas del escenario
guest_settings:
  attack-ws:
    hostname: attack-ws
    entry_point: yes
    memory: 2048
    vcpu: 2
    disk: 20
    base_os: kali
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

  blue-team-ws:
    hostname: blue-team-ws
    entry_point: yes
    memory: 4096
    vcpu: 4
    disk: 30
    base_os: ubuntu22
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

  db-srv:
    hostname: db-srv
    entry_point: no
    memory: 2048
    vcpu: 2
    disk: 20
    base_os: ubuntu22
    internet_access: no
    copies: 1
    monitor: no
    red_team_agent: no
    blue_team_agent: no

# Topologia de red
topology:
  - name: lab
    members:
      - attack-ws
      - blue-team-ws
      - db-srv

# Reglas de trafico
traffic_rules:
  - description: Permitir que db-srv realice consultas DNS a attack-ws
    source: db-srv.lab
    destination: attack-ws.lab
    port_range: 53
    protocol: udp
  - description: Permitir que db-srv realice consultas DNS TCP a attack-ws
    source: db-srv.lab
    destination: attack-ws.lab
    port_range: 53
    protocol: tcp
  - description: Permitir que blue-team-ws acceda a todos los servidores para monitoreo
    source: blue-team-ws.lab
    destination: lab
    port_range: 1-65535
    protocol: all
  - description: Permitir que attack-ws acceda a db-srv (ya comprometido)
    source: attack-ws.lab
    destination: db-srv.lab
    port_range: 1-65535
    protocol: all
